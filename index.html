function openAssetForm(a=null){
  modal({
    title: a?'Edit asset':'Add asset',
    body:`<form id="af">
      <div class="field"><label>Asset name *</label><input name="name" value="${a?.name||''}" required /></div>
      <div class="grid-2">
        <div class="field"><label>Category</label>
          <select name="category">${['Kitchen','Bedding','Electronics','Furniture','Other'].map(c=>`<option ${a?.category===c?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Quantity in stock</label><input type="number" min="0" name="stock" id="af-stock" value="${a?.stock||0}" oninput="assetCalcTotals()" /></div>
        <div class="field"><label>Buying price per unit (KES)</label><input type="number" min="0" step="0.01" name="buying_price" id="af-buying" value="${a?.buying_price||0}" oninput="assetCalcTotals()" /></div>
        <div class="field"><label>Loan price per unit (KES)</label><input type="number" min="0" step="0.01" name="loan_price" id="af-loan" value="${a?.loan_price||0}" oninput="assetCalcTotals()" /></div>
        <div class="field"><label>Reorder level</label><input type="number" min="0" name="reorder_level" value="${a?.reorder_level||5}" /></div>
      </div>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-top:2px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:8px">Total inventory value (qty × price)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><div style="font-size:11px;color:var(--text-muted)">At cost</div><div style="font-weight:700;font-size:15px" id="af-totalcost">${KES((a?.stock||0)*(a?.buying_price||0))}</div></div>
          <div><div style="font-size:11px;color:var(--text-muted)">At loan price</div><div style="font-weight:700;font-size:15px;color:var(--accent)" id="af-totalloan">${KES((a?.stock||0)*(a?.loan_price||0))}</div></div>
        </div>
      </div>
    </form>`,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Save', cls:'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const fd = new FormData($('af')); const row = Object.fromEntries(fd);
        ['stock','buying_price','loan_price','reorder_level'].forEach(k=>row[k]=Number(row[k])||0);
        if(a){
          const { error } = await sb.from('pb_inventory').update(row).eq('id', a.id);
          if(error) return toast(error.message,'error');
          Object.assign(a, row); audit('update','pb_inventory',a.id);
        } else {
          const { data, error } = await sb.from('pb_inventory').insert({ ...row, business_id: state.staff.business_id || null }).select().single();
          if(error) return toast(error.message,'error');
          state.data.inventory.unshift(data); audit('create','pb_inventory',data.id);
        }
        closeModal(); render(); toast(a?'Asset updated':'Asset added','success');
      }}
    ]
  });
}
function assetCalcTotals(){
  const qty = Number(document.getElementById('af-stock')?.value||0);
  const buy = Number(document.getElementById('af-buying')?.value||0);
  const loan = Number(document.getElementById('af-loan')?.value||0);
  const tc = document.getElementById('af-totalcost'); if(tc) tc.textContent = KES(qty*buy);
  const tl = document.getElementById('af-totalloan'); if(tl) tl.textContent = KES(qty*loan);
}
function quickRestock(a){
  modal({
    title:`Restock — ${a.name}`,
    body:`<div class="field"><label>Add units</label><input id="qr" type="number" min="1" value="1" /></div>`,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Restock', cls:'btn-primary', onClick: async () => {
        const n = Number($('qr').value)||0; if(n<=0) return;
        const newStock = a.stock + n;
        await sb.from('pb_inventory').update({ stock: newStock }).eq('id', a.id);
        a.stock = newStock; audit('restock','pb_inventory',a.id,null,{ added:n });
        closeModal(); render(); toast('Stock updated','success');
      }}
    ]
  });
}
function exportInventory(){
  const ws = XLSX.utils.json_to_sheet(state.data.inventory.map(a=>({
    Name:a.name, Category:a.category, Buying:a.buying_price, LoanPrice:a.loan_price, Stock:a.stock, Reorder:a.reorder_level
  })));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
  XLSX.writeFile(wb, `inventory_${todayISO()}.xlsx`);
}

/* =====================================================================
 * PAGE: ORDERS
 * ===================================================================== */
function pageOrders(){
  const isAdmin = state.staff.role==='admin';
  const r = state.staff?.app_role || state.staff?.role || 'officer';
  const canSeeAll = isAdmin || r==='ceo' || r==='branch_manager' || r==='inventory_officer' || r==='storekeeper';
  const canCreate = canCreateClientOrders();
  const myGroupIds = canSeeAll ? [] : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);
  const tab = state._orderTab || 'pending';

  const list = state.data.orders
    .filter(o => canSeeAll || myGroupIds.includes(o.group_id) || o.recorded_by === state.staff.id)
    .filter(o => tab === 'all' ? true : o.status === tab);
  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Orders</h1><div class="desc">Member asset orders awaiting approval and fulfilment.</div></div>
      <div class="actions">
        ${canCreate ? `<button class="btn btn-primary" onclick="openOrderForm()">New order</button>`:''}
      </div>
    </div>
    <div class="tabs">
      ${['pending','approved','rejected','fulfilled','all'].map(t => `<button class="${tab===t?'active':''}" onclick="state._orderTab='${t}';pageOrders()">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Member</th><th>Group</th><th>Asset</th><th class="num">Qty</th><th>Status</th><th>Recorded By</th><th></th></tr></thead>
      <tbody>
        ${list.map(o => {
          const m = state.data.members.find(x=>x.id===o.member_id);
          const g = state.data.groups.find(x=>x.id===o.group_id);
          const off = state.data.staff.find(x => x.id === o.recorded_by);
          const cls = ({pending:'b-yellow',approved:'b-blue',rejected:'b-red',fulfilled:'b-green'})[o.status];
          return `<tr>
            <td>${fmtDate(o.ordered_on)}</td>
            <td>${m?.full_name||'—'}</td>
            <td>${g?.name||'—'}</td>
            <td>${o.asset_name}</td>
            <td class="num">${o.quantity}</td>
            <td><span class="badge ${cls}">${o.status}</span></td>
            <td style="font-size:12px;color:var(--text-muted)">${off?.full_name||'—'}</td>
            <td><button class="act-btn" onclick="orderActions(event,'${o.id}')">···</button></td>
          </tr>`;
        }).join('') || `<tr><td colspan="8"><div class="empty"><h4>No orders</h4><p>Place a new order on behalf of a member.</p></div></td></tr>`}
      </tbody>
    </table></div>
  `;
}
function orderActions(ev, id){
  const o = state.data.orders.find(x=>x.id===id);
  const isAdmin = state.staff.role==='admin';
  const canApprove = isAdmin || state.perms?.can_approve_orders;
  const items = [];
  if(o.status==='pending' && canApprove){
    items.push({ label:'Approve & issue loan', onClick: ()=>approveOrder(o) });
    items.push({ label:'Reject order', danger:true, onClick: ()=>rejectOrder(o) });
  }
  if(!items.length){ items.push({ label:'View', onClick: ()=>{} }); }
  showActMenu(ev, items);
}
// _orderLines holds line items for the order form: [{ asset_id, asset_name, loan_price, stock, quantity }]
let _orderLines = [];

function _renderOrderLines(){
  const container = document.getElementById('ord-lines-container');
  if(!container) return;
  container.innerHTML = _orderLines.map((line, i) => `
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;position:relative" id="ord-line-${i}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)">Asset ${i+1}</div>
        ${_orderLines.length > 1 ? `<button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger);padding:2px 6px" onclick="_removeOrderLine(${i})">✕ Remove</button>` : ''}
      </div>
      <div class="field" style="margin-bottom:8px">
        <div class="search-box" style="position:relative">
          <input id="ord-ast-search-${i}" placeholder="Search asset…" autocomplete="off" style="padding-left:34px" oninput="_filterOrderAssets(${i})" onfocus="_filterOrderAssets(${i})" value="${line.asset_name||''}" />
          <span class="ic" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none">${ic('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>')}</span>
        </div>
        <div id="ord-ast-list-${i}" style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);display:none;background:var(--surface);box-shadow:var(--shadow-md)"></div>
        ${line.asset_name ? `<div class="muted" style="font-size:11px;margin-top:3px">✓ ${line.asset_name} · ${KES(line.loan_price||0)} · stock: ${line.stock||0}</div>` : ''}
      </div>
      <div class="field" style="margin-bottom:0">
        <label style="font-size:11px">Quantity</label>
        <input type="number" min="1" value="${line.quantity||1}" style="width:100px" oninput="_updateOrderLineQty(${i}, this.value)" />
      </div>
    </div>
  `).join('');
  _updateOrderTotalSummary();
}

function _filterOrderAssets(lineIdx){
  const input = document.getElementById(`ord-ast-search-${lineIdx}`);
  const list = document.getElementById(`ord-ast-list-${lineIdx}`);
  if(!input || !list) return;
  const q = (input.value||'').toLowerCase();
  const matches = state.data.inventory.filter(a=>a.name.toLowerCase().includes(q)).slice(0,10);
  list.style.display = matches.length ? 'block' : 'none';
  list.innerHTML = matches.map(a=>`<div style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px" onmousedown="_selectOrderLineAsset(${lineIdx},'${a.id}','${a.name.replace(/'/g,"\\'")}',${a.loan_price},${a.stock})">${a.name}<span class="muted" style="font-size:11px;margin-left:8px">${KES(a.loan_price)} · stock ${a.stock}</span></div>`).join('');
}

function _selectOrderLineAsset(lineIdx, id, name, price, stock){
  if(!_orderLines[lineIdx]) return;
  _orderLines[lineIdx].asset_id = id;
  _orderLines[lineIdx].asset_name = name;
  _orderLines[lineIdx].loan_price = price;
  _orderLines[lineIdx].stock = stock;
  _renderOrderLines();
  setTimeout(()=>{ const el = document.getElementById(`ord-ast-list-${lineIdx}`); if(el) el.style.display='none'; },50);
}

function _updateOrderLineQty(lineIdx, val){
  if(!_orderLines[lineIdx]) return;
  _orderLines[lineIdx].quantity = Math.max(1, parseInt(val)||1);
  _updateOrderTotalSummary();
}

function _removeOrderLine(lineIdx){
  _orderLines.splice(lineIdx, 1);
  _renderOrderLines();
}

function _addOrderLine(){
  _orderLines.push({ asset_id:'', asset_name:'', loan_price:0, stock:0, quantity:1 });
  _renderOrderLines();
  // Attach outside-click dismissal for new line
  setTimeout(()=>{
    const i = _orderLines.length - 1;
    document.addEventListener('click', e=>{
      const list = document.getElementById(`ord-ast-list-${i}`);
      if(list && !e.target.closest(`#ord-ast-list-${i}`) && e.target.id!==`ord-ast-search-${i}`) list.style.display='none';
    });
  },50);
}

function _updateOrderTotalSummary(){
  const out = document.getElementById('ord-loan-out'); if(!out) return;
  const principal = _orderLines.reduce((a,l)=>a+(Number(l.loan_price||0)*Number(l.quantity||1)),0);
  const wi = Number(document.getElementById('ord-wi')?.value)||0;
  if(!principal){ out.innerHTML=''; return; }
  out.innerHTML = `Total loan value: <b>${KES(principal)}</b>${wi ? ` · Total payable ${KES(computeSchedule(principal,wi,'flat',new Date()).totalPayable)}` : ' — enter desired installment to see repayment summary.'}`;
}

function openOrderForm(){
  if(!canCreateClientOrders()){
    toast('You do not have permission to create client orders.', 'error');
    return;
  }
  _orderLines = [{ asset_id:'', asset_name:'', loan_price:0, stock:0, quantity:1 }];
  modal({
    title:'New member order',
    body:`
      <div class="field"><label>Member *</label>
        <div class="search-box" style="position:relative">
          <input id="ord-mem-search" placeholder="Type member name…" autocomplete="off" style="padding-left:34px" oninput="filterOrderMembers()" />
          <span class="ic" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none">${ic('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>')}</span>
        </div>
        <div id="ord-mem-list" style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);display:none;background:var(--surface);box-shadow:var(--shadow-md)"></div>
        <input type="hidden" id="ord-mem-id" />
        <div id="ord-mem-sel" class="muted" style="font-size:12px;margin-top:4px"></div>
      </div>

      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:8px">Assets *</div>
      <div id="ord-lines-container"></div>
      <button type="button" class="btn btn-outline btn-sm" style="margin-bottom:14px" onclick="_addOrderLine()">+ Add Asset</button>

      <div class="field"><label>Order date</label><input type="date" id="ord-date" value="${todayISO()}" /></div>
      <div class="divider" style="margin:10px 0 14px"></div>
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:10px">Desired Loan Terms</div>
      <div class="grid-2">
        <div class="field"><label>Desired Number of Weeks</label><input id="ord-weeks" type="number" min="1" max="48" placeholder="e.g. 10" oninput="ordCalcFromWeeks()" /></div>
        <div class="field"><label>Desired Weekly Installment (KES)</label><input id="ord-wi" type="number" min="1" placeholder="e.g. 500" oninput="ordCalcFromInstallment()" /></div>
      </div>
      <div id="ord-loan-out" class="muted" style="font-size:12px;margin-bottom:10px"></div>
      <div class="field"><label>Notes</label><textarea id="ord-notes" rows="2"></textarea></div>
    `,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Submit order', cls:'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const member_id = $('ord-mem-id').value;
        const member = state.data.members.find(x=>x.id===member_id);
        if(!member) return toast('Please select a member.','error');

        const validLines = _orderLines.filter(l=>l.asset_id && Number(l.quantity)>0);
        if(!validLines.length) return toast('Please select at least one asset.','error');

        if(!memberEligible(member.id)){
          if(!confirm(`This member has not yet reached the savings eligibility threshold of ${KES(state.settings?.savings_threshold||400)}. Submit order anyway?`)) return;
        }

        // Combine asset names into a single string e.g. "Sofa (x1), Mattress (x2)"
        const asset_name = validLines.map(l=>`${l.asset_name} (x${l.quantity})`).join(', ');
        const totalQuantity = validLines.reduce((a,l)=>a+Number(l.quantity),0);
        // Use the first asset's id for backward compatibility; full data goes into notes JSON
        const primaryAsset = validLines[0];

        const desiredWeeks = Number($('ord-weeks').value)||null;
        const desiredWeekly = Number($('ord-wi').value)||null;
        const userNotes = $('ord-notes').value||'';

        // Save asset line items as JSON in the notes field, appending any user notes
        const notesPayload = JSON.stringify({ assets: validLines.map(l=>({ asset_id:l.asset_id, asset_name:l.asset_name, loan_price:l.loan_price, stock:l.stock, quantity:l.quantity })), user_notes: userNotes });

        const ins = {
          business_id: state.staff.business_id || null,
          member_id: member.id, group_id: member.group_id,
          asset_id: primaryAsset.asset_id, asset_name,
          quantity: totalQuantity, ordered_on: $('ord-date').value, status:'pending',
          recorded_by: state.staff.id, notes: notesPayload,
          desired_weeks: desiredWeeks, desired_weekly_installment: desiredWeekly
        };
        const { data, error } = await sb.from('pb_orders').insert(ins).select().single();
        if(error) return toast(error.message,'error');
        state.data.orders.unshift(data); audit('order_create','pb_orders',data.id);
        closeModal(); render(); toast('Order submitted for approval','success');
      }}
    ]
  });
  setTimeout(()=>{
    _renderOrderLines();
    $('ord-mem-search').addEventListener('focus', filterOrderMembers);
    document.addEventListener('click', e => {
      if(!e.target.closest('#ord-mem-list') && e.target.id!=='ord-mem-search') { const el=$('ord-mem-list'); if(el) el.style.display='none'; }
    });
  }, 50);
}
function _ordGetPrincipal(){
  // Sum across all order lines
  return _orderLines.reduce((a,l)=>a+(Number(l.loan_price||0)*Number(l.quantity||1)),0);
}
let _ordUpdating = false;
function ordCalcFromWeeks(){
  if(_ordUpdating) return; _ordUpdating = true;
  const weeks = Number($('ord-weeks')?.value)||0;
  const principal = _ordGetPrincipal();
  if(weeks > 0 && principal > 0){
    const rate = state.settings?.monthly_interest_rate || 2.5;
    const weeklyRate = (rate / 100) / 4;
    const totalPayable = principal * (1 + weeklyRate * weeks);
    $('ord-wi').value = Math.ceil(totalPayable / weeks);
  }
  _ordUpdating = false;
  ordUpdateSummary();
}
function ordCalcFromInstallment(){
  if(_ordUpdating) return; _ordUpdating = true;
  const weekly = Number($('ord-wi')?.value)||0;
  const principal = _ordGetPrincipal();
  if(weekly > 0 && principal > 0){
    const r = computeSchedule(principal, weekly, 'flat', new Date());
    $('ord-weeks').value = r.weeks;
  }
  _ordUpdating = false;
  ordUpdateSummary();
}
function ordCalcLoanTerms(){
  // Re-derive from whichever field was last populated
  const weeks = Number($('ord-weeks')?.value)||0;
  const wi = Number($('ord-wi')?.value)||0;
  if(weeks > 0) ordCalcFromWeeks();
  else if(wi > 0) ordCalcFromInstallment();
  else ordUpdateSummary();
}
function ordUpdateSummary(){
  _updateOrderTotalSummary();
}
function filterOrderMembers(){
  const q = ($('ord-mem-search').value||'').toLowerCase();
  const list = $('ord-mem-list'); if(!list) return;
  const r = state.staff?.app_role || state.staff?.role || 'officer';
  const canSeeAll = state.staff.role === 'admin' || r === 'ceo' || r === 'branch_manager' || r === 'inventory_officer' || r === 'storekeeper';
  const matches = state.data.members.filter(m => {
    if(m.status !== 'active') return false;
    if(!canSeeAll){
      // Loan officers only see members whose group is assigned to them
      const grp = state.data.groups.find(g => g.id === m.group_id);
      if(!grp || grp.officer_id !== state.staff.id) return false;
    }
    return m.full_name.toLowerCase().includes(q) || (m.national_id||'').includes(q);
  }).slice(0,10);
  list.style.display = matches.length ? 'block' : 'none';
  list.innerHTML = matches.map(m=>{
    const g = state.data.groups.find(x=>x.id===m.group_id);
    return `<div style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px" onmousedown="selectOrderMember('${m.id}','${m.full_name.replace(/'/g,"\\'")}','${g?.name||''}')">${m.full_name}<span class="muted" style="font-size:11px;margin-left:8px">${g?.name||''}</span></div>`;
  }).join('');
}
function selectOrderMember(id, name, groupName){
  $('ord-mem-id').value = id;
  $('ord-mem-search').value = name;
  $('ord-mem-sel').textContent = groupName ? '✓ '+name+' · '+groupName : '✓ '+name;
  $('ord-mem-list').style.display = 'none';
}
function filterOrderAssets(){
  const q = ($('ord-ast-search').value||'').toLowerCase();
  const list = $('ord-ast-list'); if(!list) return;
  const matches = state.data.inventory.filter(a=>a.name.toLowerCase().includes(q)).slice(0,10);
  list.style.display = matches.length ? 'block' : 'none';
  list.innerHTML = matches.map(a=>`<div style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px" onmousedown="selectOrderAsset('${a.id}','${a.name.replace(/'/g,"\\'")}',${a.loan_price},${a.stock})">${a.name}<span class="muted" style="font-size:11px;margin-left:8px">${KES(a.loan_price)} · stock ${a.stock}</span></div>`).join('');
}
function selectOrderAsset(id, name, price, stock){
  $('ord-ast-id').value = id;
  $('ord-ast-search').value = name;
  $('ord-ast-sel').textContent = '✓ '+name+' · '+KES(price)+' · stock: '+stock;
  $('ord-ast-list').style.display = 'none';
  ordCalcLoanTerms();
}
function rejectOrder(o){
  modal({
    title:'Reject order', body:`<div class="field"><label>Reason</label><textarea id="rj" rows="3" required></textarea></div>`,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Reject', cls:'btn-danger', onClick: async () => {
        const reason = $('rj').value.trim(); if(!reason) return toast('Reason is required.','error');
        await sb.from('pb_orders').update({ status:'rejected', rejection_reason:reason, approved_by:state.staff.id }).eq('id', o.id);
        Object.assign(o, { status:'rejected', rejection_reason:reason });
        audit('order_reject','pb_orders',o.id,null,{reason}); closeModal(); render(); toast('Order rejected','warn');
      }}
    ]
  });
}
function approveOrder(o){
  const member = state.data.members.find(x=>x.id===o.member_id);
  if(!member) return toast('Order references missing member.','error');

  // === Fix 5: Parse multi-asset line items from notes JSON ===
  let assetLines = null;
  if(o.notes){
    try {
      const parsed = JSON.parse(o.notes);
      if(parsed && Array.isArray(parsed.assets) && parsed.assets.length) {
        assetLines = parsed.assets;
      }
    } catch(e){ /* legacy order — fall back to single-asset */ }
  }

  // Build resolved lines array with live inventory objects
  let resolvedLines = [];
  if(assetLines){
    for(const line of assetLines){
      const asset = state.data.inventory.find(x=>x.id===line.asset_id);
      if(!asset) return toast(`Asset "${line.asset_name}" not found in inventory.`,'error');
      if(asset.stock < Number(line.quantity)) return toast(`Insufficient stock for "${asset.name}" (need ${line.quantity}, have ${asset.stock}).`,'error');
      resolvedLines.push({ asset, quantity: Number(line.quantity), loan_price: Number(line.loan_price||asset.loan_price) });
    }
  } else {
    // Legacy single-asset order
    const asset = state.data.inventory.find(x=>x.id===o.asset_id);
    if(!asset) return toast('Order references missing asset.','error');
    if(asset.stock < o.quantity) return toast('Insufficient stock to fulfill this order.','error');
    resolvedLines.push({ asset, quantity: Number(o.quantity), loan_price: Number(asset.loan_price) });
  }

  const principal = resolvedLines.reduce((a,l)=>a+(l.loan_price*l.quantity),0);

  // === 5x Savings Multiplier Check ===
  const memberTotalSavings = memberSavings(member.id);
  const maxAllowedLoan = memberTotalSavings * 5;
  if(memberTotalSavings > 0 && principal > maxAllowedLoan){
    return toast(`Requested loan of ${KES(principal)} exceeds 5x member savings limit of ${KES(maxAllowedLoan)} (savings: ${KES(memberTotalSavings)}).`, 'error');
  }

  // === Fix 4: 25% deposit for loans > 20,000 ===
  const requiresDeposit = principal > 20000;
  const depositAmount = requiresDeposit ? Math.round(principal * 0.25) : 0;

  // === Optional 3% fees — approver decides based on item type ===
  const serviceCharge = loanServiceCharge(principal);
  const applicationFee = Math.round(principal * 0.03 * 100) / 100;
  const insuranceFee   = Math.round(principal * 0.03 * 100) / 100;

  const assetSummaryRows = resolvedLines.map(l=>`<tr><td>${l.asset.name} × ${l.quantity}</td><td><b>${KES(l.loan_price*l.quantity)}</b></td></tr>`).join('');

  modal({
    title:`Approve & issue loan — ${member.full_name}`,
    body:`<form id="al">
      <table class="summary-table">
        ${assetSummaryRows}
        <tr><td>Total loan principal</td><td><b>${KES(principal)}</b></td></tr>
        <tr><td>6% service charge included in repayments</td><td><b>${KES(serviceCharge)}</b></td></tr>
        <tr><td style="font-size:11px;color:var(--text-muted)">Member savings (5× limit: ${KES(maxAllowedLoan)})</td><td style="font-size:11px;color:var(--text-muted)">${KES(memberTotalSavings)}</td></tr>
      </table>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0;font-size:13px">
        <div style="font-weight:700;margin-bottom:8px">Upfront Fees (optional — for foodstuffs & building materials)</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="chk-app-fee" value="${applicationFee}" />
            <span>3% Application Fee — <b>${KES(applicationFee)}</b> (deducted upfront)</span>
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="chk-ins-fee" value="${insuranceFee}" />
            <span>3% Insurance Cover — <b>${KES(insuranceFee)}</b> (deducted upfront)</span>
          </label>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px">If not checked, the client repays all charges gradually through weekly installments.</div>
      </div>
      ${requiresDeposit ? `
      <div style="background:var(--warning-50);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0;font-size:13px">
        <div style="font-weight:700;color:var(--warning);margin-bottom:4px">⚠️ Deposit Required</div>
        <div>A <b>25% deposit of ${KES(depositAmount)}</b> is required for loans over KES 20,000. This will be recorded as an immediate upfront repayment when the loan is issued.</div>
      </div>` : ''}
      <div class="divider"></div>
      <div class="grid-2">
        <div class="field"><label>Desired Number of Weeks</label><input id="al-weeks" type="number" min="1" max="48" placeholder="e.g. 10" value="${o.desired_weeks||''}" /></div>
        <div class="field"><label>Weekly Installment (KES)</label><input id="wi" type="number" min="1" placeholder="e.g. 500" value="${o.desired_weekly_installment||''}" /></div>
      </div>
      <div class="field"><label>Loan start date</label><input id="sd" type="date" value="${todayISO()}" /></div>
      <div id="al-out" class="muted" style="font-size:12px"></div>
    </form>`,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Issue loan', cls:'btn-primary', onClick: async () => {
        // Double-tap guard — disable button immediately
        const issueBtn = document.querySelector('.modal-foot .btn-primary');
        if(issueBtn){
          if(issueBtn.dataset.processing === '1') return;
          issueBtn.dataset.processing = '1';
          issueBtn.disabled = true;
          issueBtn.textContent = 'Issuing…';
        }
        // Check if a loan already exists for this order (duplicate prevention)
        const existingLoan = state.data.loans.find(l => l.order_id === o.id && l.status === 'active');
        if(existingLoan){
          if(issueBtn){ issueBtn.disabled=false; issueBtn.textContent='Issue loan'; delete issueBtn.dataset.processing; }
          return toast('A loan has already been issued for this order. Check Active Loans.','warn');
        }
        if(!(await ensureFreshToken())){
          if(issueBtn){ issueBtn.disabled=false; issueBtn.textContent='Issue loan'; delete issueBtn.dataset.processing; }
          return;
        }
        const weekly = Number($('wi').value)||0;
        const weeksInput = Number($('al-weeks').value)||0;
        const start = new Date($('sd').value);
        if(weekly <= 0) return toast('Weekly installment must be greater than zero.','error');
        const r = computeSchedule(principal, weekly, 'flat', start);
        const totalPayableWithCharge = loanTotalWithServiceCharge(r, principal);
        const serviceChargeWeeks = weekly > 0 ? Math.ceil(totalPayableWithCharge / weekly) : r.weeks;
        const effectiveWeeks = weeksInput > 0 ? weeksInput : serviceChargeWeeks;
        if(effectiveWeeks > 48 || serviceChargeWeeks > 48){
          return toast('The maximum allowed loan term is 48 weeks. Please increase the weekly payment or reduce the weeks.','error');
        }
        const end = new Date(start); end.setDate(end.getDate() + 7*serviceChargeWeeks);
        const primaryLine = resolvedLines[0];
        const memberGroup = state.data.groups.find(g => g.id === member.group_id);
        const resolvedOfficerId = memberGroup?.officer_id || o.recorded_by || null;
        const loan = {
          business_id: state.staff.business_id || null,
          member_id: member.id, group_id: member.group_id, officer_id: resolvedOfficerId,
          order_id: o.id, asset_id: primaryLine.asset.id, asset_name: o.asset_name,
          asset_quantity: resolvedLines.reduce((a,l)=>a+l.quantity,0),
          loan_value: principal, weekly_installment: weekly, total_payable: totalPayableWithCharge,
          start_date: $('sd').value, expected_end_date: end.toISOString().slice(0,10), status:'active'
        };
        const { data: loanData, error: loanErr } = await sb.from('pb_loans').insert(loan).select().single();
        if(loanErr){
          if(issueBtn){ issueBtn.disabled=false; issueBtn.textContent='Issue loan'; delete issueBtn.dataset.processing; }
          return toast('Loan save failed: '+loanErr.message,'error');
        }

        for(const line of resolvedLines){
          await sb.from('pb_inventory').update({ stock: line.asset.stock - line.quantity }).eq('id', line.asset.id);
          line.asset.stock -= line.quantity;
        }

        await sb.from('pb_orders').update({ status:'fulfilled', approved_by: state.staff.id }).eq('id', o.id);
        Object.assign(o, { status:'fulfilled', approved_by: state.staff.id });
        state.data.loans.unshift(loanData);
        audit('loan_issue','pb_loans',loanData.id,null,loan);

        const interestRatio = totalPayableWithCharge > 0 ? (totalPayableWithCharge - principal) / totalPayableWithCharge : 0;

        // 25% deposit for loans > KES 20,000
        if(requiresDeposit && depositAmount > 0){
          const depositInterest = +(depositAmount * interestRatio).toFixed(2);
          const depositPrincipal = +(depositAmount - depositInterest).toFixed(2);
          const dep = {
            business_id: state.staff.business_id || null,
            loan_id: loanData.id, member_id: member.id, group_id: member.group_id,
            recorded_by: state.staff.id,
            amount: depositAmount, principal: depositPrincipal, interest: depositInterest,
            meeting_date: $('sd').value,
            notes: 'Auto-recorded 25% upfront deposit (loan > KES 20,000)', status: 'approved'
          };
          const { data: depData, error: depErr } = await sb.from('pb_repayments').insert(dep).select().single();
          if(depErr) toast('Deposit repayment record failed: '+depErr.message,'warn');
          else { state.data.repayments.unshift(depData); audit('deposit_repayment','pb_repayments',loanData.id,null,dep); }
        }

        // Optional upfront fees — only if approver checked the boxes
        const chargeAppFee = document.getElementById('chk-app-fee')?.checked;
        const chargeInsFee = document.getElementById('chk-ins-fee')?.checked;

        if(chargeAppFee && applicationFee > 0){
          const feeRow = {
            business_id: state.staff.business_id || null,
            loan_id: loanData.id, member_id: member.id, group_id: member.group_id,
            recorded_by: state.staff.id,
            amount: applicationFee, principal: applicationFee, interest: 0,
            meeting_date: $('sd').value,
            notes: 'Upfront 3% Application Fee (approver selected)', status: 'approved'
          };
          const { data: feeData } = await sb.from('pb_repayments').insert(feeRow).select().single();
          if(feeData) state.data.repayments.unshift(feeData);
        }

        if(chargeInsFee && insuranceFee > 0){
          const feeRow = {
            business_id: state.staff.business_id || null,
            loan_id: loanData.id, member_id: member.id, group_id: member.group_id,
            recorded_by: state.staff.id,
            amount: insuranceFee, principal: insuranceFee, interest: 0,
            meeting_date: $('sd').value,
            notes: 'Upfront 3% Insurance Cover (approver selected)', status: 'approved'
          };
          const { data: feeData } = await sb.from('pb_repayments').insert(feeRow).select().single();
          if(feeData) state.data.repayments.unshift(feeData);
        }

        closeModal(); render();
        toast(`Loan issued successfully${requiresDeposit?' — 25% deposit recorded':''}${chargeAppFee||chargeInsFee?' — selected fees recorded':''}.`,'success');
      }}
    ]
  });
  setTimeout(() => {
    let _updating = false;
    const updFromWeeks = () => {
      if(_updating) return; _updating = true;
      const weeks = Number($('al-weeks').value)||0;
      if(weeks > 0){
        const rate = state.settings?.monthly_interest_rate || 2.5;
        const weeklyRate = (rate / 100) / 4;
        const totalPayable = (principal * (1 + weeklyRate * weeks)) + loanServiceCharge(principal);
        const wi = Math.ceil(totalPayable / weeks);
        $('wi').value = wi;
      }
      _updating = false;
      updSummary();
    };
    const updFromInstallment = () => {
      if(_updating) return; _updating = true;
      const weekly = Number($('wi').value)||0;
      if(weekly > 0){
        const s = new Date($('sd').value||todayISO());
        const r = computeSchedule(principal, weekly, 'flat', s);
        const totalPayable = loanTotalWithServiceCharge(r, principal);
        $('al-weeks').value = Math.ceil(totalPayable / weekly);
      }
      _updating = false;
      updSummary();
    };
    const updSummary = () => {
      const w = Number($('wi').value)||0;
      if(!w){ $('al-out').innerHTML = ''; return; }
      const s = new Date($('sd').value||todayISO());
      const r = computeSchedule(principal, w, 'flat', s);
      const service = loanServiceCharge(principal);
      const totalPayable = loanTotalWithServiceCharge(r, principal);
      const weeks = Math.ceil(totalPayable / w);
      const over52 = weeks > 48;
      $('al-out').innerHTML = `Total payable ${KES(totalPayable)} incl. 6% charge ${KES(service)} - Total interest ${KES(r.totalInterest)} - ${weeks} weeks${over52 ? ' <span class="danger-text">(exceeds 48-week limit)</span>' : ''}`;
    };
    $('al-weeks').addEventListener('input', updFromWeeks);
    $('wi').addEventListener('input', updFromInstallment);
    $('sd').addEventListener('change', updSummary);
    updSummary();
  }, 50);
}

function pageReports(){
  $('page').innerHTML = `

    <div class="grid-3">
      ${[
        ['Savings ledger','All savings entries across groups and members','savings'],
        ['Repayments register','All loan repayments recorded','repayments'],
        ['Active loans','Outstanding balances and weeks remaining','loans'],
        ['Members directory','Full member list with contacts','members'],
        ['Inventory valuation','Stock quantities, cost and loan values','inventory'],
        ['Orders log','Every order placed and its status','orders']
      ].map(([t,d,k]) => `<div class="card card-pad">
        <h3 style="margin:0 0 4px">${t}</h3>
        <div class="muted" style="font-size:12px;margin-bottom:14px">${d}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline" style="flex:1" onclick="previewReport('${k}')">Preview</button>
          <button class="btn btn-primary" style="flex:1" onclick="exportReport('${k}')">Export Excel</button>
        </div>
      </div>`).join('')}
    </div>
  `;
}
function buildReportRows(kind){
  if(kind==='savings') return state.data.savings.map(s => {
    const m = state.data.members.find(x=>x.id===s.member_id), g = state.data.groups.find(x=>x.id===s.group_id);
    return { Date:s.meeting_date, Member:m?.full_name||'—', ID:m?.national_id||'—', Group:g?.name||'—', Amount:Number(s.amount) };
  });
  if(kind==='repayments') return state.data.repayments.map(r => {
    const m = state.data.members.find(x=>x.id===r.member_id);
    return { Date:r.meeting_date, Member:m?.full_name||'—', Amount:Number(r.amount), Principal:Number(r.principal), Interest:Number(r.interest) };
  });
  if(kind==='loans') return state.data.loans.map(l => {
    const m = state.data.members.find(x=>x.id===l.member_id);
    return { Member:m?.full_name||'—', Asset:l.asset_name, LoanValue:Number(l.loan_value), Weekly:Number(l.weekly_installment), Paid:loanPaid(l.id), Outstanding:Number(l.total_payable)-loanPaid(l.id), Status:l.status };
  });
  if(kind==='members') return state.data.members.map(m => {
    const g = state.data.groups.find(x=>x.id===m.group_id);
    return { Name:m.full_name, ID:m.national_id, Phone:m.phone, Group:g?.name||'—', Savings:memberSavings(m.id), Eligible:memberEligible(m.id)?'Yes':'No', Status:m.status };
  });
  if(kind==='inventory') return state.data.inventory.map(a => ({
    Name:a.name, Category:a.category, Qty:a.stock, CostPerUnit:Number(a.buying_price), LoanPricePerUnit:Number(a.loan_price),
    TotalCostValue:Number(a.buying_price)*a.stock, TotalLoanValue:Number(a.loan_price)*a.stock
  }));
  if(kind==='orders') return state.data.orders.map(o => {
    const m = state.data.members.find(x=>x.id===o.member_id);
    return { Date:o.ordered_on, Member:m?.full_name||'—', Asset:o.asset_name, Qty:o.quantity, Status:o.status };
  });
  return [];
}
function previewReport(kind){
  const rows = buildReportRows(kind);
  if(!rows.length) return toast('No data to preview for this report.','warn');
  const cols = Object.keys(rows[0]);
  const titles = { savings:'Savings Ledger', repayments:'Repayments Register', loans:'Active Loans', members:'Members Directory', inventory:'Inventory Valuation', orders:'Orders Log' };
  modal({
    title: `Preview: ${titles[kind]||kind}`,
    size:'lg',
    body:`<div class="muted" style="font-size:12px;margin-bottom:10px">${rows.length} records. Showing up to 50.</div>
    <div style="overflow-x:auto;max-height:400px;overflow-y:auto">
      <table class="tbl" style="min-width:500px">
        <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${rows.slice(0,50).map(r=>`<tr>${cols.map(c=>{
          const v = r[c];
          const isNum = typeof v === 'number';
          return `<td${isNum?' class="num"':''}>${isNum?KES(v):v}</td>`;
        }).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
    ${rows.length > 50 ? `<div class="muted" style="font-size:12px;margin-top:8px">${rows.length-50} more rows not shown. Export to Excel for full data.</div>` : ''}`,
    actions:[
      { label:'Close', onClick: closeModal },
      { label:'Export to Excel', cls:'btn-primary', onClick: ()=>{ closeModal(); exportReport(kind); } }
    ]
  });
}
function exportReport(kind){
  const rows = buildReportRows(kind);
  if(!rows.length) return toast('No data to export.','warn');
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, kind);
  XLSX.writeFile(wb, `${kind}_${todayISO()}.xlsx`);
  toast(`${kind} report exported`, 'success');
}

function openOfficerBookTransfer(){
  const officers = state.data.staff.filter(s => (s.role === 'officer' || s.role === 'loan_officer') && s.status === 'active');
  if(officers.length < 2){ toast('You need at least two active officers to transfer a book.','warn'); return; }
  const officerOptions = officers.map(o => `<option value="${o.id}">${o.full_name}${o.team_name ? ' - ' + o.team_name : ''}</option>`).join('');
  modal({
    title: 'Transfer officer book',
    size: 'lg',
    body: `
      <div style="background:var(--warning-50);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;font-size:13px">
        This transfers current responsibility from one officer to another. It updates groups, clients, active/defaulted loans, and open orders.
        Old savings and repayment records remain under the officer who recorded them for audit history.
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Transfer from *</label>
          <select id="book-from" onchange="updateBookTransferPreview()"><option value="">Select officer</option>${officerOptions}</select>
        </div>
        <div class="field">

          <select id="book-to" onchange="updateBookTransferPreview()"><option value="">Select officer</option>${officerOptions}</select>

      </div>
      <div class="field" style="margin-top:14px">
        <label>Reason / note</label>
        <textarea id="book-note" rows="3" placeholder="Example: Officer left; portfolio reassigned to new officer."></textarea>
      </div>
    `,
    actions: [
      { label:'Cancel', cls:'btn-outline', onClick: closeModal },
      { label:'Transfer book', cls:'btn-primary', onClick: transferOfficerBook }
    ]
  });

function updateBookTransferPreview(){
  const fromId = document.getElementById('book-from')?.value || '';
  const toId = document.getElementById('book-to')?.value || '';
  const host = document.getElementById('book-transfer-preview');
  if(!host) return;
  if(!fromId || !toId){
    host.innerHTML = 'Select both officers to preview what will move.';
    return;
  }
  if(fromId === toId){
    host.innerHTML = '<span class="danger-text">Please select two different officers.</span>';
    return;
  }
  const groups = state.data.groups.filter(g => g.officer_id === fromId);
  const groupIds = new Set(groups.map(g => g.id));
  const members = state.data.members.filter(m => m.officer_id === fromId || groupIds.has(m.group_id));
  const memberIds = new Set(members.map(m => m.id));
  const loans = state.data.loans.filter(l => (l.officer_id === fromId || groupIds.has(l.group_id) || memberIds.has(l.member_id)) && !['completed','cancelled'].includes(l.status));
  const orders = state.data.orders.filter(o => (o.recorded_by === fromId || groupIds.has(o.group_id) || memberIds.has(o.member_id)) && !['fulfilled','rejected','cancelled'].includes(o.status));
  const from = state.data.staff.find(s => s.id === fromId);
  const to = state.data.staff.find(s => s.id === toId);
  host.innerHTML = `
    <div style="font-weight:800;margin-bottom:8px">Preview: ${from?.full_name || 'Old officer'} to ${to?.full_name || 'New officer'}</div>
    <div class="grid-4">
      <div><div class="kpi">${groups.length}</div><div class="muted">Groups</div></div>
      <div><div class="kpi">${members.length}</div><div class="muted">Clients</div></div>
      <div><div class="kpi">${loans.length}</div><div class="muted">Open loans</div></div>
      <div><div class="kpi">${orders.length}</div><div class="muted">Open orders</div></div>
    </div>
  `;
}

async function transferOfficerBook(){
  const fromId = document.getElementById('book-from')?.value || '';
  const toId = document.getElementById('book-to')?.value || '';
  const note = document.getElementById('book-note')?.value || '';
  if(!fromId || !toId){ toast('Select both officers.','warn'); return; }
  if(fromId === toId){ toast('Transfer from and transfer to cannot be the same officer.','error'); return; }
  if(!(await ensureFreshToken())) return;
  const from = state.data.staff.find(s => s.id === fromId);
  const to = state.data.staff.find(s => s.id === toId);
  const ok = await confirmDialogPromise(`Transfer the current officer book from ${from?.full_name || 'old officer'} to ${to?.full_name || 'new officer'}? This will be logged.`);
  if(!ok) return;
  const { data, error } = await sb.rpc('pb_transfer_officer_book', {
    from_officer_id: fromId,
    to_officer_id: toId,
    transfer_note: note || null
  });
  if(error){ toast('Book transfer failed: ' + error.message, 'error'); return; }
  await smartLoadAll();

function confirmDeleteStaff(id){
  const s = state.data.staff.find(x=>x.id===id);
  if(!s) return;
  modal({
    title:'⚠ Permanently delete staff member',
    body:`
      <div style="background:var(--danger-50);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px">
        <div style="font-weight:700;color:var(--danger);margin-bottom:6px;font-size:14px">This action cannot be undone.</div>
        <div style="font-size:13px;color:var(--danger)">
          Deleting <b>${s.full_name}</b> will permanently remove their staff record and revoke their system login.
          Any loans, savings, and repayments they recorded will remain intact.
        </div>
      </div>
      <div class="field">
        <label>Type <b>DELETE</b> below to confirm</label>
        <input id="del-staff-input" placeholder="Type DELETE to confirm" autocomplete="off"
          style="border-color:var(--danger);font-weight:600;letter-spacing:.05em"
          oninput="var b=document.getElementById('del-staff-btn');if(b)b.disabled=this.value!=='DELETE'" />
      </div>`,
    actions:[
      { label:'Cancel', cls:'btn-outline', onClick: closeModal },
      { label:'Permanently delete', cls:'btn-danger', onClick: async ()=>{
        const val = document.getElementById('del-staff-input')?.value;
        if(val !== 'DELETE'){ toast('Please type DELETE to confirm.','error'); return; }
        if(!(await ensureFreshToken())) return;

        const btn = document.getElementById('del-staff-btn');
        if(btn){ btn.disabled = true; btn.textContent = 'Deleting…'; }

        let error;
        if(s.auth_user_id){
          const { error: rpcErr } = await sb.rpc('pb_delete_staff_auth', { target_user_id: s.auth_user_id });
          if(rpcErr){
            const { error: delErr } = await sb.from('pb_staff').delete().eq('id', id);
            error = delErr;
            if(!error) toast('Auth account could not be removed (may need manual cleanup in Supabase), but staff record deleted.','warn');
          } else {
            // RPC handles the pb_staff delete internally
            error = null;
          }
        } else {
          const { error: delErr } = await sb.from('pb_staff').delete().eq('id', id);
          error = delErr;
        }

        if(error){
          toast('Delete failed: ' + error.message, 'error');
          if(btn){ btn.disabled=false; btn.textContent='Permanently delete'; }
          return;
        }

        state.data.staff = state.data.staff.filter(x=>x.id!==id);
        audit('delete_staff','pb_staff',id,{ full_name:s.full_name, email:s.email, role:s.app_role||s.role });
        closeModal();
        render();
        toast(`${s.full_name} has been permanently deleted.`, 'success');
      }}
    ]
  });
  // Tag and disable the confirm button after modal renders
  setTimeout(()=>{
    const foot = document.querySelector('.modal-foot');
    if(!foot) return;
    const btns = foot.querySelectorAll('button');
    const confirmBtn = btns[btns.length - 1];
    if(confirmBtn){ confirmBtn.id = 'del-staff-btn'; confirmBtn.disabled = true; }
  }, 30);
}

function purAssetSearch(i, q){
  const dd = $(`pur-ast-dd-${i}`); if(!dd) return;
  _purLines[i].asset_name = q;
  const matches = state.data.inventory.filter(a=>a.name.toLowerCase().includes((q||'').toLowerCase())).slice(0,8);
  const showAdd = q && q.trim().length > 1 && !state.data.inventory.find(a=>a.name.toLowerCase()===q.toLowerCase());
  if(!matches.length && !showAdd){ dd.style.display='none'; return; }
  dd.style.display='block';
  dd.innerHTML = matches.map(a=>`<div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px" onmousedown="purSelectAsset(${i},'${a.id}','${a.name.replace(/'/g,"\\'")}',${ a.buying_price},false)">${a.name}<span class="muted" style="font-size:11px;margin-left:8px">cost ${KES(a.buying_price)} · stock ${a.stock}</span></div>`).join('')
    + (showAdd ? `<div style="padding:8px 12px;cursor:pointer;font-size:13px;color:var(--accent);font-weight:600" onmousedown="purSelectAsset(${i},'','${q.replace(/'/g,"\\'")}',0,true)">+ Add as new item: "${q}"</div>` : '');
}
function purSelectAsset(i, id, name, defaultCost, isNew){
  _purLines[i].asset_id = id;
  _purLines[i].asset_name = name;
  _purLines[i].isNew = isNew;
  if(!_purLines[i].cost_per_unit) _purLines[i].cost_per_unit = Number(defaultCost)||0;
  _purLines[i].subtotal = Number(_purLines[i].quantity||0)*Number(_purLines[i].cost_per_unit||0);
  renderPurLines();
  const inp = $(`pur-ast-q-${i}`); if(inp) inp.value = name;
  const dd = $(`pur-ast-dd-${i}`); if(dd) dd.style.display='none';
}
function purLineUpd(i, key, val, fromSubtotal){
  _purLines[i][key] = key==='batch_no' ? val : (val === '' ? 0 : Number(val));
  if(fromSubtotal && _purLines[i].quantity > 0){
    _purLines[i].cost_per_unit = Number(val) / Number(_purLines[i].quantity);
  } else if(key === 'quantity' || key === 'cost_per_unit'){
    _purLines[i].subtotal = Number(_purLines[i].quantity||0) * Number(_purLines[i].cost_per_unit||0);
  }
  const total = _purLines.reduce((a,b)=>a+Number(b.subtotal||0),0);
  if($('pur-total-auto')) $('pur-total-auto').value = total.toFixed(2);
}

async function submitPurchase(){
  if(!(await ensureFreshToken())) return;
  const fd = new FormData($('pur-f'));
  const row = Object.fromEntries(fd);
  if(!row.supplier_id) return toast('Choose a supplier.','error');
  const validLines = _purLines.filter(l => l.asset_name && Number(l.quantity)>0);
  if(!validLines.length) return toast('Add at least one line item.','error');
  const auto = validLines.reduce((a,b)=>a+Number(b.subtotal||0),0);
  const override = Number($('pur-total-override').value)||0;
  const total = override > 0 ? override : auto;
  const sup = state.data.suppliers.find(x=>x.id===row.supplier_id);
  const purchase = {
    business_id: state.staff.business_id || null,
    supplier_id: row.supplier_id, supplier_name: sup?.name||'',
    invoice_no: row.invoice_no||null, received_on: row.received_on,
    total_cost: total, notes: row.notes||null,
    received_by: state.staff.id, received_by_name: state.staff.full_name
    // items column removed — stored in pb_purchase_lines instead
  };
  const { data: created, error } = await sb.from('pb_purchases').insert(purchase).select().single();
  if(error) return toast('Save failed: '+error.message+' — check pb_purchases table columns.','error');
  if(validLines.length){
    const lineRows = validLines.map(l => ({
      business_id: state.staff.business_id || null,
      purchase_id: created.id, asset_id: l.asset_id||null, asset_name: l.asset_name,
      quantity: Number(l.quantity), cost_per_unit: Number(l.cost_per_unit)||0,
      subtotal: Number(l.subtotal)||Number(l.quantity)*Number(l.cost_per_unit||0),
      batch_no: l.batch_no||null
    }));
    const { error: le } = await sb.from('pb_purchase_lines').insert(lineRows);
    if(le) toast('Line items warning: '+le.message,'warn');
  }
  // Attach items for local display
  created.items = validLines;

  // Process each line item sequentially to ensure all hit inventory
  let invUpdated = 0;
  for(const l of validLines){
    const costPerUnit = Number(l.cost_per_unit)||0;
    const qty = Number(l.quantity)||0;
    if(!qty) continue;

    if(l.isNew || !l.asset_id){
      // Brand new asset — create inventory record
      const newRow = {
        business_id: state.staff.business_id || null,
        name: l.asset_name, category:'Other', stock: qty,
        buying_price: costPerUnit,
        loan_price: Math.round(costPerUnit*1.15*100)/100,
        reorder_level: 5
      };
      const { data: newAsset, error: ae } = await sb.from('pb_inventory').insert(newRow).select().single();
      if(ae){ toast(`Failed to add "${l.asset_name}" to inventory: ${ae.message}`,'warn'); continue; }
      state.data.inventory.unshift(newAsset);
      invUpdated++;
    } else {
      // Existing asset — find by id in local state (re-lookup each iteration so previous loops are reflected)
      const a = state.data.inventory.find(x=>x.id===l.asset_id);
      if(!a){ toast(`Asset "${l.asset_name}" not found in local inventory, skipping.`,'warn'); continue; }
      const prevStock = Number(a.stock||0);
      const newStock = prevStock + qty;
      const prevCost = Number(a.buying_price||0);
      const weightedCost = prevStock>0
        ? Math.round(((prevCost*prevStock)+(costPerUnit*qty))/newStock*100)/100
        : costPerUnit;
      const prevLoanPrice = Number(a.loan_price||0);
      const margin = prevCost>0 ? prevLoanPrice/prevCost : 1.15;
      const newLoanPrice = Math.round(weightedCost*margin*100)/100;
      const { error: ue } = await sb.from('pb_inventory').update({
        stock:newStock, buying_price:weightedCost, loan_price:newLoanPrice
      }).eq('id',a.id);
      if(ue){ toast(`Failed to update stock for "${l.asset_name}": ${ue.message}`,'warn'); continue; }
      // Update local state immediately so next iteration sees correct stock
      a.stock = newStock; a.buying_price = weightedCost; a.loan_price = newLoanPrice;
      invUpdated++;
    }
  }
  state.data.purchases.unshift(created);
  audit('purchase_create','pb_purchases',created.id, null, { total, lines: validLines.length });
  closeModal(); render(); toast(`Stock received — ${invUpdated} of ${validLines.length} asset(s) updated in inventory.`,'success');
}

/* Searchable group dropdown helpers */
function siFilterGroups(q){
  const dropdown = document.getElementById('si-group-dropdown');
  if(!dropdown) return;
  const lower = q.toLowerCase();
  const matches = state.data.groups.filter(g =>
    !lower || g.name.toLowerCase().includes(lower)
  );
  if(!matches.length){
    dropdown.innerHTML = `<div style="padding:10px 14px;color:var(--text-muted);font-size:13px">No groups found</div>`;
  } else {
    dropdown.innerHTML = matches.map(g=>`
      <div onclick="siSelectGroup('${g.id}','${g.name.replace(/'/g,"&#39;")}')"
        style="padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
        onmouseenter="this.style.background='var(--primary-50)'"
        onmouseleave="this.style.background=''">
        ${g.name}
      </div>`).join('');
  }
  dropdown.style.display = 'block';
}

function siSelectGroup(id, name){
  const searchInput = document.getElementById('si-group-search');
  const hiddenInput = document.getElementById('si-group');
  const dropdown    = document.getElementById('si-group-dropdown');
  if(searchInput) searchInput.value = name;
  if(hiddenInput) hiddenInput.value = id;
  if(dropdown)    dropdown.style.display = 'none';
  // Auto-fill meeting day/time from group data
  const g = state.data.groups.find(x=>x.id===id);
  if(g){
    const mDay  = document.getElementById('si-meeting-day');
    const mTime = document.getElementById('si-meeting-time');
    const mLoc  = document.getElementById('si-location');
    const mLand = document.getElementById('si-landmark');
    if(mDay  && g.meeting_day)        mDay.value  = g.meeting_day;
    if(mTime && g.meeting_time)       mTime.value = g.meeting_time;
    if(mLoc  && g.location)           mLoc.value  = g.location;
    if(mLand && g.nearest_landmark)   mLand.value = g.nearest_landmark;
  }
}

  // Re-number SR column
  _soldItems.forEach((r,idx)=> r.sr = idx + 1);
  renderSoldItemsRows();
}

function renderSoldItemsRows(){
  const tbody = document.getElementById('si-rows');
  const tfoot = document.getElementById('si-totals');
  const counter = document.getElementById('si-row-count');
  if(!tbody) return;

  let totalPrincipal=0, totalCharge=0, totalInterest=0, totalPayable=0;

  tbody.innerHTML = _soldItems.map((row, i)=>{
    const principal = Number(String(row.loan_amount).replace(/,/g,''))||0;
    const weeks     = parseInt(row.loan_term)||0;
    const months    = weeks / 4;
    const charge    = principal > 0 ? Math.round(principal * 0.12 * 100)/100 : 0;
    const interest  = principal > 0 && weeks > 0 ? Math.round(principal * 0.02 * months * 100)/100 : 0;
    const payable   = principal + charge + interest;
    totalPrincipal += principal; totalCharge += charge; totalInterest += interest; totalPayable += payable;

    return `<tr id="si-row-${i}" style="${i%2===1?'background:var(--surface-2)':''}">
      <td style="text-align:center;color:var(--text-muted);font-size:11px">${row.sr}.</td>
      <td><input style="min-width:130px;font-size:12px" data-si="${i}" data-f="client_name"
        value="${row.client_name}" placeholder="Full name"
        onchange="siSaveField(${i},'client_name',this.value)" /></td>
      <td>
        <input style="width:110px;font-size:12px" data-si="${i}" data-f="phone"
          value="${row.phone}" placeholder="07XX..."
          onchange="siSaveField(${i},'phone',this.value);siCheckMatch(${i})"
          onblur="siSaveField(${i},'phone',this.value);siCheckMatch(${i})" />
        <div id="si-match-${i}" style="font-size:10px;margin-top:2px"></div>
      </td>
      <td><input style="min-width:110px;font-size:12px" data-si="${i}" data-f="product"
        value="${row.product}" placeholder="Product"
        onchange="siSaveField(${i},'product',this.value)" /></td>
      <td>
        <input type="text" inputmode="numeric" style="width:110px;font-size:12px;text-align:right"
          data-si="${i}" data-f="loan_amount"
          value="${row.loan_amount||''}" placeholder="0"
          onchange="siSaveField(${i},'loan_amount',this.value);siRecalcRow(${i})"
          onblur="siSaveField(${i},'loan_amount',this.value);siRecalcRow(${i})" />
      </td>
      <td>
        <input type="text" inputmode="numeric" style="width:70px;font-size:12px;text-align:right"
          data-si="${i}" data-f="loan_term"
          value="${row.loan_term||''}" placeholder="wks"
          onchange="siSaveField(${i},'loan_term',this.value);siRecalcRow(${i})"
          onblur="siSaveField(${i},'loan_term',this.value);siRecalcRow(${i})" />
      </td>
      <td class="num" style="color:var(--warning);font-size:12px" id="si-charge-${i}">${principal>0?KES(charge):'—'}</td>
      <td class="num" style="color:var(--info);font-size:12px"    id="si-int-${i}">${principal>0&&weeks>0?KES(interest):'—'}</td>
      <td class="num" style="font-weight:700;font-size:12px;color:var(--primary)" id="si-pay-${i}">${principal>0?KES(payable):'—'}</td>
      <td><input style="width:64px;font-size:12px" data-si="${i}" data-f="loan_no"
        value="${row.loan_no}" placeholder="Ref"
        onchange="siSaveField(${i},'loan_no',this.value)" /></td>
      <td style="text-align:center">
        ${_soldItems.length > 1
          ? `<button onclick="siRemoveRow(${i})" title="Remove row"
               style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:2px 4px">✕</button>`
          : ''}
      </td>
    </tr>`;
  }).join('');

  tfoot.innerHTML = `<tr style="background:var(--surface-2);font-weight:700;border-top:2px solid var(--border)">
    <td colspan="4" style="padding:8px 14px;font-size:12px;color:var(--text-muted)">TOTALS (${_soldItems.filter(r=>Number(r.loan_amount)>0).length} client${_soldItems.filter(r=>Number(r.loan_amount)>0).length!==1?'s':''})</td>
    <td class="num" style="padding:8px 14px;font-size:12px">${KES(totalPrincipal)}</td>
    <td></td>
    <td class="num" style="padding:8px 14px;font-size:12px;color:var(--warning)">${KES(totalCharge)}</td>
    <td class="num" style="padding:8px 14px;font-size:12px;color:var(--info)">${KES(totalInterest)}</td>
    <td class="num" style="padding:8px 14px;font-size:12px;color:var(--primary)">${KES(totalPayable)}</td>
    <td colspan="2"></td>
  </tr>`;

  if(counter) counter.textContent = `${_soldItems.length} row${_soldItems.length!==1?'s':''} total`;
}

/* Save a single field without re-rendering the whole table (preserves focus) */
function siSaveField(i, field, value){
  _soldItems[i][field] = value;
}

/* Check if the phone number in row i matches a registered member and show indicator */
function siCheckMatch(i){
  const row = _soldItems[i];
  const el  = document.getElementById(`si-match-${i}`);
  if(!el) return;
  const groupId   = document.getElementById('si-group')?.value || null;
  const normPhone = normalisePhone(row.phone||'');
  if(normPhone.length < 9){ el.innerHTML = ''; return; }

  let member = state.data.members.find(m =>
    normalisePhone(m.phone||'') === normPhone &&
    (!groupId || m.group_id === groupId)
  );
  if(!member){
    member = state.data.members.find(m => normalisePhone(m.phone||'') === normPhone);
  }

  if(member){
    el.innerHTML = `<span style="color:var(--success)">✅ ${member.full_name} · ID ${member.national_id||'—'}</span>`;
  } else {
    el.innerHTML = `<span style="color:var(--danger)">⚠ No member found — loan will be unlinked</span>`;
  }
}

/* Recalculate only the computed cells for one row after amount/term changes */
function siRecalcRow(i){
  const row      = _soldItems[i];
  const principal = Number(String(row.loan_amount).replace(/,/g,''))||0;
  const weeks     = parseInt(row.loan_term)||0;
  const months    = weeks / 4;
  const charge    = principal > 0 ? Math.round(principal * 0.12 * 100)/100 : 0;
  const interest  = principal > 0 && weeks > 0 ? Math.round(principal * 0.02 * months * 100)/100 : 0;
  const payable   = principal + charge + interest;

  const chEl  = document.getElementById(`si-charge-${i}`);
  const intEl = document.getElementById(`si-int-${i}`);
  const payEl = document.getElementById(`si-pay-${i}`);
  if(chEl)  chEl.textContent  = principal > 0 ? KES(charge)   : '—';
  if(intEl) intEl.textContent = principal > 0 && weeks > 0 ? KES(interest) : '—';
  if(payEl) payEl.textContent = principal > 0 ? KES(payable)  : '—';

  // Recalculate totals row
  let tp=0, tc=0, ti=0, tpay=0;
  _soldItems.forEach(r=>{
    const p = Number(String(r.loan_amount).replace(/,/g,''))||0;
    const w = parseInt(r.loan_term)||0;
    tp   += p;
    tc   += p > 0 ? Math.round(p*0.12*100)/100 : 0;
    ti   += p > 0 && w > 0 ? Math.round(p*0.02*(w/4)*100)/100 : 0;
    tpay += p + (p>0?Math.round(p*0.12*100)/100:0) + (p>0&&w>0?Math.round(p*0.02*(w/4)*100)/100:0);
  });
  const tfoot = document.getElementById('si-totals');
  if(tfoot){
    const cells = tfoot.querySelectorAll('td');
    const filled = _soldItems.filter(r=>Number(r.loan_amount)>0).length;
    if(cells[0]) cells[0].textContent = `TOTALS (${filled} client${filled!==1?'s':''})`;
    if(cells[1]) cells[1].textContent = KES(tp);
    if(cells[3]) cells[3].textContent = KES(tc);
    if(cells[4]) cells[4].textContent = KES(ti);
    if(cells[5]) cells[5].textContent = KES(tpay);
  }
}

function siUpdateRow(i, el){
  _soldItems[i][el.dataset.f] = el.value;
  renderSoldItemsRows();
}

async function saveSoldItemsForm(){
  if(!(await ensureFreshToken())) return;
  const validRows = _soldItems.filter(r => r.client_name && Number(String(r.loan_amount).replace(/,/g,'')) > 0);
  if(!validRows.length) return toast('Please fill in at least one client row with a name and loan amount.', 'error');
  if(validRows.some(r => !parseInt(r.loan_term))) return toast('Please enter a loan term (weeks) for every client row.', 'error');

  const groupId       = document.getElementById('si-group')?.value || null;
  const creditOfficer = document.getElementById('si-officer')?.value || state.staff.full_name;
  const branch        = document.getElementById('si-branch')?.value || '';
  const date          = document.getElementById('si-date')?.value || todayISO();
  const location      = document.getElementById('si-location')?.value || '';
  const meetingDay    = document.getElementById('si-meeting-day')?.value || '';
  const meetingTime   = document.getElementById('si-meeting-time')?.value || '';
  const landmark      = document.getElementById('si-landmark')?.value || '';
  const group         = state.data.groups.find(x => x.id === groupId);
  const officerId     = group?.officer_id || state.staff.id;

  // ── 1. Save the order record (batch header) ──────────────────────────────
  const rowsWithCalc = validRows.map(r => {
    const principal = Number(String(r.loan_amount).replace(/,/g,'')) || 0;
    const weeks     = parseInt(r.loan_term) || 0;
    const months    = weeks / 4;
    const interest  = Math.round(principal * 0.02 * months * 100) / 100;
    // All charges absorbed into total payable — no separate deductions ever
    // P + I + 6% service charge + 3% app fee + 3% insurance = P + I + 12%
    const allCharges   = Math.round(principal * 0.12 * 100) / 100;
    const totalPayable = principal + interest + allCharges;
    return { ...r, loan_amount: principal, weeks, interest, allCharges, totalPayable };
  });

  const meta = {
    source:'sold_items', credit_officer: creditOfficer, group_name: group?.name || '',
    branch, location, meeting_day: meetingDay, meeting_time: meetingTime,
    nearest_landmark: landmark, rows: rowsWithCalc
  };

  const totalPrincipal = rowsWithCalc.reduce((a, r) => a + r.loan_amount, 0);
  const orderIns = {
    business_id: state.staff.business_id || null,
    member_id: null, group_id: groupId || null,
    asset_id: null, asset_name: `Sold Items Form — ${validRows.length} client(s)`,
    quantity: validRows.length, ordered_on: date, status: 'fulfilled',
    recorded_by: state.staff.id, approved_by: state.staff.id,
    notes: JSON.stringify(meta),
    desired_weeks: null, desired_weekly_installment: null
  };
  const { data: orderData, error: orderErr } = await sb.from('pb_orders').insert(orderIns).select().single();
  if(orderErr) return toast('Order save failed: ' + orderErr.message, 'error');
  state.data.orders.unshift(orderData);

  // ── 2. For each client row create a pb_loans record + upfront fee repayments ─
  let loansCreated = 0, errors = [];

  for(const row of rowsWithCalc){
    // Match member by phone first (most reliable), then fall back to name.
    // Phone is normalised before comparison to handle 07xx vs +2547xx variants.
    const normRowPhone = normalisePhone(row.phone||'');
    let member = null;

    // 1. Match by phone number (exact, after normalisation)
    if(normRowPhone.length >= 9){
      member = state.data.members.find(m =>
        normalisePhone(m.phone||'') === normRowPhone &&
        (!groupId || m.group_id === groupId)
      );
      // If not found in selected group, try across all groups
      if(!member){
        member = state.data.members.find(m =>
          normalisePhone(m.phone||'') === normRowPhone
        );
      }
    }

    // 2. Fall back to name match (case-insensitive) within the selected group
    if(!member){
      const nameLower = (row.client_name||'').trim().toLowerCase();
      member = state.data.members.find(m =>
        m.full_name.trim().toLowerCase() === nameLower &&
        (!groupId || m.group_id === groupId)
      );
    }

    const memberId = member?.id || null;

    // Calculate loan schedule.
    // Repayments start AFTER one week — so start_date is set 7 days after the form date.
    // This means the first installment falls due at week 2 from today, giving clients
    // one full week grace before their first payment is expected.
    const formDate      = new Date(date);
    const startDate     = new Date(formDate);
    startDate.setDate(startDate.getDate() + 7);           // first repayment week begins after 1 week
    const endDate       = new Date(startDate);
    endDate.setDate(endDate.getDate() + 7 * row.weeks);
    // Weekly installment derived from full P+I+C total so passbook figure matches exactly
    const weeklyInstallment = row.weeks > 0 ? Math.round((row.totalPayable / row.weeks) * 100) / 100 : 0;

    // Check for existing active loan for this member on this order
    // Check for existing active loan for this member on this order (duplicate prevention)
    const existingActiveLoan = state.data.loans.find(ex =>
      ex.order_id === orderData.id &&
      ex.status   === 'active' &&
      (memberId ? ex.member_id === memberId : ex.asset_name === (row.product||'Sold item'))
    );
    if(existingActiveLoan){
      errors.push(`${row.client_name}: loan already exists — skipped duplicate`);
      continue;
    }

    const loanRow = {
      business_id:        state.staff.business_id || null,
      member_id:          memberId,
      group_id:           groupId || null,
      officer_id:         officerId,
      order_id:           orderData.id,
      asset_id:           null,
      asset_name:         row.product || 'Sold item',
      asset_quantity:     1,
      loan_value:         row.loan_amount,
      weekly_installment: weeklyInstallment,
      total_payable:      row.totalPayable,
      start_date:         startDate.toISOString().slice(0, 10),   // 7 days after form date
      expected_end_date:  endDate.toISOString().slice(0, 10),
      // Sold items loans start as 'pending' — must be approved by BM or Admin
      // before they appear in the client's active portfolio and arrears tracking.
      status:             can('approve_loan') ? 'active' : 'pending'
    };

    const { data: loanData, error: loanErr } = await sb.from('pb_loans').insert(loanRow).select().single();
    if(loanErr){ errors.push(`${row.client_name}: ${loanErr.message}`); continue; }
    state.data.loans.unshift(loanData);
    loansCreated++;
    audit('sold_items_loan_issue', 'pb_loans', loanData.id, null, loanRow);

    // No automatic fee entries ever — all charges (6% service charge + 3% app fee
    // + 3% insurance = 12% total) are included in total_payable and recovered
    // gradually as the client makes weekly repayments. Clean slate on loan creation.
  }

  closeModal(); render();
  const isPending = !can('approve_loan');
  if(errors.length){
    toast(`${loansCreated} loan(s) ${isPending?'submitted for approval':'created'}. ${errors.length} error(s): ${errors.join('; ')}`, 'warn');
  } else {
    toast(`✅ ${loansCreated} sold items loan(s) ${isPending ? 'submitted for BM/Admin approval — they will appear in the Approvals Queue' : 'issued and activated'}. Total principal: ${KES(totalPrincipal)}.`, 'success');
  }
}

function exportSoldItemsExcel(){
  const validRows = _soldItems.filter(r=>r.client_name||Number(String(r.loan_amount).replace(/,/g,''))>0);
  if(!validRows.length){ toast('No data to export.','warn'); return; }
  const creditOfficer = document.getElementById('si-officer')?.value||state.staff.full_name;
  const groupName     = document.getElementById('si-group-search')?.value||'';
  const branch        = document.getElementById('si-branch')?.value||'';
  const date          = document.getElementById('si-date')?.value||todayISO();
  const rows = validRows.map(r=>{
    const principal = Number(String(r.loan_amount).replace(/,/g,''))||0;
    const weeks     = parseInt(r.loan_term)||0;
    const months    = weeks/4;
    const charge    = Math.round(principal*0.12*100)/100;
    const interest  = Math.round(principal*0.02*months*100)/100;
    const appFee    = Math.round(principal*0.03*100)/100;
    const insFee    = Math.round(principal*0.03*100)/100;
    return {
      'SR.': r.sr, 'Client Name': r.client_name, 'Phone No': r.phone,
      'Product': r.product, 'Loan Amount (KES)': principal,
      'Loan Term (Weeks)': r.loan_term,
      '6% Service Charge (KES)': charge,
      'Interest (2%/mo) (KES)': interest,
      '3% Application Fee (KES)': appFee,
      '3% Insurance Cover (KES)': insFee,
      'Total Payable (KES)': principal + interest,
      'Grand Total incl. Fees (KES)': principal + interest + charge + appFee + insFee,
      'Loan No': r.loan_no
    };
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet([]);
  XLSX.utils.sheet_add_aoa(ws, [
    ['Wamama Pamoja — Sold Items Loan Form'],
    [`Credit Officer: ${creditOfficer}`, `Group: ${groupName}`, `Branch: ${branch}`, `Date: ${date}`],
    []
  ], { origin: 'A1' });
  XLSX.utils.sheet_add_json(ws, rows, { origin: 'A4' });
  XLSX.utils.book_append_sheet(wb, ws, 'Sold Items Form');
  XLSX.writeFile(wb, `sold_items_form_${date}.xlsx`);
  toast('Excel exported.','success');
}
