async function saveSoldItemsEdit(orderId){
  if(!(await ensureFreshToken())) return;
  const o = state.data.orders.find(x=>x.id===orderId);
  if(!o || !window._siEditRows) return;

  const btn = document.querySelector('.modal-foot .btn-primary');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }

  // Recalculate all rows with updated values
  const updatedRows = window._siEditRows.map(row=>{
    const principal = Number(String(row.loan_amount||'').replace(/,/g,''))||0;
    const weeks     = parseInt(row.loan_term)||0;
    const charge    = Math.round(principal*0.12*100)/100;
    const interest  = Math.round(principal*0.02*(weeks/4)*100)/100;
    const appFee    = Math.round(principal*0.03*100)/100;
    const insFee    = Math.round(principal*0.03*100)/100;
    return { ...row, loan_amount:principal, weeks, charge, interest, appFee, insFee,
      total_payable: principal+interest };
  });

  // Update the order notes JSON with edited rows
  let meta = {}; try{ meta=JSON.parse(o.notes||'{}'); }catch{}
  meta.rows = updatedRows;
  const { error: orderErr } = await sb.from('pb_orders')
    .update({ notes: JSON.stringify(meta) })
    .eq('id', orderId);
  if(orderErr){
    if(btn){ btn.disabled=false; btn.textContent='💾 Save changes'; }
    return toast('Save failed: '+orderErr.message, 'error');
  }
  o.notes = JSON.stringify(meta);

  // Re-link each loan to its member using phone (primary) or name (fallback)
  const linkedLoans = state.data.loans.filter(l=>l.order_id===orderId);
  let linked=0, skipped=0;

  for(const row of updatedRows){
    // Find the loan that matches this row's product
    const loan = linkedLoans.find(l=>
      (l.asset_name||'').trim().toLowerCase() === (row.product||'').trim().toLowerCase()
      || l.member_id === null
    );
    if(!loan) continue;

    // Attempt member match
    const normPhone = normalisePhone(row.phone||'');
    let member = null;
    if(normPhone.length>=9){
      member = state.data.members.find(m=>normalisePhone(m.phone||'')===normPhone);
    }
    if(!member && row.client_name){
      const nl = (row.client_name||'').trim().toLowerCase();
      member = state.data.members.find(m=>m.full_name.trim().toLowerCase()===nl);
    }

    if(member && loan.member_id !== member.id){
      // Update loan principal/schedule if amounts changed
      const principal  = Number(String(row.loan_amount||'').replace(/,/g,''))||0;
      const weeks      = parseInt(row.loan_term)||0;
      const interest   = Math.round(principal*0.02*(weeks/4)*100)/100;
      const totalPayable = principal+interest;
      const weeklyInst = weeks>0 ? Math.round(totalPayable/weeks*100)/100 : loan.weekly_installment;

      const loanUpd = {
        member_id:          member.id,
        group_id:           member.group_id || loan.group_id,
        loan_value:         principal||loan.loan_value,
        total_payable:      totalPayable||loan.total_payable,
        weekly_installment: weeklyInst||loan.weekly_installment,
        asset_name:         row.product||loan.asset_name
      };
      const { error: lErr } = await sb.from('pb_loans').update(loanUpd).eq('id', loan.id);
      if(!lErr){
        Object.assign(loan, loanUpd);
        // Also update repayments member_id
        await sb.from('pb_repayments').update({ member_id: member.id }).eq('loan_id', loan.id);
        state.data.repayments.filter(r=>r.loan_id===loan.id).forEach(r=>r.member_id=member.id);
        linked++;
      }
    } else if(member && loan.member_id === member.id){
      // Already linked — still update amounts if changed
      const principal = Number(String(row.loan_amount||'').replace(/,/g,''))||0;
      if(principal>0 && principal !== loan.loan_value){
        const weeks        = parseInt(row.loan_term)||0;
        const interest     = Math.round(principal*0.02*(weeks/4)*100)/100;
        const totalPayable = principal+interest;
        const weeklyInst   = weeks>0 ? Math.round(totalPayable/weeks*100)/100 : loan.weekly_installment;
        const loanUpd = { loan_value:principal, total_payable:totalPayable, weekly_installment:weeklyInst, asset_name:row.product||loan.asset_name };
        await sb.from('pb_loans').update(loanUpd).eq('id', loan.id);
        Object.assign(loan, loanUpd);
      }
      skipped++;
    } else {
      skipped++;
    }
  }

  window._siEditRows = null;
  closeModal(); render();
  toast(`✅ Form saved. ${linked} loan(s) newly linked to members${skipped?' · '+skipped+' already linked or unmatched':''}.`, 'success');
}

async function deleteSoldItemsForm(orderId){
  const o = state.data.orders.find(x=>x.id===orderId);
  if(!o) return;
  let meta = {}; try{ meta=JSON.parse(o.notes||'{}'); }catch{}
  const rows = meta.rows||[];
  const principal = rows.reduce((a,rw)=>a+Number(rw.loan_amount||0),0);

  // Find all loans linked to this order
  const linkedLoans = state.data.loans.filter(l => l.order_id === orderId);

  modal({
    title:'🗑 Delete sold items form',
    body:`
      <div style="background:var(--danger-50);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px">
        <div style="font-weight:700;color:var(--danger);margin-bottom:6px">This will permanently delete:</div>
        <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--danger);line-height:1.8">
          <li>The sold items form (${rows.length} client row${rows.length!==1?'s':''}, total principal ${KES(principal)})</li>
          <li>${linkedLoans.length} linked loan record${linkedLoans.length!==1?'s':''}</li>
          <li>All fee entries recorded for these loans (if any)</li>
        </ul>
        <div style="margin-top:8px;font-size:12px;color:var(--danger);font-weight:600">This action cannot be undone.</div>
      </div>
      <div class="field">
        <label>Type <b>DELETE</b> to confirm</label>
        <input id="del-si-input" placeholder="Type DELETE" autocomplete="off"
          style="border-color:var(--danger);font-weight:600;letter-spacing:.05em"
          oninput="var b=document.getElementById('del-si-confirm-btn');if(b)b.disabled=this.value!=='DELETE'" />
      </div>`,
    actions:[
      { label:'Cancel', cls:'btn-outline', onClick: closeModal },
      { label:'Permanently delete', cls:'btn-danger', onClick: async ()=>{
        if(document.getElementById('del-si-input')?.value !== 'DELETE'){
          toast('Please type DELETE to confirm.','error'); return;
        }
        if(!(await ensureFreshToken())) return;

        // Disable the confirm button while deleting
        const delBtn = document.getElementById('del-si-confirm-btn');
        if(delBtn){ delBtn.disabled = true; delBtn.textContent = 'Deleting…'; }

        let hadError = false;

        // 1. Delete all repayments linked to each loan
        for(const loan of linkedLoans){
          const { error: repErr } = await sb.from('pb_repayments').delete().eq('loan_id', loan.id);
          if(repErr){ toast(`Could not delete repayments for loan ${loan.id}: ${repErr.message}`, 'warn'); hadError = true; }
          else { state.data.repayments = state.data.repayments.filter(rp => rp.loan_id !== loan.id); }
        }

        // 2. Delete all linked loans
        if(linkedLoans.length){
          const loanIds = linkedLoans.map(l=>l.id);
          const { error: loanErr } = await sb.from('pb_loans').delete().in('id', loanIds);
          if(loanErr){ toast(`Could not delete loans: ${loanErr.message}`, 'warn'); hadError = true; }
          else { state.data.loans = state.data.loans.filter(l => !loanIds.includes(l.id)); }
        }

        // 3. Delete the order record itself
        const { error: orderErr } = await sb.from('pb_orders').delete().eq('id', orderId);
        if(orderErr){ toast(`Could not delete form record: ${orderErr.message}`, 'warn'); hadError = true; }
        else { state.data.orders = state.data.orders.filter(x => x.id !== orderId); }

        audit('delete_sold_items_form','pb_orders', orderId, { rows: rows.length, principal }, null);
        closeModal();
        render();
        if(!hadError){
          toast(`Sold items form and ${linkedLoans.length} loan(s) deleted successfully.`, 'success');
        } else {
          toast('Form deleted with some warnings — check repayments manually.', 'warn');
        }
      }}
    ]
  });

  // Tag and disable the confirm button until DELETE is typed
  setTimeout(()=>{
    const foot = document.querySelector('.modal-foot');
    if(!foot) return;
    const btns = foot.querySelectorAll('button');
    // The confirm button is the last one in the footer
    const confirmBtn = btns[btns.length - 1];
    if(confirmBtn){ confirmBtn.id = 'del-si-confirm-btn'; confirmBtn.disabled = true; }
  }, 30);
}

function pageAccounting(){

  const repayInPeriod = state.data.repayments.filter(r=>inRange(r.meeting_date||'') && isClientRepayment(r));
  const totalPrincipalIn = repayInPeriod.reduce((a,b)=>a+Number(b.principal||0),0);
  const totalInterestIn = repayInPeriod.reduce((a,b)=>a+Number(b.interest||0),0);
  const totalRepayIn = repayInPeriod.reduce((a,b)=>a+Number(b.amount||0),0);

  // === FIX 4: Registration Fees ===

let _expDateFilter = 'month';
let _expCustomStart = '', _expCustomEnd = '';

const EXPENSE_CATEGORIES = ['Transport','Office Supplies','Utilities','Salary','Airtime/Data','Other'];

function expDateRange(){
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const today = iso(now);
  if(_expDateFilter==='today') return { start: today, end: today };
  if(_expDateFilter==='yesterday'){
    const y = new Date(now); y.setDate(y.getDate()-1); const yd = iso(y);
    return { start: yd, end: yd };
  }
  if(_expDateFilter==='week'){
    const d = new Date(now); d.setDate(d.getDate()-6);
    return { start: iso(d), end: today };
  }
  if(_expDateFilter==='month'){
    const d = new Date(now); d.setDate(1);
    return { start: iso(d), end: today };
  }
  if(_expDateFilter==='custom'){
    return { start: _expCustomStart||today, end: _expCustomEnd||today };
  }
  return { start: today, end: today };
}

function pageExpenses(){
  const isAdmin = state.staff.role === 'admin';
  const { start, end } = expDateRange();

  const inRangeFallback = (dateStr, createdAt) => {
    const d = (dateStr||'').slice(0,10);
    if(d >= start && d <= end) return true;
    if(createdAt){ const cd = new Date(createdAt).toISOString().slice(0,10); return cd >= start && cd <= end; }
    return false;
  };

  const filtered = (state.data.expenses||[]).filter(e => inRangeFallback(e.date||'', e.created_at));
  const totalAmt = filtered.reduce((a,b)=>a+Number(b.amount||0),0);

  const dateFilterBtns = [
    ['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['custom','Custom Range']
  ];

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Expenses</h1><div class="desc">${filtered.length} entries · Total ${KES(totalAmt)}</div></div>
      <div class="actions">
        ${isAdmin ? `<button class="btn btn-primary" onclick="openExpenseForm()">+ Record Expense</button>` : ''}
      </div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      ${dateFilterBtns.map(([k,l])=>`<button class="btn btn-sm ${_expDateFilter===k?'btn-primary':'btn-outline'}" onclick="_expDateFilter='${k}';pageExpenses()">${l}</button>`).join('')}
      ${_expDateFilter==='custom'?`
        <input type="date" value="${_expCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="_expCustomStart=this.value;pageExpenses()" />
        <span class="muted" style="font-size:12px">to</span>
        <input type="date" value="${_expCustomEnd}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="_expCustomEnd=this.value;pageExpenses()" />
      `:''}
    </div>

    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th>Recorded By</th><th></th>
        </tr></thead>
        <tbody>
          ${filtered.length ? filtered.map(e => {
            const rec = state.data.staff.find(x=>x.id===e.recorded_by);
            const catColors = {
              Transport:'b-blue', 'Office Supplies':'b-grey', Utilities:'b-yellow',
              Salary:'b-info', 'Airtime/Data':'b-green', Other:'b-grey'
            };
            return `<tr>
              <td>${fmtDate(e.date)}</td>
              <td><span class="badge ${catColors[e.category]||'b-grey'}">${e.category||'—'}</span></td>
              <td style="max-width:260px;white-space:normal;font-size:13px">${e.description||'—'}</td>

            </tr>`;
          }).join('') : `<tr><td colspan="6"><div class="empty"><h4>No expenses found</h4><p>No expense entries for the selected period.${isAdmin?' Use "Record Expense" to add one.':''}</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;

function openExpenseForm(id=null){
  const isAdmin = state.staff.role === 'admin';
  if(!isAdmin){ toast('Only administrators can record or edit expenses.', 'error'); return; }

  const existing = id ? (state.data.expenses||[]).find(x => x.id === id) : null;
  const title = existing ? 'Edit Expense' : 'Record Expense';

  modal({
    title,
    body: `
      <div class="grid-2">
        <div class="field">
          <label>Date *</label>
          <input type="date" id="ef-date" value="${existing?.date || todayISO()}" required />
        </div>
        <div class="field">
          <label>Category *</label>
          <select id="ef-category" required>
            ${EXPENSE_CATEGORIES.map(c=>`<option value="${c}" ${existing?.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Amount (KES) *</label>
        <input type="number" id="ef-amount" min="0.01" step="0.01" value="${existing?.amount||''}" placeholder="0.00" required />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="ef-description" rows="3" placeholder="Brief description of what this expense was for…" style="resize:vertical">${existing?.description||''}</textarea>
      </div>
    `,
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: existing ? 'Save Changes' : 'Record Expense', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const date = document.getElementById('ef-date')?.value;
        const category = document.getElementById('ef-category')?.value;
        const amount = Number(document.getElementById('ef-amount')?.value);
        const description = document.getElementById('ef-description')?.value.trim();

        if(!date) return toast('Date is required.', 'error');
        if(!category) return toast('Category is required.', 'error');
        if(!amount || amount <= 0) return toast('Enter a valid amount greater than zero.', 'error');

        const row = {
          business_id: state.staff.business_id || null,
          date,
          category,
          amount,
          description: description || null,
          recorded_by: state.staff.id
        };

        if(existing){
          const { error } = await sb.from('pb_expenses').update({ date, category, amount, description: description||null }).eq('id', existing.id);
          if(error) return toast(error.message, 'error');
          Object.assign(existing, { date, category, amount, description: description||null });
          audit('update_expense', 'pb_expenses', existing.id, null, { date, category, amount });
          closeModal(); render(); toast('Expense updated.', 'success');
        } else {
          const { data, error } = await sb.from('pb_expenses').insert(row).select().single();
          if(error) return toast(error.message, 'error');
          state.data.expenses.unshift(data);
          audit('create_expense', 'pb_expenses', data.id, null, row);
          closeModal(); render(); toast('Expense recorded successfully.', 'success');
        }
      }}
    ]
  });
}

function canBulkManageSavings(){
  return state.staff?.role === 'admin' || can('approve_savings');

function savingsLedgerDuplicateIds(rows){
  const seen = new Map();
  const dupIds = new Set();
  [...(rows||[])].sort((a,b)=>String(a.created_at||a.id).localeCompare(String(b.created_at||b.id))).forEach(s=>{
    const key = duplicateKey([
      s.member_id,
      s.group_id,
      (s.meeting_date||'').slice(0,10),
      Number(s.amount||0).toFixed(2)
    ]);
    if(!key) return;
    if(seen.has(key)) dupIds.add(s.id);
    else seen.set(key, s.id);
  });
  return dupIds;
}

function toggleSavingsSelection(id, checked){

async function bulkDeleteSelectedSavings(){
  if(!canBulkManageSavings()) return toast('You do not have permission to bulk delete savings entries.','error');
  const ids = [..._selectedSavingsIds];
  if(!ids.length) return toast('Select at least one savings entry first.','warn');
  confirmDialog(`Delete ${ids.length} selected savings entr${ids.length===1?'y':'ies'}? This cannot be undone. Please confirm you have reviewed the selected records.`, async()=>{
    if(!(await ensureFreshToken())) return;
    const oldRows = state.data.savings.filter(s=>ids.includes(s.id));
    const { error } = await sb.from('pb_savings').delete().in('id', ids);
    if(error) return toast(error.message,'error');
    state.data.savings = state.data.savings.filter(s=>!ids.includes(s.id));
    _selectedSavingsIds.clear();
    audit('bulk_delete_savings','pb_savings',null,oldRows,null);

  },{ title:'Bulk Delete Savings', danger:true });
}

function savingsRowActions(ev, id){
  const sav = state.data.savings.find(x=>x.id===id);
  const canApproveSav = can('approve_savings');
  const canEdit = canApproveSav || ( state.staff.role === 'officer' || state.staff.role === 'loan_officer');
  const items = [
    { label: '✏ Edit entry', onClick: () => openEditSaving(id) }
  ];
  if(canApproveSav && sav && sav.status === 'pending'){
    items.push('sep');
    items.push({ label: '✓ Approve', onClick: async (ev) => {
      const btn = ev?.target;
      if(btn){ btn.disabled=true; btn.textContent='Approving…'; }
      // Guard against double-tap
      if(sav.status === 'approved'){ toast('Already approved.','warn'); return; }
      if(!(await ensureFreshToken())) return;
      const { error } = await sb.from('pb_savings').update({ status: 'approved' }).eq('id', id);
      if(error){ if(btn){ btn.disabled=false; btn.textContent='✓ Approve'; } return toast(error.message, 'error'); }
      sav.status = 'approved';
      render();
      toast('Savings entry approved.', 'success');
    }});
  }
  if(canEdit){
    items.push('sep');
    items.push({ label: '🗑 Delete entry', danger: true, onClick: () => confirmDialog(
      'Delete this savings entry? This cannot be undone.',
      async () => {
        if(!(await ensureFreshToken())) return;
        const { error } = await sb.from('pb_savings').delete().eq('id', id);
        if(error) return toast(error.message, 'error');
        state.data.savings = state.data.savings.filter(x => x.id !== id);
        audit('delete_saving', 'pb_savings', id);
        render();
        toast('Savings entry deleted.', 'warn');
      },
      { title: 'Delete Savings Entry', danger: true }
    )});
  }
  showActMenu(ev, items);
}

    return false;
  };
  const filtered = state.data.savings.filter(s => {
    if(!isAdmin && !myGroupIds.includes(s.group_id)) return false;

    if(_savingsGroupFilter && s.group_id !== _savingsGroupFilter) return false;

let _repDateFilter = 'month';
let _repCustomStart = '', _repCustomEnd = '';
let _repGroupFilter = '';
let _repOfficerFilter = '';

function repDateRange(){
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const today = iso(now);
  if(_repDateFilter==='today') return { start: today, end: today };
  if(_repDateFilter==='yesterday'){
    const y = new Date(now); y.setDate(y.getDate()-1); const yd = iso(y);
    return { start: yd, end: yd };
  }
  if(_repDateFilter==='week'){
    const d = new Date(now); d.setDate(d.getDate()-6);
    return { start: iso(d), end: today };
  }
  if(_repDateFilter==='month'){
    const d = new Date(now); d.setDate(1);
    return { start: iso(d), end: today };
  }
  if(_repDateFilter==='custom'){
    return { start: _repCustomStart||today, end: _repCustomEnd||today };
  }
  return { start: today, end: today };
}

function pageSavingsApprovals(){
  const pending = state.data.savings
    .filter(s => s.status === 'pending')
    .sort((a,b)=>String(b.created_at||b.meeting_date||'').localeCompare(String(a.created_at||a.meeting_date||'')));
  const duplicateIds = findDuplicatePendingSavingIds(pending);
  const pageSize = Number(state._savingsApprovalPageSize || 50);
  const page = Math.max(0, Number(state._savingsApprovalPage || 0));
  const totalPages = Math.max(1, Math.ceil(pending.length / pageSize));
  if(page >= totalPages){
    state._savingsApprovalPage = totalPages - 1;
    return pageSavingsApprovals();
  }
  const pageStart = page * pageSize;
  const pageRows = pending.slice(pageStart, pageStart + pageSize);

  const byGroup = {};
  pageRows.forEach(s => {
    const grp = state.data.groups.find(g=>g.id===s.group_id);
    const key = grp?.name || '— No group';
    if(!byGroup[key]) byGroup[key] = [];
    byGroup[key].push(s);
  });

  const groupKeys = Object.keys(byGroup).sort();

  $('page').innerHTML = `
    <div class="page-head">
      <div>
        <h1>Savings Approvals</h1>
        ${duplicateIds.length > 0 ? `<div style="margin:8px 0 4px"><button class="btn btn-sm btn-outline" style="color:var(--danger);border-color:var(--danger)" onclick="rejectDuplicatePendingSavings()">Reject duplicate savings (${duplicateIds.length})</button></div>` : ''}
        <div class="desc">${pending.length} savings entr${pending.length!==1?'ies':'y'} pending approval · Grouped by group</div>
      </div>
      <div class="actions">
        ${pending.length > 0 ? `
          <select class="input" style="width:auto;min-width:110px" onchange="state._savingsApprovalPageSize=Number(this.value);state._savingsApprovalPage=0;pageSavingsApprovals()">
            ${[50,100,200].map(n=>`<option value="${n}" ${pageSize===n?'selected':''}>${n} rows</option>`).join('')}
          </select>` : ''}
        ${pending.length > 0 ? `<button class="btn btn-primary" onclick="approveAllSavings()">✓ Approve All (${pending.length})</button>` : ''}
      </div>
    </div>

    ${pending.length === 0 ? `
      <div class="card" style="padding:32px;text-align:center">
        <div style="font-size:32px;margin-bottom:12px">✅</div>
        <h3>All savings entries are approved</h3>
        <p class="muted">No pending savings at this time.</p>
      </div>` :

    groupKeys.map(grpName => {
      const entries = byGroup[grpName];
      const groupTotal = entries.reduce((a,s)=>a+Number(s.amount||0),0);
      return `
      <div class="card" style="margin-bottom:14px">
        <div class="card-head">
          <h3>${grpName} <span class="badge b-yellow" style="margin-left:6px">${entries.length} pending</span></h3>
          <div style="display:flex;gap:8px;align-items:center">

            <button class="btn btn-sm btn-primary" onclick="approveGroupSavings('${grpName.replace(/'/g,"\\'")}')">✓ Approve group</button>
          </div>
        </div>
        <div style="overflow-x:auto"><table class="tbl">
          <thead><tr>
            <th>Member</th><th>Date</th>
            <th class="num">Amount</th><th>Notes</th><th>Recorded by</th><th></th>
          </tr></thead>
          <tbody>
            ${entries.map(s => {
              const mem = state.data.members.find(m=>m.id===s.member_id);
              const rec = state.data.staff.find(st=>st.id===s.recorded_by);
              return `<tr>
                <td><b>${mem?.full_name||'—'}</b></td>
                <td>${fmtDate(s.meeting_date)}</td>
                <td class="num"><b>${KES(s.amount)}</b></td>
                <td style="font-size:12px;color:var(--text-muted)">${s.notes||'—'}</td>
                <td style="font-size:12px;color:var(--text-muted)">${rec?.full_name||'—'}</td>
                <td>
                  <button class="btn btn-sm btn-primary" onclick="approveOneSaving('${s.id}',this)">✓</button>
                  <button class="btn btn-sm btn-outline" style="margin-left:4px;color:var(--danger);border-color:var(--danger)" onclick="rejectOneSaving('${s.id}',this)">✕</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      </div>`;
    }).join('')}
    ${pending.length > pageSize ? `
      <div class="card" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
        <div class="muted">Showing ${pageStart + 1}-${Math.min(pageStart + pageRows.length, pending.length)} of ${pending.length} pending savings</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline" ${page<=0?'disabled':''} onclick="state._savingsApprovalPage=${page-1};pageSavingsApprovals()">Previous</button>
          <button class="btn btn-outline" ${page>=totalPages-1?'disabled':''} onclick="state._savingsApprovalPage=${page+1};pageSavingsApprovals()">Next</button>
        </div>

async function approveOneRepayment(id, btn){
  const r = state.data.repayments.find(x=>x.id===id);
  if(!r || r.status==='approved') return;
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  if(!(await ensureFreshToken())) return;
  const { error } = await sb.from('pb_repayments').update({ status:'approved' }).eq('id', id);
  if(error){ toast(error.message,'error'); if(btn){ btn.disabled=false; btn.textContent='✓'; } return; }
  r.status = 'approved';
  render();
  toast('Repayment approved.','success');
}

async function rejectOneRepayment(id, btn){
  const r = state.data.repayments.find(x=>x.id===id);
  if(!r) return;
  confirmDialog('Reject this repayment? It will be marked as rejected and will not count toward the loan balance.', async()=>{
    if(!(await ensureFreshToken())) return;
    const { error } = await sb.from('pb_repayments').update({ status:'rejected' }).eq('id', id);
    if(error) return toast(error.message,'error');
    r.status = 'rejected';
    render();
    toast('Repayment rejected.','warn');
  },{ title:'Reject Repayment', danger:true });
}

async function approveGroupRepayments(groupName){
  if(!(await ensureFreshToken())) return;
  const ids = state.data.repayments
    .filter(r => r.status==='pending' && isClientRepayment(r) && (state.data.groups.find(g=>g.id===r.group_id)?.name||'— No group')===groupName)
    .map(r=>r.id);
  if(!ids.length) return toast('No pending repayments for this group.','warn');
  const { error } = await sb.from('pb_repayments').update({ status:'approved' }).in('id', ids);
  if(error) return toast(error.message,'error');
  state.data.repayments.filter(r=>ids.includes(r.id)).forEach(r=>r.status='approved');
  render();
  toast(`${ids.length} repayment(s) for ${groupName} approved.`,'success');
}

async function approveAllRepayments(){
  confirmDialog(`Approve ALL ${state.data.repayments.filter(r=>r.status==='pending'&&isClientRepayment(r)).length} pending repayments at once?`, async()=>{
    if(!(await ensureFreshToken())) return;
    const ids = state.data.repayments
      .filter(r=>r.status==='pending' && isClientRepayment(r))
      .map(r=>r.id);
    const { error } = await sb.from('pb_repayments').update({ status:'approved' }).in('id', ids);
    if(error) return toast(error.message,'error');
    state.data.repayments.filter(r=>ids.includes(r.id)).forEach(r=>r.status='approved');
    render();
    toast(`${ids.length} repayment(s) approved.`,'success');
  },{ title:'Approve All Repayments' });
}

function repRowActions(ev, id){
  const rep = state.data.repayments.find(x=>x.id===id);
  const canApproveRep = can('approve_repayment');
  const canEdit = canApproveRep || ( state.staff.role === 'officer' || state.staff.role === 'loan_officer');
  const items = [
    { label: '✏ Edit entry', onClick: () => openEditRepayment(id) }
  ];
  if(canApproveRep && rep && rep.status === 'pending'){
    items.push('sep');
    items.push({ label: '✓ Approve', onClick: async () => {
      if(rep.status === 'approved'){ toast('Already approved.','warn'); return; }
      if(!(await ensureFreshToken())) return;
      const { error } = await sb.from('pb_repayments').update({ status: 'approved' }).eq('id', id);
      if(error) return toast(error.message, 'error');
      rep.status = 'approved';
      render();
      toast('Repayment entry approved.', 'success');
    }});
  }
  if(canEdit){
    items.push('sep');
    items.push({ label: '🗑 Delete entry', danger: true, onClick: () => confirmDialog(
      'Delete this repayment entry? This cannot be undone.',
      async () => {
        if(!(await ensureFreshToken())) return;
        const { error } = await sb.from('pb_repayments').delete().eq('id', id);
        if(error) return toast(error.message, 'error');
        state.data.repayments = state.data.repayments.filter(x => x.id !== id);
        audit('delete_repayment', 'pb_repayments', id);
        render();
        toast('Repayment entry deleted.', 'warn');
      },
      { title: 'Delete Repayment Entry', danger: true }
    )});
  }
  showActMenu(ev, items);
}

function downloadCollectionSheet(targetDate, officerFilter){
  targetDate = targetDate || todayISO();
  const isAdmin = state.staff.role === 'admin';

  // Determine day of week from target date (e.g. "Monday")
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const dow = dayNames[new Date(targetDate + 'T12:00:00').getDay()];

  // Filter groups by meeting_day matching the target day, and by officer if set
  const matchedGroups = state.data.groups.filter(g => {
    const dayMatch = (g.meeting_day || '').toLowerCase() === dow.toLowerCase();
    if(!dayMatch) return false;
    if(officerFilter) return g.officer_id === officerFilter;
    if(!isAdmin) return g.officer_id === state.staff.id;
    return true;
  });

  if(!matchedGroups.length){
    toast(`No groups meet on ${dow} (${targetDate})${officerFilter ? ' for the selected officer' : ''}.`, 'warn');
    return;
  }

  const matchedGroupIds = new Set(matchedGroups.map(g => g.id));

  const activeLoans = state.data.loans.filter(l =>
    l.status === 'active' && matchedGroupIds.has(l.group_id)
  );

  if(!activeLoans.length){
    toast(`No active loans found for groups meeting on ${dow}.`, 'warn');
    return;
  }

  const rows = activeLoans.map(l => {
    const m = state.data.members.find(x => x.id === l.member_id);
    const g = state.data.groups.find(x => x.id === l.group_id);
    const off = state.data.staff.find(x => x.id === l.officer_id);
    const weekly = Number(l.weekly_installment) || 0;
    const totalPayable = Number(l.total_payable) || 0;
    const paid = loanPaid(l.id);
    const outstanding = Math.max(0, totalPayable - paid);
    const paidInstallments = weekly > 0 ? Math.floor(paid / weekly) : 0;
    const totalInstallments = weekly > 0 ? Math.ceil(totalPayable / weekly) : 0;
    const unpaidInstallments = Math.max(0, totalInstallments - paidInstallments);
    return {
      'Client ID': m?.national_id || '—',
      'Client Name': m?.full_name || '—',
      'Group': g?.name || '—',
      'Officer': off?.full_name || '—',
      'Loan Product (Asset)': l.asset_name,
      'Outstanding Balance': Number(outstanding.toFixed(2)),
      'Installment Amount': weekly,
      'Paid Installments': paidInstallments,
      'Unpaid Installments': unpaidInstallments,
      'Expected End Date': l.expected_end_date || '—'
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length, 18) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${dow} Collection`);
  XLSX.writeFile(wb, `collection_sheet_${dow}_${targetDate}.xlsx`);
  toast(`Collection sheet exported — ${rows.length} loan${rows.length!==1?'s':''} for ${dow} (${targetDate}).`, 'success');
}

  const ir = Number(ln.total_payable) ? (Number(ln.total_payable) - Number(ln.loan_value)) / Number(ln.total_payable) : 0;

  modal({
    title: `Record Repayment — ${ln.asset_name}`,

      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: 'Save Repayment', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const amount = Number(document.getElementById('sr-amount')?.value) || 0;
        const date = document.getElementById('sr-date')?.value || todayISO();
        if(!amount || amount <= 0) return toast('Please enter a valid amount.', 'error');
        if(amount > outstanding + 1) return toast(`Amount exceeds outstanding balance of ${KES(outstanding)}.`, 'error');

        const interest = +(amount * ir).toFixed(2);
        const principal = +(amount - interest).toFixed(2);

        const row = {
          business_id: state.staff.business_id || null,
          loan_id: ln.id,
          member_id: ln.member_id,
          group_id: ln.group_id || null,
          meeting_date: date,
          amount, principal, interest,
          recorded_by: state.staff.id,
          status: can('approve_repayment') ? 'approved' : 'pending'
        };

        const { data, error } = await sb.from('pb_repayments').insert(row).select().single();
        if(error) return toast(error.message, 'error');

        state.data.repayments.unshift(data);
        audit('standalone_repayment', 'pb_repayments', data.id, null, row);

        // Auto-complete loan if fully paid
        const newPaid = paid + amount;
        if(newPaid >= Number(ln.total_payable)){
          await sb.from('pb_loans').update({ status: 'completed' }).eq('id', ln.id);
          ln.status = 'completed';
          toast('Loan fully repaid and marked as completed!', 'success');
        } else {
          toast('Repayment recorded successfully.', 'success');
        }
        closeModal();
        render();
      }}
    ]
  });
}

function srCalcSplit(ir){
  const amount = Number(document.getElementById('sr-amount')?.value) || 0;
  const interest = +(amount * ir).toFixed(2);
  const principal = +(amount - interest).toFixed(2);
  const pi = document.getElementById('sr-principal'); if(pi) pi.textContent = KES(principal);
  const ii = document.getElementById('sr-interest'); if(ii) ii.textContent = KES(interest);
}

/* =====================================================================
 * FEATURE 4 & 5: EDIT SAVINGS with AUDIT TRAIL
 * ===================================================================== */
function openEditSaving(savingId){
  const canEdit = state.staff.role === 'admin' || ( state.staff.role === 'officer' || state.staff.role === 'loan_officer');
  if(!canEdit){ toast('You do not have permission to edit savings entries.', 'error'); return; }

  const sv = state.data.savings.find(x => x.id === savingId);
  if(!sv){ toast('Saving entry not found.', 'error'); return; }

  const mem = state.data.members.find(x => x.id === sv.member_id);

  modal({
    title: 'Edit Savings Entry',
    body: `
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:13px">
        <div><span class="muted">Member: </span><b>${mem?.full_name||'—'}</b></div>
        <div><span class="muted">Date: </span><b>${fmtDate(sv.meeting_date)}</b></div>
        <div><span class="muted">Original amount: </span><b>${KES(sv.amount)}</b></div>
      </div>
      <div class="field">
        <label>New Amount (KES) *</label>
        <input type="number" id="es-amount" min="0" step="0.01" value="${sv.amount}" required />
      </div>
      <div class="field">
        <label>Reason for Edit * <span style="color:var(--danger)">required</span></label>
        <textarea id="es-reason" rows="3" placeholder="Describe why this entry is being edited (e.g. incorrect amount entered, data correction)..." required style="resize:vertical"></textarea>
      </div>
    `,
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: 'Save Changes', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const amount = Number(document.getElementById('es-amount')?.value);
        const reason = document.getElementById('es-reason')?.value.trim();
        if(!amount && amount !== 0) return toast('Please enter a valid amount.', 'error');
        if(!reason) return toast('A reason for the edit is required.', 'error');

        const oldAmount = sv.amount;
        const { error } = await sb.from('pb_savings')
          .update({ amount, edit_notes: reason })
          .eq('id', savingId);

        if(error) return toast(error.message, 'error');

        sv.amount = amount;
        sv.edit_notes = reason;
        audit('edit_saving', 'pb_savings', savingId, { amount: oldAmount }, { amount, edit_notes: reason });
        closeModal();
        render();
        toast('Savings entry updated successfully.', 'success');
      }}
    ]
  });
}

/* =====================================================================
 * FEATURE 4 & 5: EDIT REPAYMENT with AUDIT TRAIL
 * ===================================================================== */
function openEditRepayment(repaymentId){
  const canEdit = state.staff.role === 'admin' || ( state.staff.role === 'officer' || state.staff.role === 'loan_officer');
  if(!canEdit){ toast('You do not have permission to edit repayment entries.', 'error'); return; }

  const rep = state.data.repayments.find(x => x.id === repaymentId);
  if(!rep){ toast('Repayment entry not found.', 'error'); return; }

  const mem = state.data.members.find(x => x.id === rep.member_id);
  const ln = state.data.loans.find(x => x.id === rep.loan_id);
  const ir = ln && Number(ln.total_payable) ? (Number(ln.total_payable) - Number(ln.loan_value)) / Number(ln.total_payable) : 0;

  modal({
    title: 'Edit Repayment Entry',
    body: `
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:13px">
        <div><span class="muted">Member: </span><b>${mem?.full_name||'—'}</b></div>
        <div><span class="muted">Loan: </span><b>${ln?.asset_name||'—'}</b></div>
        <div><span class="muted">Date: </span><b>${fmtDate(rep.meeting_date)}</b></div>
        <div><span class="muted">Original amount: </span><b>${KES(rep.amount)}</b></div>
      </div>
      <div class="field">
        <label>New Amount (KES) *</label>
        <input type="number" id="er-amount" min="0" step="0.01" value="${rep.amount}" oninput="erCalcSplit(${ir})" required />
      </div>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:13px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px">Recalculated split</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div class="muted" style="font-size:11px">Principal</div><div id="er-principal" style="font-weight:700">${KES(+(rep.amount*(1-ir)).toFixed(2))}</div></div>
          <div><div class="muted" style="font-size:11px">Interest</div><div id="er-interest" style="font-weight:700;color:var(--warning)">${KES(+(rep.amount*ir).toFixed(2))}</div></div>
        </div>
      </div>
      <div class="field">
        <label>Reason for Edit * <span style="color:var(--danger)">required</span></label>
        <textarea id="er-reason" rows="3" placeholder="Describe why this entry is being edited..." required style="resize:vertical"></textarea>
      </div>
    `,
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: 'Save Changes', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const amount = Number(document.getElementById('er-amount')?.value);
        const reason = document.getElementById('er-reason')?.value.trim();
        if(!amount && amount !== 0) return toast('Please enter a valid amount.', 'error');
        if(!reason) return toast('A reason for the edit is required.', 'error');

        const interest = +(amount * ir).toFixed(2);
        const principal = +(amount - interest).toFixed(2);
        const oldAmount = rep.amount;

        const { error } = await sb.from('pb_repayments')
          .update({ amount, principal, interest, edit_notes: reason })
          .eq('id', repaymentId);

        if(error) return toast(error.message, 'error');

        rep.amount = amount;
        rep.principal = principal;
        rep.interest = interest;
        rep.edit_notes = reason;
        audit('edit_repayment', 'pb_repayments', repaymentId, { amount: oldAmount }, { amount, principal, interest, edit_notes: reason });
        closeModal();
        render();
        toast('Repayment entry updated successfully.', 'success');
      }}
    ]
  });
}

function erCalcSplit(ir){
  const amount = Number(document.getElementById('er-amount')?.value) || 0;
  const interest = +(amount * ir).toFixed(2);
  const principal = +(amount - interest).toFixed(2);
  const pi = document.getElementById('er-principal'); if(pi) pi.textContent = KES(principal);
  const ii = document.getElementById('er-interest'); if(ii) ii.textContent = KES(interest);
}

function exportAccountingReport(){
  const { start, end } = dashDateRange();
  const inRange = date => date >= start && date <= end;
  const wb = XLSX.utils.book_new();
  // Savings
  const savRows = state.data.savings.filter(s=>inRange(s.meeting_date||'')).map(s=>{
    const m = state.data.members.find(x=>x.id===s.member_id), g=state.data.groups.find(x=>x.id===s.group_id);
    return {Date:s.meeting_date,Group:g?.name,Member:m?.full_name,Amount:Number(s.amount)};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(savRows), 'Savings');
  // Repayments
  const repRows = state.data.repayments.filter(r=>inRange(r.meeting_date||'')).map(r=>{
    const m=state.data.members.find(x=>x.id===r.member_id);
    return {Date:r.meeting_date,Member:m?.full_name,Amount:Number(r.amount),Principal:Number(r.principal),Interest:Number(r.interest)};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(repRows), 'Repayments');
  // Purchases
  const purRows = state.data.purchases.filter(p=>inRange(p.received_on||'')).map(p=>({
    Date:p.received_on,Supplier:p.supplier_name,Invoice:p.invoice_no,Total:Number(p.total_cost)
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(purRows), 'Purchases');
  // Loans
  const lnRows = state.data.loans.filter(l=>inRange(l.start_date||'')).map(l=>{
    const m=state.data.members.find(x=>x.id===l.member_id);
    return {Date:l.start_date,Member:m?.full_name,Asset:l.asset_name,LoanValue:Number(l.loan_value),Weekly:Number(l.weekly_installment)};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lnRows), 'Loans issued');
  XLSX.writeFile(wb, `accounting_${start}_${end}.xlsx`);
  toast('Accounting report exported','success');
}
(async function boot(){
  applyTheme();
  // Restore session
  const { data } = await sb.auth.getSession();
  if(data.session){
    state.session = data.session;
    const ok = await loadStaff();
    if(!ok){ await sb.auth.signOut(); state.session=null; render(); return; }
    await loadSettings();
    await loadBillingStatus({ silent:true });
    if(isSubscriptionLocked()){ render(); return; }
    await smartLoadAll();
    setupRealtime();
    flushQueue();
  }
  render();
  // Restore view position after a page refresh
  const restoreView = sessionStorage.getItem('pb_restore_view');
  const restoreCtx = sessionStorage.getItem('pb_restore_ctx');
  if(state.session && restoreView){
    sessionStorage.removeItem('pb_restore_view');
    sessionStorage.removeItem('pb_restore_ctx');
    state.view = restoreView;
    try { state.viewCtx = restoreCtx ? JSON.parse(restoreCtx) : null; } catch{ state.viewCtx = null; }
    render();
  }
  if(!navigator.onLine) setBanner('You are offline. Cached data shown. Changes will be queued.');
})();
