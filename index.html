<style>
:root{
  --bg:#fffaf5; --surface:#ffffff; --surface-2:#fff5eb; --border:#ffe0c0;
  --text:#1a0a00; --text-muted:#7a4a20; --text-subtle:#b07040;
  --primary:#e65c00; --primary-700:#cc4a00; --primary-50:#fff0e0;
  --accent:#f97316; --accent-50:#fff3e0;
  --success:#137a3f; --success-50:#e6f5ec;
  --warning:#9a6700; --warning-50:#fff5db;
  --danger:#a4262c; --danger-50:#fbeaea;
  --info:#1d5e8a; --info-50:#e6f1f8;
  --radius:8px; --radius-sm:6px; --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(80,30,0,.06), 0 1px 1px rgba(80,30,0,.04);
  --shadow-md:0 4px 12px rgba(80,30,0,.10);
  --shadow-lg:0 14px 40px rgba(80,30,0,.18);
  --sidebar-w:248px;
  --header-h:56px;
}
body.dark{
  --bg:#1a0a00; --surface:#2a1200; --surface-2:#1f0d00; --border:#5a2a00;
  --text:#ffe8d0; --text-muted:#c0805a; --text-subtle:#8a5030;
  --primary:#f97316; --primary-700:#fb9a4a; --primary-50:#3a1500;
  --accent:#fb923c; --accent-50:#3a1500;
  --success-50:#0f2a1c; --warning-50:#2a2208; --danger-50:#2a1212; --info-50:#0f2333;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-50)}
input[disabled],select[disabled]{background:var(--surface-2);color:var(--text-muted)}
label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;letter-spacing:.01em}
.field{margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-700)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{filter:brightness(1.08)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text)}
.btn-outline:hover{background:var(--surface-2);border-color:var(--text-muted)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-ghost{background:transparent;border:none;color:var(--text-muted);padding:6px 10px}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-block{width:100%}

/* Layout */
#app{min-height:100vh}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--primary) 0%,#7a2600 100%)}
.auth-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:36px 32px;width:100%;max-width:420px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.auth-brand .mark{width:36px;height:36px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px}
.auth-brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.auth-sub{color:var(--text-muted);font-size:13px;margin-bottom:22px}
.auth-sep{margin:18px 0;border-top:1px solid var(--border);position:relative;text-align:center}
.auth-sep span{position:relative;top:-9px;background:var(--surface);padding:0 10px;font-size:11px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:.08em}
.auth-error{background:var(--danger-50);color:var(--danger);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:14px}
.auth-info{background:var(--info-50);color:var(--info);border:1px solid var(--info);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:14px}

.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--primary);color:#cbd6e8;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:40;transition:transform .25s ease}
.sidebar .brand{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar .brand .mark{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:12px}
.sidebar .brand .title{color:#fff;font-weight:700;font-size:14px;letter-spacing:-.01em}
.sidebar .brand .sub{color:#7e92b4;font-size:11px;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:14px 10px}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6e83a7;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:#cbd6e8;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.active{background:rgba(255,255,255,.10);color:#fff}
.nav a .icn{width:16px;height:16px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#9bb0d3}
.nav a.active .icn{color:#fff}
.sidebar-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#8a9dbe}

.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:30}
.topbar .menu-btn{display:none;background:none;border:none;padding:6px;color:var(--text)}
.topbar h2{margin:0;font-size:15px;font-weight:600;color:var(--text);flex:1;letter-spacing:-.01em}
.topbar .user{display:flex;align-items:center;gap:10px}
.topbar .user .av{width:30px;height:30px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px}
.topbar .user .name{font-size:13px;font-weight:600;line-height:1.2}
.topbar .user .role{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}

.content{flex:1;padding:22px 26px 80px;max-width:100%;overflow-x:hidden}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .topbar .menu-btn{display:inline-flex}
  .content{padding:16px 14px 96px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.scrim.show{display:block}

/* Page chrome */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.015em}
.page-head .desc{color:var(--text-muted);font-size:13px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.005em}
.card-head .sub{font-size:12px;color:var(--text-muted)}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--accent)}
.kpi.k-success::before{background:var(--success)}
.kpi.k-warn::before{background:var(--warning)}
.kpi.k-danger::before{background:var(--danger)}
.kpi.k-primary::before{background:var(--primary)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--text-muted);margin-top:3px}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl thead th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.01em;border:1px solid transparent}
.b-green{background:var(--success-50);color:var(--success);border-color:var(--success)}
.b-red{background:var(--danger-50);color:var(--danger);border-color:var(--danger)}
.b-yellow{background:var(--warning-50);color:var(--warning);border-color:var(--warning)}
.b-blue{background:var(--accent-50);color:var(--accent);border-color:var(--accent)}
.b-grey{background:var(--surface-2);color:var(--text-muted);border-color:var(--border)}
.b-info{background:var(--info-50);color:var(--info);border-color:var(--info)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;overflow-y:auto}
.modal-back.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column}
.modal.lg{max-width:780px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x-btn{background:none;border:none;color:var(--text-muted);font-size:20px;line-height:1;padding:4px;cursor:pointer}
.x-btn:hover{color:var(--text)}

/* Stepper */
.stepper{display:flex;justify-content:space-between;margin-bottom:22px;gap:8px}
.step{flex:1;text-align:center;padding:9px 6px;border-radius:var(--radius-sm);background:var(--surface-2);font-size:12px;color:var(--text-muted);font-weight:600;border:1px solid var(--border);position:relative}
.step.done{background:var(--success-50);color:var(--success);border-color:var(--success)}
.step.current{background:var(--primary);color:#fff;border-color:var(--primary)}
.step .n{display:inline-block;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.2);font-size:10px;line-height:18px;margin-right:6px;font-weight:700}
.step.current .n{background:rgba(255,255,255,.25)}
@media(max-width:600px){.step .lbl{display:none}.step{padding:8px 4px}.step .n{margin-right:0}}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:200px}
.search-box{position:relative}
.search-box input{padding-left:34px}
.search-box .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

/* Action menu (fixed positioning to avoid clipping) */
.act-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 9px;color:var(--text-muted);cursor:pointer;font-size:13px;font-weight:600}
.act-btn:hover{color:var(--text);border-color:var(--text-muted)}
.act-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:100;min-width:180px;padding:5px;display:none}
.act-menu.show{display:block}
.act-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 11px;background:none;border:none;border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer}
.act-menu button:hover{background:var(--surface-2)}
.act-menu button.danger{color:var(--danger)}
.act-menu .sep{height:1px;background:var(--border);margin:4px 0}

/* Empty / loading */
.empty{padding:50px 20px;text-align:center;color:var(--text-muted)}
.empty h4{margin:0 0 6px;color:var(--text);font-weight:600}
.empty p{margin:0;font-size:13px;max-width:380px;margin:0 auto}

.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast-stack{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);padding:10px 14px;font-size:13px;animation:slideIn .2s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast .t{font-weight:600;margin-bottom:2px}
.toast .m{color:var(--text-muted);font-size:12px}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Bottom nav (mobile) */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:25;padding:5px 0 max(5px,env(safe-area-inset-bottom));justify-content:space-around}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;color:var(--text-muted);font-size:10px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm);min-width:54px}
.bottom-nav a.active{color:var(--accent)}
@media(max-width:768px){.bottom-nav{display:flex}.content{padding-bottom:84px}}

/* Status banner */
.status-banner{position:fixed;top:0;left:0;right:0;background:var(--warning);color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:600;z-index:300;display:none}
.status-banner.show{display:block}
.status-banner.online{background:var(--success)}

/* Member meeting card */
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.mc .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mc .av{width:36px;height:36px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.mc .nm{font-weight:600;font-size:14px}
.mc .meta{font-size:11px;color:var(--text-muted);margin-top:1px}
.mc .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc .row.three{grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){.mc .row.three{grid-template-columns:1fr 1fr}}
.mc .ro{background:var(--surface-2);padding:7px 10px;border-radius:var(--radius-sm);font-size:11px;color:var(--text-muted)}
.mc .ro b{display:block;font-size:13px;color:var(--text);font-weight:700;margin-top:1px}
.mc .absent-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--text-muted)}

/* Misc */
.kbd{display:inline-block;padding:1px 6px;font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-family:'SF Mono',Menlo,Consolas,monospace}
.divider{height:1px;background:var(--border);margin:18px 0}
.helper{font-size:11px;color:var(--text-muted);margin-top:4px}
.danger-text{color:var(--danger)}
.success-text{color:var(--success)}
.muted{color:var(--text-muted)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;gap:2px;overflow-x:auto}
.tabs button{background:none;border:none;padding:10px 14px;color:var(--text-muted);font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.checkbox-row{display:flex;align-items:center;gap:8px}
.checkbox-row input{width:auto}
.summary-table{width:100%;font-size:13px}
.summary-table td{padding:6px 0}
.summary-table td:first-child{color:var(--text-muted);width:45%}
.summary-table td:last-child{font-weight:600;text-align:right}
.summary-table h5{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-subtle)}
</style>
</head>
<body>

<div id="status-banner" class="status-banner"></div>
<div id="toast-stack" class="toast-stack"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="actmenu-root"></div>

<script>
/* =====================================================================
 * WAMAMA PAMOJA ENTERPRISE
 * Single-file production application.
 * ===================================================================== */

/* =====================================================================
 * ⚠️  SECURITY NOTICE: ROW LEVEL SECURITY (RLS) — MANDATORY SETUP
 * =====================================================================
 * This frontend relies on Supabase Auth sessions to identify which
 * business is logged in. However, the FRONTEND ALONE CANNOT ENFORCE
 * DATA ISOLATION between businesses. Any user with the anon key could
 * query another business's data if RLS is not enabled on the database.

const sk = k => `pb_${BIZ_ID}_${k}`;
function lsGet(k, d=null){ try{ const v = localStorage.getItem(sk(k)); return v?JSON.parse(v):d; }catch{ return d; } }
function lsSet(k, v){
  try{ localStorage.setItem(sk(k), JSON.stringify(v)); return true; }
  catch(e){
    if(e.name === 'QuotaExceededError'){
      const keys = Object.keys(localStorage).filter(x=>x.startsWith(`pb_${BIZ_ID}_`));
      keys.sort().slice(0, Math.ceil(keys.length*0.2)).forEach(x=>localStorage.removeItem(x));
      try{ localStorage.setItem(sk(k), JSON.stringify(v)); return true; }catch{ return false; }
    }
    return false;
  }
}
function lsDel(k){ localStorage.removeItem(sk(k)); }

/* ----- Crypto / hash for offline auth ----- */
async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  const t = title || ({success:'Success',error:'Error',warn:'Warning',info:'Notice'})[kind];

  el.querySelector('.t').textContent = t;

/* ----- Offline write queue ----- */
async function queuedInsert(table, row){
  if(navigator.onLine){
    const { error } = await sb.from(table).insert(row);
    if(!error) return { ok:true };
    // fall through to queue on network failures
  }
  const q = lsGet('queue', []);
  q.push({ table, row, t: Date.now() });
  lsSet('queue', q);
  return { ok:true, queued:true };
}
async function flushQueue(){
  const q = lsGet('queue', []);
  if(!q.length) return;
  const remaining = [];
  for(const item of q){
    const { error } = await sb.from(item.table).insert(item.row);
    if(error) remaining.push(item);
  }
  lsSet('queue', remaining);
  if(q.length && !remaining.length) toast('Queued changes synchronised.', 'success');
}

async function signIn(email, password){
  email = email.trim().toLowerCase();
  if(!navigator.onLine){
    const cache = lsGet('auth_cache', {});
    const h = await sha256(password);
    const rec = cache[email];
    if(rec && rec.h === h){
      state.session = { user: { id: rec.auth_user_id, email } };
      state.staff = rec.staff;
      state.perms = rec.perms;
      await afterLogin(true);
      return { ok:true, offline:true };
    }
    return { ok:false, error:'No internet connection and no cached credentials for this account.' };
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return { ok:false, error: error.message };
  state.session = data.session;
  const ok = await loadStaff();
  if(!ok){
    await sb.auth.signOut();
    state.session = null;
    return { ok:false, error:'Your authentication account exists but is not provisioned in the staff registry. Please contact your administrator.' };
  }
  // Cache for offline use
  const cache = lsGet('auth_cache', {});
  cache[email] = {
    h: await sha256(password),
    auth_user_id: data.session.user.id,
    staff: state.staff, perms: state.perms
  };
  lsSet('auth_cache', cache);
  await afterLogin(false);
  return { ok:true };
}

/* Central permission helper. Use can('action') going forward instead of
   role==='admin'. Falls back gracefully for legacy code paths. */
function can(action){
  const r = state.staff?.app_role || state.staff?.role || 'officer';
  const matrix = {
    ceo:               ['*'],
    admin:             ['*'],
    branch_manager:    ['approve_loan','approve_group','approve_savings','approve_repayment','approve_order',
                        'view_reports','view_inventory','manage_branch_staff','view_audit'],

    storekeeper:       ['receive_stock','issue_stock','stock_count','view_inventory_reports','view_inventory','request_stock']
  };
  const allowed = matrix[r] || [];
  return allowed.includes('*') || allowed.includes(action);
}

/* =====================================================================
 * BUSINESS REGISTRATION (signup with master key)
 * ===================================================================== */
async function registerBusiness({ businessName, adminName, email, password, key }){
  if(key !== BUSINESS_REGISTRATION_KEY){
    return { ok:false, error:'Invalid business registration key. Contact Wamama Pamoja to obtain a valid key.' };
  }
  if(!navigator.onLine) return { ok:false, error:'An internet connection is required to register a new business.' };
  email = email.trim().toLowerCase();

  let userId = null;
  let session = null;

  // 1. Create the authentication user. If a previous attempt already created
  //    the auth account, sign in and complete the missing staff provisioning.
  const { data: authData, error: authErr } = await sb.auth.signUp({
    email, password,
    options: {
      emailRedirectTo: authRedirectUrl(),
      data: { full_name: adminName, business_name: businessName }
    }
  });

  if(authErr){
    const msg = authErr.message || '';
    if(/already|registered|exists/i.test(msg)){
      const { data: loginData, error: loginErr } = await sb.auth.signInWithPassword({ email, password });
      if(loginErr){
        return { ok:false, error:'This email already has an authentication account. If you have already received the confirmation email, click Confirm email first, then return here and press Register business again with the same email, password and registration key.' };
      }
      userId = loginData.user?.id || loginData.session?.user?.id;
      session = loginData.session || null;
    } else {
      return { ok:false, error: msg };
    }
  } else {
    userId = authData.user?.id;
    session = authData.session || null;
  }

  if(!userId) return { ok:false, error:'Authentication account could not be created.' };

  // 2. Provision business, admin staff registry, permissions and settings in one
  //    server-side database call, so email confirmation cannot leave the account
  //    without a matching staff registry row.
  const { error: provisionErr } = await sb.rpc('pb_register_business_admin', {
    p_auth_user_id: userId,
    p_business_name: businessName,
    p_admin_name: adminName,
    p_admin_email: email,
    p_registration_key: key
  });
  if(provisionErr) return { ok:false, error:'Business provisioning failed: ' + provisionErr.message };

  if(session){
    state.session = session;
    const ok = await loadStaff();
    if(ok){ await afterLogin(false); return { ok:true, signedIn:true }; }
  }

  return { ok:true, requiresEmailConfirmation: !session };
}

    if(error || !data.session){

    return false;
  }
}

async function fetchBusinessTableRows(table){
  const pageSize = 1000;
  const maxRows = 50000;
  const rows = [];
  for(let from = 0; from < maxRows; from += pageSize){
    let query = sb.from(table).select('*').range(from, from + pageSize - 1);
    if (state.staff && state.staff.business_id) {
      query = query.eq('business_id', state.staff.business_id);
    }
    const { data, error } = await query;
    if(error) return { data: rows, error };
    rows.push(...(data || []));
    if(!data || data.length < pageSize) break;
  }
  return { data: rows, error: null };
}

async function smartLoadAll(){
  // Refresh the token before bulk fetching to avoid 401s on expired sessions
  if(navigator.onLine){
    const { data: sessionData, error: sessionErr } = await sb.auth.getSession();
    if(sessionErr || !sessionData.session){
      toast('Session expired. Please sign in again.', 'error');
      await sb.auth.signOut();
      state.session = null; state.staff = null; state.perms = null;
      render(); return;
    }
    const exp = sessionData.session.expires_at;
    if(exp && (exp - Math.floor(Date.now()/1000)) < 600){
      const { data: refreshed, error: refreshErr } = await sb.auth.refreshSession();
      if(!refreshErr && refreshed.session) state.session = refreshed.session;
    }
  }
  state.loading = true; render();
  const tables = ['pb_groups','pb_members','pb_guarantors','pb_staff','pb_inventory','pb_loans','pb_orders','pb_savings','pb_repayments','pb_meetings','pb_suppliers','pb_purchases','pb_purchase_lines','pb_reconciliations','pb_expenses'];
  const map = { pb_groups:'groups', pb_members:'members', pb_guarantors:'guarantors', pb_staff:'staff', pb_inventory:'inventory', pb_loans:'loans', pb_orders:'orders', pb_savings:'savings', pb_repayments:'repayments', pb_meetings:'meetings', pb_suppliers:'suppliers', pb_purchases:'purchases', pb_purchase_lines:'purchaseLines', pb_reconciliations:'reconciliations', pb_expenses:'expenses' };
  const results = await Promise.all(tables.map(t => fetchBusinessTableRows(t)));
  let jwtBroken = false;
  results.forEach((r,i) => {
    if(!r.error){
      state.data[map[tables[i]]] = r.data || [];
      cacheDataKey(map[tables[i]], r.data || []);
    } else {
      if(!jwtBroken && r.error.message && /jwt|unauthorized|401/i.test(r.error.message)){
        jwtBroken = true;
        toast('Authentication error loading data. Please sign in again.', 'error');
        sb.auth.signOut().then(()=>{ state.session=null; state.staff=null; state.perms=null; render(); });
      }
      state.data[map[tables[i]]] = readCachedDataKey(map[tables[i]]);
    }
  });
  // Fix 1: Reconstruct purchase items from purchase lines after page reload
  // Without this, p.items is undefined on reload (it only exists in-memory right after creation)
  if(!jwtBroken){
    state.data.purchases.forEach(p => {
      p.items = state.data.purchaseLines.filter(l => l.purchase_id === p.id);
    });
    applySupervisorDataScope();
    state.loading = false;
  }
}

/* ----- Realtime ----- */
let rtChan = null;
let realtimeRenderTimer = null;
function scheduleRealtimeRender(){
  if(realtimeRenderTimer) return;
  realtimeRenderTimer = setTimeout(() => {
    realtimeRenderTimer = null;
    render();
  }, 160);
}
function handleRealtimeChange(payload){
  if(payload.table === 'pb_settings'){
    state.settings = payload.new;
    lsSet('settings', state.settings);
    scheduleRealtimeRender();
    return;
  }
  const tbl = payload.table;
  const map = { pb_groups:'groups', pb_members:'members', pb_guarantors:'guarantors', pb_inventory:'inventory', pb_loans:'loans', pb_orders:'orders', pb_savings:'savings', pb_repayments:'repayments', pb_meetings:'meetings', pb_suppliers:'suppliers', pb_staff:'staff', pb_purchases:'purchases', pb_purchase_lines:'purchaseLines', pb_reconciliations:'reconciliations', pb_expenses:'expenses' };
  const key = map[tbl]; if(!key) return;
  const arr = state.data[key];
  if(payload.eventType === 'INSERT'){ if(!arr.find(x=>x.id===payload.new.id)) arr.unshift(payload.new); }
  else if(payload.eventType === 'UPDATE'){ const i = arr.findIndex(x=>x.id===payload.new.id); if(i>=0) arr[i] = payload.new; }
  else if(payload.eventType === 'DELETE'){ const i = arr.findIndex(x=>x.id===payload.old.id); if(i>=0) arr.splice(i,1); }
  applySupervisorDataScope();
  cacheDataKey(key, state.data[key]);
  if(['dashboard','members','groups','meeting','loans','inventory','repayments','savings','accounting','reports'].includes(state.view)) scheduleRealtimeRender();
}
function setupRealtime(){
  if(rtChan) sb.removeChannel(rtChan);
  const businessId = state.staff?.business_id || '';
  const businessFilter = businessId ? `business_id=eq.${businessId}` : null;
  rtChan = sb.channel(`pb_changes_${businessId || 'default'}`);
  if(businessId){
    rtChan.on('postgres_changes', { event:'*', schema:'public', table:'pb_settings', filter:`id=eq.biz_${businessId}` }, handleRealtimeChange);
  }
  [
    'pb_groups','pb_members','pb_guarantors','pb_inventory','pb_loans','pb_orders',
    'pb_savings','pb_repayments','pb_meetings','pb_suppliers','pb_staff',
    'pb_purchases','pb_purchase_lines','pb_reconciliations','pb_expenses'
  ].forEach(table => {
    const opts = { event:'*', schema:'public', table };
    if(businessFilter) opts.filter = businessFilter;
    rtChan.on('postgres_changes', opts, handleRealtimeChange);
  });
  rtChan.subscribe();
}

function memberSavings(memberId){
  return state.data.savings.filter(s=>s.member_id===memberId && s.status!=='pending').reduce((a,b)=>a + Number(b.amount||0), 0);
}
function memberLoan(memberId){
  return state.data.loans.find(l=>l.member_id===memberId && l.status==='active');
}
function cleanMemberText(v){
  return String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function canManageMemberDuplicates(){
  const r = state.staff?.app_role || state.staff?.role || '';
  return state.staff?.role === 'admin' || ['ceo','admin','branch_manager'].includes(r) || can('approve_group');
}
function memberDuplicateMatches(member){
  if(!member) return [];
  const id = cleanMemberText(member.national_id);
  const phone = normalisePhone(member.phone||'');
  const name = cleanMemberText(member.full_name);
  return state.data.members.filter(other => {
    if(other.id === member.id) return false;
    const sameId = id && cleanMemberText(other.national_id) === id;
    const samePhone = phone && phone.length >= 9 && normalisePhone(other.phone||'') === phone;
    const sameNameInGroup = name && cleanMemberText(other.full_name) === name && other.group_id === member.group_id;
    return sameId || samePhone || sameNameInGroup;
  });
}
function isDuplicateMember(member){
  return memberDuplicateMatches(member).length > 0;
}
function memberLinkedCounts(memberId){
  return {
    savings: state.data.savings.filter(s=>s.member_id===memberId).length,
    repayments: state.data.repayments.filter(r=>r.member_id===memberId).length,
    loans: state.data.loans.filter(l=>l.member_id===memberId).length,
    orders: state.data.orders.filter(o=>o.member_id===memberId).length,
    guarantors: state.data.guarantors.filter(g=>g.member_id===memberId).length
  };
}
function isSafeEmptyDuplicateMember(member){
  if(!member || member.status !== 'inactive' || !isDuplicateMember(member)) return false;
  const c = memberLinkedCounts(member.id);
  const financialLinks = c.savings + c.repayments + c.loans + c.orders;
  return financialLinks === 0 && memberSavings(member.id) === 0;
}
function loanPaid(loanId){
  return state.data.repayments.filter(r=>r.loan_id===loanId && r.status!=='pending').reduce((a,b)=>a + Number(b.amount||0), 0);
}
// Global lock to prevent double-taps while a Supabase call is in flight
let _processing = false;
async function withLock(btn, fn){
  if(_processing) return;
  _processing = true;
  const origText = btn?.textContent;
  const origDisabled = btn?.disabled;
  if(btn){ btn.disabled = true; btn.textContent = origText?.includes('…') ? origText : (origText + '…'); }
  try { await fn(); }
  finally {
    _processing = false;
    if(btn){ btn.disabled = origDisabled || false; btn.textContent = origText; }
  }
}
// Excludes auto-deducted setup fees (6% charge, 3% app fee, 3% insurance)
// so dashboards, KPIs and reports show only real collected cash.
const isClientRepayment = r => !(r.notes||'').startsWith('Auto-deducted');
function memberEligible(memberId){
  const t = Number(state.settings?.savings_threshold || 400);
  return memberSavings(memberId) >= t;
}
function groupSavingsTotal(groupId){
  return state.data.savings.filter(s=>s.group_id===groupId).reduce((a,b)=>a + Number(b.amount||0), 0);
}

function billingTodayParts(){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Africa/Nairobi', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
  const pick = t => parts.find(p=>p.type===t)?.value;
  return { year: pick('year'), month: pick('month'), day: Number(pick('day')||1) };
}
function billingMonthISO(){ const d = billingTodayParts(); return `${d.year}-${d.month}-01`; }
function isAdminBillingUser(){ return !!state.staff && state.staff.role === 'admin'; }
function isSubscriptionLocked(){ return isAdminBillingUser() && !!state.billing?.locked; }
function shouldShowBillingReminder(){ return isAdminBillingUser() && !!state.billing?.reminder; }
function billingReminderMinimized(){ return sessionStorage.getItem('wp_billing_reminder_minimized') === state.billing?.cycleMonth; }
function minimizeBillingReminder(){ sessionStorage.setItem('wp_billing_reminder_minimized', state.billing?.cycleMonth || billingMonthISO()); render(); }
function showBillingReminder(){ sessionStorage.removeItem('wp_billing_reminder_minimized'); render(); }
async function loadBillingStatus({ silent=false } = {}){
  if(!isAdminBillingUser()){
    state.billing = { status:'not_applicable', paid:true, cycleMonth:billingMonthISO(), checkedAt:new Date().toISOString(), locked:false, reminder:false, pending:false };
    return state.billing;
  }
  const cycleMonth = billingMonthISO();
  const day = billingTodayParts().day;
  const cached = lsGet('billing_status', null);
  if(!navigator.onLine){
    const cachedPaid = cached && cached.cycleMonth === cycleMonth && cached.paid;
    state.billing = { status: cachedPaid ? 'paid' : 'offline_unverified', paid: !!cachedPaid, cycleMonth, checkedAt:new Date().toISOString(), locked: !cachedPaid && day >= 3, reminder: !cachedPaid && day < 3, pending:false };
    return state.billing;
  }
  const { data, error } = await sb.from('pb_billing_cycles').select('status,paid_at,paid_until,receipt_number,phone').eq('business_id', state.staff.business_id).eq('billing_month', cycleMonth).maybeSingle();
  if(error){
    if(!silent) toast('Could not check subscription payment status. Please try again.', 'error');
    const cachedPaid = cached && cached.cycleMonth === cycleMonth && cached.paid;
    state.billing = { status: cachedPaid ? 'paid' : 'unknown', paid: !!cachedPaid, cycleMonth, checkedAt:new Date().toISOString(), locked: !cachedPaid && day >= 3, reminder: !cachedPaid && day < 3, pending:false };
    return state.billing;
  }
  const paid = data?.status === 'paid';
  const pending = data?.status === 'pending';
  state.billing = { status: data?.status || 'unpaid', paid, cycleMonth, checkedAt:new Date().toISOString(), locked: !paid && day >= 3, reminder: !paid && day < 3, pending, receiptNumber: data?.receipt_number || null, paidUntil: data?.paid_until || null, phone: data?.phone || null };
  lsSet('billing_status', state.billing);
  return state.billing;
}
function billingDueDateLabel(){ const d = billingTodayParts(); return new Date(`${d.year}-${d.month}-03T00:00:00+03:00`).toLocaleDateString('en-KE', { day:'2-digit', month:'short', year:'numeric' }); }
function billingMessage(){
  if(state.billing?.pending) return 'Payment prompt was sent. Complete it on the phone, then click Check payment.';
  if(state.billing?.locked) return 'Admin access is locked because this month subscription is unpaid.';
  return `Subscription payment is due. Please pay before ${billingDueDateLabel()} to avoid admin lock.`;
}

        toast('Business registered and signed in successfully.', 'success');
      } else {
        $('auth-msg').innerHTML = `<div class="auth-info">Business registered successfully. ${res.requiresEmailConfirmation ? 'A confirmation email has been sent to the administrator address. Please confirm the email, then return here to sign in.' : 'You may now sign in.'}</div>`;

        setTimeout(()=>{ authMode='signin'; renderAuth(); }, 1200);
      }
    });

function pendingApprovalsCount(){

                              n += (d.members||[]).filter(m=>m.status==='pending').length;

  if(can('approve_savings'))  n += (d.savings||[]).filter(s=>s.status==='pending').length;
  if(can('approve_repayment'))n += (d.repayments||[]).filter(r=>r.status==='pending' && isClientRepayment(r)).length;
  if(can('approve_order'))    n += (d.orders||[]).filter(o=>o.status==='pending').length;

                              ).length;
  return n;
}

function duplicateKey(parts){
  return parts.map(v=>String(v||'').trim().toLowerCase()).join('|');
}
function keepFirstDuplicateIds(rows, keyFn){
  const seen = new Map();
  const dupIds = [];
  rows.forEach(row=>{
    const key = keyFn(row);
    if(!key) return;
    if(seen.has(key)) dupIds.push(row.id);
    else seen.set(key, row.id);
  });
  return dupIds;
}
function findDuplicatePendingSavingIds(rows){
  const pending = (rows||[]).filter(s=>s.status==='pending');
  return keepFirstDuplicateIds(pending, s=>duplicateKey([
    s.member_id,
    s.group_id,
    Number(s.amount||0).toFixed(2),
    (s.meeting_date||s.created_at||'').slice(0,10),
    s.recorded_by || ''
  ]));
}
function findDuplicatePendingLoanIds(rows){
  const pending = (rows||[]).filter(l=>l.status==='pending');
  return keepFirstDuplicateIds(pending, l=>duplicateKey([
    l.member_id,
    l.group_id,
    l.order_id || '',
    l.asset_name || '',
    Number(l.loan_value||0).toFixed(2),
    (l.start_date||l.created_at||'').slice(0,10)
  ]));
}
function findDuplicatePendingRepaymentIds(rows){
  const pending = (rows||[]).filter(r=>r.status==='pending' && isClientRepayment(r));
  return keepFirstDuplicateIds(pending, r=>duplicateKey([
    r.member_id,
    r.loan_id,
    r.group_id,
    Number(r.amount||0).toFixed(2),
    (r.meeting_date||r.created_at||'').slice(0,10),
    r.recorded_by || ''
  ]));
}
async function rejectDuplicatePendingSavings(){
  const ids = findDuplicatePendingSavingIds(state.data.savings||[]);
  if(!ids.length) return toast('No duplicate pending savings found.','warn');
  confirmDialog(`Reject ${ids.length} duplicate pending savings entr${ids.length!==1?'ies':'y'}? The first matching entry will be kept.`, async()=>{
    if(!(await ensureFreshToken())) return;
    const { error } = await sb.from('pb_savings').update({ status:'rejected' }).in('id', ids);
    if(error) return toast(error.message,'error');
    state.data.savings.filter(s=>ids.includes(s.id)).forEach(s=>s.status='rejected');
    audit('bulk_reject_duplicate_savings','pb_savings',null,null,{ count:ids.length, ids });
    render();
    toast(`${ids.length} duplicate savings entr${ids.length!==1?'ies':'y'} rejected.`, 'success');
  },{ title:'Reject duplicate savings', danger:true });
}
async function rejectDuplicatePendingLoans(){
  const soldPending = (state.data.loans||[]).filter(l => l.status === 'pending' &&
    l.order_id && (state.data.orders||[]).find(o => o.id === l.order_id && (()=>{ try{ return JSON.parse(o.notes||'{}').source==='sold_items'; }catch{ return false; } })())
  );
  const ids = findDuplicatePendingLoanIds(soldPending);
  if(!ids.length) return toast('No duplicate pending loans found.','warn');
  confirmDialog(`Reject ${ids.length} duplicate pending loan${ids.length!==1?'s':''}? The first matching loan will be kept.`, async()=>{
    if(!(await ensureFreshToken())) return;
    const { error } = await sb.from('pb_loans').update({ status:'cancelled' }).in('id', ids);
    if(error) return toast(error.message,'error');
    state.data.loans.filter(l=>ids.includes(l.id)).forEach(l=>l.status='cancelled');
    await sb.from('pb_repayments').update({ status:'cancelled' }).in('loan_id', ids).eq('status','pending');
    state.data.repayments.filter(r=>ids.includes(r.loan_id) && r.status==='pending').forEach(r=>r.status='cancelled');
    audit('bulk_reject_duplicate_loans','pb_loans',null,null,{ count:ids.length, ids });
    render();
    toast(`${ids.length} duplicate loan${ids.length!==1?'s':''} rejected.`, 'success');
  },{ title:'Reject duplicate loans', danger:true });
}
async function rejectDuplicatePendingRepayments(){
  const ids = findDuplicatePendingRepaymentIds(state.data.repayments||[]);
  if(!ids.length) return toast('No duplicate pending repayments found.','warn');
  confirmDialog(`Reject ${ids.length} duplicate pending repayment${ids.length!==1?'s':''}? The first matching repayment will be kept.`, async()=>{
    if(!(await ensureFreshToken())) return;
    const { error } = await sb.from('pb_repayments').update({ status:'rejected' }).in('id', ids);

}

async function approveSoldItemsLoan(loanId, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Approving…'; }
  const loan = state.data.loans.find(x=>x.id===loanId);
  if(loan && loan.status === 'active'){
    if(btn){ btn.disabled=false; btn.textContent='Approve'; }
    return toast('This loan is already active.','warn');
  }
  if(!(await ensureFreshToken())) return;

  const { error: loanErr } = await sb.from('pb_loans')
    .update({ status:'active' })
    .eq('id', loanId);
  if(loanErr){
    if(btn){ btn.disabled=false; btn.textContent='Approve'; }
    return toast('Approval failed: '+loanErr.message,'error');
  }
  if(loan){ loan.status = 'active'; }

  // No automatic fee entries — all charges (6%+3%+3%) are in total_payable
  // and recovered gradually through weekly client repayments

  audit('approve_sold_items_loan','pb_loans',loanId);
  render();
  toast('Sold items loan approved and added to client portfolio.','success');
}

async function rejectSoldItemsLoan(loanId){
  confirmDialog('Reject and cancel this sold items loan? The loan record will be marked cancelled.', async()=>{
    if(!(await ensureFreshToken())) return;
    const { error } = await sb.from('pb_loans').update({ status:'cancelled' }).eq('id', loanId);
    if(error) return toast(error.message,'error');
    const loan = state.data.loans.find(x=>x.id===loanId);
    if(loan) loan.status = 'cancelled';
    // Also cancel pending fee repayments
    await sb.from('pb_repayments').update({ status:'cancelled' }).eq('loan_id', loanId).eq('status','pending');
    state.data.repayments.filter(r=>r.loan_id===loanId && r.status==='pending').forEach(r=>r.status='cancelled');
    audit('reject_sold_items_loan','pb_loans',loanId);
    render();
    toast('Sold items loan rejected and cancelled.','warn');
  },{ title:'Reject sold items loan', danger:true });
}

async function approveMemberReg(id, btn){
  // Guard: disable button immediately to prevent double-tap
  if(btn){ btn.disabled = true; btn.textContent = 'Approving…'; }
  // Check current status first — may already be approved from a previous tap
  const m = state.data.members.find(x=>x.id===id);
  if(m && m.status === 'active'){
    if(btn){ btn.disabled = false; btn.textContent = 'Approve'; }
    return toast('This client is already active.','warn');
  }
  if(!(await ensureFreshToken())) return;
  const { error } = await sb.from('pb_members').update({ status:'active' }).eq('id', id);
  if(error){
    if(btn){ btn.disabled = false; btn.textContent = 'Approve'; }
    return toast(error.message,'error');
  }
  if(m) m.status = 'active';
  audit('approve_member','pb_members',id);
  render(); toast('Client approved and activated','success');
}
async function rejectMemberReg(id){
  confirmDialog('Reject this client registration? They will be marked inactive.', async()=>{
    if(!(await ensureFreshToken())) return;
    const { error } = await sb.from('pb_members').update({ status:'inactive' }).eq('id', id);
    if(error) return toast(error.message,'error');
    const m = state.data.members.find(x=>x.id===id); if(m) m.status='inactive';
    audit('reject_member','pb_members',id);
    render(); toast('Client registration rejected','warn');
  },{ title:'Reject client', danger:true });
}

function modal({ title, body, actions=[], size='' }){
  const root = $('modal-root');
  root.innerHTML = `
    <div class="modal-back show" id="modal-back">
      <div class="modal ${size}">
        <div class="modal-head"><h3>${title}</h3><button class="x-btn" onclick="closeModal()">×</button></div>
        <div class="modal-body">${body}</div>
        ${actions.length ? `<div class="modal-foot">${actions.map((a,i)=>`<button class="btn ${a.cls||'btn-outline'}" data-act="${i}">${a.label}</button>`).join('')}</div>` : ''}
      </div>
    </div>`;
  actions.forEach((a,i) => {
    root.querySelector(`[data-act="${i}"]`).addEventListener('click', () => a.onClick && a.onClick());
  });
}
function closeModal(){ $('modal-root').innerHTML = ''; }
function confirmDialog(message, onYes, { title='Confirm', danger=false } = {}){
  modal({
    title,
    body: `<p style="margin:0;color:var(--text)">${message}</p>`,
    actions: [
      { label:'Cancel', cls:'btn-outline', onClick: closeModal },
      { label: danger?'Delete':'Confirm', cls: danger?'btn-danger':'btn-primary', onClick: ()=>{ closeModal(); onYes(); } }
    ]
  });
}

/* ----- Action menu (fixed positioning) ----- */
function showActMenu(ev, items){
  const root = $('actmenu-root');
  root.innerHTML = `<div class="act-menu show" id="act-menu">
    ${items.map((it,i) => it === 'sep'
      ? `<div class="sep"></div>`
      : `<button class="${it.danger?'danger':''}" data-i="${i}">${it.label}</button>`).join('')}
  </div>`;
  const m = $('act-menu');
  const r = ev.currentTarget.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 4, window.innerHeight - m.offsetHeight - 10) + 'px';
  m.style.left = Math.min(r.left, window.innerWidth - m.offsetWidth - 10) + 'px';
  items.forEach((it,i) => {
    if(it==='sep') return;
    m.querySelector(`[data-i="${i}"]`).addEventListener('click', ()=>{ root.innerHTML=''; it.onClick(); });
  });
  setTimeout(() => document.addEventListener('click', closeActMenu, { once:true }), 0);
}

let _dashFilter = 'today';
let _dashCustomStart = '', _dashCustomEnd = '';
let _arrearsFilter = 'all'; // date range filter for arrears page and dashboard
let _arrearsCustomStart = '', _arrearsCustomEnd = '';
let _loanDateFilter = 'all';
let _loanCustomStart = '', _loanCustomEnd = '';
let _mpSavingsFilter = 'all';
let _mpSavingsCustomStart = '', _mpSavingsCustomEnd = '';

function dashDateRange(){
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const today = iso(now);
  if(_dashFilter==='today') return { start: today, end: today };
  if(_dashFilter==='yesterday'){
    const y = new Date(now); y.setDate(y.getDate()-1); const yd = iso(y);
    return { start: yd, end: yd };
  }
  if(_dashFilter==='week'){
    const d = new Date(now); d.setDate(d.getDate()-6);
    return { start: iso(d), end: today };
  }
  if(_dashFilter==='month'){
    const d = new Date(now); d.setMonth(d.getMonth()-1);
    return { start: iso(d), end: today };
  }
  if(_dashFilter==='3months'){
    const d = new Date(now); d.setMonth(d.getMonth()-3);
    return { start: iso(d), end: today };
  }
  if(_dashFilter==='custom'){
    return { start: _dashCustomStart||today, end: _dashCustomEnd||today };
  }
  return { start: today, end: today };
}

function arrearDateRange(){
  // Returns a date range for filtering loan start_dates in the arrears view.
  // 'all' means no restriction (show all active loans regardless of start date).
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const today = iso(now);
  if(_arrearsFilter === 'all') return { start: '2000-01-01', end: '2999-12-31' };
  if(_arrearsFilter === 'week'){
    const d = new Date(now); d.setDate(d.getDate()-6);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === 'month'){
    const d = new Date(now); d.setMonth(d.getMonth()-1);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === '3months'){
    const d = new Date(now); d.setMonth(d.getMonth()-3);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === '6months'){
    const d = new Date(now); d.setMonth(d.getMonth()-6);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === 'custom'){
    return { start: _arrearsCustomStart||today, end: _arrearsCustomEnd||today };
  }
  return { start: '2000-01-01', end: '2999-12-31' };
}

function pageDashboard(){
  const r = state.staff?.app_role || state.staff?.role || 'officer';
  const isAdmin = state.staff.role === 'admin';
  const showAdminDash = r === 'ceo' || r === 'admin' || r === 'branch_manager';
  const showInventoryDash = r === 'inventory_officer' || r === 'storekeeper';
  if(showInventoryDash){ pageInventoryDashboard(); return; }
  if(!showAdminDash){ pageOfficerDashboard(); return; }

  const { start, end } = dashDateRange();
  // Robust inRange: compare date strings directly (YYYY-MM-DD), with a fallback
  // that also matches records whose created_at timestamp falls in the range (handles
  // timezone edge-cases where meeting_date may be off by one day).
  const inRange = date => {
    if(!date) return false;
    const d = date.slice(0,10); // normalise to YYYY-MM-DD
    if(d >= start && d <= end) return true;
    return false;
  };
  const inRangeFallback = (dateStr, createdAt) => {
    if(inRange(dateStr)) return true;
    if(!createdAt) return false;
    const cd = new Date(createdAt).toISOString().slice(0,10);
    return cd >= start && cd <= end;
  };

  const savings = state.data.savings.filter(s => inRangeFallback(s.meeting_date||'', s.created_at) && s.status !== 'pending');
  const repayments = state.data.repayments.filter(r => inRangeFallback(r.meeting_date||'', r.created_at) && r.status !== 'pending' && isClientRepayment(r));
  const totalSavings = savings.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalRepay = repayments.reduce((a,b)=>a+Number(b.amount||0),0);
  const activeLoans = state.data.loans.filter(l=>l.status==='active');
  const outstandingBal = activeLoans.reduce((a,l)=>a+(Number(l.total_payable||0)-loanPaid(l.id)),0);
  const interestEarned = repayments.reduce((a,r)=>a+Number(r.interest||0),0);
  const eligibleCount = state.data.members.filter(m=>memberEligible(m.id)).length;
  const invValue = state.data.inventory.reduce((a,i)=>a+Number(i.loan_price||0)*Number(i.stock||0),0);

  // Officer performance — active loan officers only
  const officers = state.data.staff.filter(s => ( s.role==='officer' || s.role==='loan_officer') && s.status==='active');
  const todayISO_ = todayISO();
  const officerPerf = officers.map(o => {
    const oSav = state.data.savings.filter(s=>s.recorded_by===o.id && inRangeFallback(s.meeting_date||'', s.created_at) && s.status !== 'pending').reduce((a,b)=>a+Number(b.amount||0),0);
    const oRep = state.data.repayments.filter(r=>r.recorded_by===o.id && inRangeFallback(r.meeting_date||'', r.created_at) && r.status !== 'pending' && isClientRepayment(r)).reduce((a,b)=>a+Number(b.amount||0),0);
    const oLoans = state.data.loans.filter(l=>l.officer_id===o.id && l.status==='active').reduce((a,b)=>a+Number(b.loan_value||0),0);
    const oOrdersToday = state.data.orders.filter(o2=>o2.recorded_by===o.id && (o2.ordered_on||'').slice(0,10)===todayISO_).length;
    const oLoanValuePeriod = state.data.loans.filter(l=>l.officer_id===o.id && l.status==='active' && inRangeFallback(l.start_date, l.created_at)).reduce((a,b)=>a+Number(b.loan_value||0),0);
    return { name: o.full_name, savings: oSav, repayments: oRep, loans: oLoans, ordersToday: oOrdersToday, loanValuePeriod: oLoanValuePeriod };
  }).sort((a,b)=>b.savings-a.savings);

  const filterBtns = [
    ['today','Today'],['yesterday','Yesterday'],['week','This week'],['month','Last month'],['3months','Last 3 months'],['custom','Custom']
  ];

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Operational overview</h1><div class="desc">Real-time portfolio status.</div></div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center">
      ${filterBtns.map(([k,l])=>`<button class="btn btn-sm ${_dashFilter===k?'btn-primary':'btn-outline'}" onclick="_dashFilter='${k}';pageDashboard()">${l}</button>`).join('')}
      ${_dashFilter==='custom'?`<input type="date" value="${_dashCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="_dashCustomStart=this.value;pageDashboard()" />
      <span class="muted" style="font-size:12px">to</span>
      <input type="date" value="${_dashCustomEnd}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="_dashCustomEnd=this.value;pageDashboard()" />`:''}
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <div class="kpi k-primary"><div class="l">Savings collected</div><div class="v">${KES(totalSavings)}</div><div class="d">${savings.length} entries</div></div>
      <div class="kpi"><div class="l">Active loans outstanding</div><div class="v">${KES(outstandingBal)}</div><div class="d">${activeLoans.length} active loans</div></div>
      <div class="kpi k-success"><div class="l">Repayments received</div><div class="v">${KES(totalRepay)}</div><div class="d">Interest ${KES(interestEarned)}</div></div>
      <div class="kpi k-warn"><div class="l">Members</div><div class="v">${state.data.members.length}</div><div class="d">${eligibleCount} loan-eligible</div></div>
      <div class="kpi"><div class="l">Inventory value</div><div class="v">${KES(invValue)}</div><div class="d">${state.data.inventory.length} assets</div></div>
      <div class="kpi k-primary"><div class="l">Groups</div><div class="v">${state.data.groups.length}</div><div class="d">${state.data.groups.filter(g=>g.status==='active').length} active</div></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;margin-top:4px">
      <div class="card" style="min-width:0">
        <div class="card-head"><h3>Recent savings</h3><div class="sub">${savings.length} entries</div></div>
        <div style="overflow-x:auto">
          <table class="tbl">
            <thead><tr><th>Date</th><th>Member</th><th>Group</th><th class="num">Amount</th></tr></thead>
            <tbody>
              ${savings.slice(0,8).map(s => {
                const m = state.data.members.find(x=>x.id===s.member_id);
                const g = state.data.groups.find(x=>x.id===s.group_id);
                return `<tr><td style="white-space:nowrap">${fmtDate(s.meeting_date)}</td><td>${m?.full_name||'—'}</td><td>${g?.name||'—'}</td><td class="num">${KES(s.amount)}</td></tr>`;
              }).join('') || `<tr><td colspan="4"><div class="empty" style="padding:20px 0"><h4>No savings in period</h4></div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card" style="min-width:0">
        <div class="card-head" style="flex-wrap:wrap;gap:8px">
          <h3>Due & In Arrears</h3>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <div class="sub" id="dash-arr-sub"></div>
            <select id="dash-arr-range" style="font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="dashArrFilter()">
              <option value="all">All Time</option>
              <option value="week">Last 7 Days</option>
              <option value="month">Last Month</option>
              <option value="3months">Last 3 Months</option>
              <option value="6months">Last 6 Months</option>
            </select>
            <select id="dash-arr-officer" style="font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="dashArrFilter()">
              <option value="">All Officers</option>
              ${officers.map(o=>`<option value="${o.id}">${o.full_name}</option>`).join('')}

            <tbody id="dash-arr-body"></tbody>

    ${officerPerf.length ? `
    <div class="card" style="margin-top:16px">
      <div class="card-head"><h3>Loan officer performance</h3><div class="sub">Savings &amp; repayments filtered by: <b>${filterBtns.find(([k])=>k===_dashFilter)?.[1]||''}</b> &nbsp;·&nbsp; Active loans &amp; disbursed today are always current</div></div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>Officer</th><th class="num">Savings collected</th><th class="num">Repayments</th><th class="num">Active loans (Value)</th><th class="num">Orders today</th><th class="num">Loan Value (Period)</th></tr></thead>
          <tbody>
            ${officerPerf.map(o=>`<tr>
              <td><b>${o.name}</b></td>
              <td class="num">${KES(o.savings)}</td>
              <td class="num">${KES(o.repayments)}</td>

              <td class="num" style="color:${o.ordersToday>0?'var(--primary)':'inherit'}">${o.ordersToday>0?o.ordersToday:'—'}</td>
              <td class="num" style="color:${o.loanValuePeriod>0?'var(--primary)':'inherit'}">${o.loanValuePeriod>0?KES(o.loanValuePeriod):'—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}\n  `;

  // Populate the Due & Arrears mini-table after innerHTML is set

}

function dashArrFilter(){
  const offSel   = document.getElementById('dash-arr-officer');
  const rangeSel = document.getElementById('dash-arr-range');
  const body     = document.getElementById('dash-arr-body');
  const sub      = document.getElementById('dash-arr-sub');
  if(!body) return;

  const offVal   = offSel   ? offSel.value   : '';
  const rangeVal = rangeSel ? rangeSel.value : 'all';
  const today     = todayISO();
  const msPerWeek = 7 * 24 * 3600 * 1000;
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  let drStart = '2000-01-01', drEnd = '2999-12-31';
  if(rangeVal === 'week')    { const d=new Date(now); d.setDate(d.getDate()-6); drStart=iso(d); drEnd=today; }
  if(rangeVal === 'month')   { const d=new Date(now); d.setMonth(d.getMonth()-1); drStart=iso(d); drEnd=today; }
  if(rangeVal === '3months') { const d=new Date(now); d.setMonth(d.getMonth()-3); drStart=iso(d); drEnd=today; }
  if(rangeVal === '6months') { const d=new Date(now); d.setMonth(d.getMonth()-6); drStart=iso(d); drEnd=today; }
  const nextWeekISO = new Date(new Date(today).getTime() + 7*24*3600*1000).toISOString().slice(0,10);

  const activeLoans = state.data.loans.filter(l => l.status === 'active' && l.start_date >= drStart && l.start_date <= drEnd);
  const rows = activeLoans.map(l => {
    const paid      = loanPaid(l.id);
    const startDate = new Date(l.start_date);
    const weeksElapsed = Math.max(0, Math.floor((new Date(today) - startDate) / msPerWeek));
    const weekly    = Number(l.weekly_installment) || 0;
    const expectedPaid = Math.min(weeksElapsed * weekly, Number(l.total_payable) || 0);
    // KES 5 tolerance prevents phantom arrears from rounding — e.g. weekly=310.75
    // means after 1 week client owes 310.75 but may have paid 310 or 311.
    // Any shortfall under KES 5 is treated as on-track.
    const ARREARS_TOLERANCE = 5;
    const arrears   = Math.max(0, expectedPaid - paid - ARREARS_TOLERANCE);

    let nextDueDate = null;
    for (let w = 1; w <= 1040; w++) {
      const d = new Date(startDate); d.setDate(d.getDate() + 7 * w);
      const ds = d.toISOString().slice(0,10);
      // >= today so a payment due TODAY is captured, not skipped to next week
      if (ds >= today) { nextDueDate = ds; break; }
    }

    let category = 'ontrack';
    // Due Today takes priority so officers can act BEFORE it becomes arrears —
    // even if there's a small earlier arrears balance, today's due payment
    // still needs to be flagged separately for proactive collection.
    if (nextDueDate === today) category = 'duetoday';
    else if (arrears > 0) category = 'arrears';
    else if (nextDueDate && nextDueDate <= nextWeekISO) category = 'duethisweek';

    return { l, arrears, nextDueDate, category };
  }).filter(r => r.category !== 'ontrack');

  const filtered = offVal ? rows.filter(r => r.l.officer_id === offVal) : rows;
  const catOrder = { arrears:0, duetoday:1, duethisweek:2 };
  const display  = filtered.slice().sort((a,b)=>(catOrder[a.category]||3)-(catOrder[b.category]||3)).slice(0,10);

  if(sub) sub.textContent = filtered.length + ' loan' + (filtered.length!==1?'s':'') + ' need attention';

  if(!display.length){
    body.innerHTML = '<tr><td colspan="6"><div class="empty" style="padding:16px 0"><h4>All loans on track \u2713</h4></div></td></tr>';
    return;
  }
  body.innerHTML = display.map(function(row){
    const l = row.l, arrears = row.arrears, nextDueDate = row.nextDueDate, category = row.category;
    const mem = state.data.members.find(function(x){ return x.id===l.member_id; });
    const off = state.data.staff.find(function(x){ return x.id===l.officer_id; });
    const badgeCls = category==='arrears'?'b-red':category==='duetoday'?'b-yellow':'b-green';
    const badgeTxt = category==='arrears'?'In Arrears':category==='duetoday'?'Due Today':'Due Soon';
    return '<tr>'
      + '<td><b>' + (mem ? mem.full_name : '\u2014') + '</b></td>'
      + '<td>' + l.asset_name + '</td>'
      + '<td style="font-size:12px;color:var(--text-muted)">' + (off ? off.full_name : '\u2014') + '</td>'
      + '<td class="num"><b style="color:' + (arrears>0?'var(--danger)':'inherit') + '">' + KES(arrears) + '</b></td>'
      + '<td>' + fmtDate(nextDueDate) + '</td>'
      + '<td><span class="badge ' + badgeCls + '">' + badgeTxt + '</span></td>'
      + '</tr>';
  }).join('');
}

function pageOfficerDashboard(){
  const me = state.staff;
  const myGroups = state.data.groups.filter(g=>g.officer_id===me.id);
  const myMembers = state.data.members.filter(m=>myGroups.some(g=>g.id===m.group_id));
  const { start, end } = dashDateRange();
  const inRangeOff = (dateStr, createdAt) => {
    if(!dateStr && !createdAt) return false;
    const d = (dateStr||'').slice(0,10);
    if(d >= start && d <= end) return true;
    if(createdAt){ const cd = new Date(createdAt).toISOString().slice(0,10); if(cd >= start && cd <= end) return true; }
    return false;
  };
  const mySavings = state.data.savings.filter(s=>s.recorded_by===me.id && inRangeOff(s.meeting_date, s.created_at) && s.status !== 'pending');
  const myRepay = state.data.repayments.filter(r=>r.recorded_by===me.id && inRangeOff(r.meeting_date, r.created_at) && r.status !== 'pending' && isClientRepayment(r));
  const myGroupIds = new Set(myGroups.map(g=>g.id));
  const myLoans = state.data.loans.filter(l=>l.status==='active' && (l.officer_id===me.id || myGroupIds.has(l.group_id)));
  const totalSv = mySavings.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalRp = myRepay.reduce((a,b)=>a+Number(b.amount||0),0);
  const myOutstandingBal = myLoans.reduce((a,l)=>a+(Number(l.total_payable||0)-loanPaid(l.id)),0);
  const myInterestEarned = myRepay.reduce((a,r)=>a+Number(r.interest||0),0);
  // Pending (awaiting admin approval) — all-time for this officer, not range-filtered
  const myPendingSavings = state.data.savings.filter(s=>s.recorded_by===me.id && s.status==='pending');
  const myPendingRepayments = state.data.repayments.filter(r=>r.recorded_by===me.id && r.status==='pending');
  const myPendingSavingsTotal = myPendingSavings.reduce((a,b)=>a+Number(b.amount||0),0);
  const myPendingRepaymentsTotal = myPendingRepayments.reduce((a,b)=>a+Number(b.amount||0),0);
  const todayStr = todayISO();
  const myLoansIssuedToday = state.data.loans.filter(l=>l.status==='active' && l.officer_id===me.id && (l.start_date||'').slice(0,10)===todayStr).reduce((a,b)=>a+Number(b.loan_value||0),0);

  const filterBtns = [
    ['today','Today'],['yesterday','Yesterday'],['week','This week'],['month','Last month'],['3months','Last 3 months'],['custom','Custom']
  ];
  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>My dashboard</h1><div class="desc">Your personal performance summary, ${me.full_name}.</div></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
      ${filterBtns.map(([k,l])=>`<button class="btn btn-sm ${_dashFilter===k?'btn-primary':'btn-outline'}" onclick="_dashFilter='${k}';pageDashboard()">${l}</button>`).join('')}
      ${_dashFilter==='custom'?`<input type="date" value="${_dashCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="_dashCustomStart=this.value;pageDashboard()" />
      <span class="muted" style="font-size:12px">to</span>
      <input type="date" value="${_dashCustomEnd}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="_dashCustomEnd=this.value;pageDashboard()" />`:''}
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <div class="kpi k-primary"><div class="l">My groups</div><div class="v">${myGroups.length}</div></div>
      <div class="kpi k-success"><div class="l">Savings recorded</div><div class="v">${KES(totalSv)}</div><div class="d">${mySavings.length} approved entries</div></div>
      <div class="kpi"><div class="l">Repayments recorded</div><div class="v">${KES(totalRp)}</div><div class="d">Interest ${KES(myInterestEarned)}</div></div>
      <div class="kpi k-warn"><div class="l">Active loans I manage</div><div class="v">${myLoans.length}</div></div>
      <div class="kpi k-danger"><div class="l">Outstanding balance</div><div class="v">${KES(myOutstandingBal)}</div><div class="d">across my active loans</div></div>
      <div class="kpi k-primary"><div class="l">Loans Issued Today</div><div class="v">${KES(myLoansIssuedToday)}</div><div class="d">active loans started today</div></div>
      ${(myPendingSavings.length + myPendingRepayments.length) > 0 ? `
      <div class="kpi" style="border-top:3px solid var(--warning);background:var(--warning-50)">
        <div class="l" style="color:var(--warning)">Pending Admin Approval</div>
        <div class="v" style="font-size:18px">${myPendingSavings.length + myPendingRepayments.length} <span style="font-size:13px;font-weight:500;color:var(--text-muted)">entries</span></div>
        <div class="d">${myPendingSavings.length > 0 ? `Savings: ${KES(myPendingSavingsTotal)} (${myPendingSavings.length})` : ''}${myPendingSavings.length > 0 && myPendingRepayments.length > 0 ? ' · ' : ''}${myPendingRepayments.length > 0 ? `Repayments: ${KES(myPendingRepaymentsTotal)} (${myPendingRepayments.length})` : ''}</div>
      </div>` : ''}
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-head"><h3>My groups</h3><div class="sub">Savings &amp; repayments today = ${todayStr}</div></div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr>
          <th>Group</th><th class="num">Members</th><th class="num">Total savings</th>
          <th class="num">Savings today</th><th class="num">Repayments today</th>
          <th>Meeting day</th>
        </tr></thead>
        <tbody>
          ${myGroups.map(g=>{
            const mc = state.data.members.filter(m=>m.group_id===g.id).length;
            const savToday = state.data.savings
              .filter(s=>s.group_id===g.id && s.status!=='pending' && (s.meeting_date||'').slice(0,10)===todayStr)
              .reduce((a,b)=>a+Number(b.amount||0),0);
            const repToday = state.data.repayments
              .filter(r=>r.group_id===g.id && r.status!=='pending' && (r.meeting_date||'').slice(0,10)===todayStr)
              .reduce((a,b)=>a+Number(b.amount||0),0);
            return `<tr>
              <td><b>${g.name}</b></td>
              <td class="num">${mc}</td>
              <td class="num">${KES(groupSavingsTotal(g.id))}</td>
              <td class="num" style="color:${savToday>0?'var(--success)':'var(--text-muted)'}"><b>${savToday>0?KES(savToday):'—'}</b></td>
              <td class="num" style="color:${repToday>0?'var(--primary)':'var(--text-muted)'}"><b>${repToday>0?KES(repToday):'—'}</b></td>
              <td>${g.meeting_day||'—'}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="6"><div class="empty" style="padding:20px 0"><h4>No groups assigned</h4></div></td></tr>`}
        </tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-head"><h3>My Active Loans</h3><div class="sub">${myLoans.length} active loans</div></div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Member</th><th>Asset</th><th class="num">Loan Value</th><th class="num">Outstanding Balance</th></tr></thead>
        <tbody>
          ${myLoans.map(l=>{
            const mem = state.data.members.find(x=>x.id===l.member_id);
            const outstanding = Math.max(0, Number(l.total_payable||0) - loanPaid(l.id));
            const isDup = false;
            return `<tr>
              <td><b>${mem?.full_name||'—'}</b>${isDup?` <span class="badge b-yellow">Duplicate</span>`:''}<div class="muted" style="font-size:11px">${mem?.national_id||''}</div></td>
              <td>${l.asset_name}</td>
              <td class="num">${KES(l.loan_value)}</td>
              <td class="num" style="color:var(--danger);font-weight:700">${KES(outstanding)}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="4"><div class="empty" style="padding:20px 0"><h4>No active loans</h4></div></td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
}

function pageGroups(){
  const isAdmin = state.staff.role === 'admin';
  // Officers only see their own groups
  let groups = isAdmin ? state.data.groups : state.data.groups.filter(g=>g.officer_id===state.staff.id);

  // Apply search filter
  const q = (state._groupSearch||'').toLowerCase();
  // Sort groups by meeting day (Monday → Sunday)
  const dayWeight = {Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6,Sunday:7};
  if(q) groups = groups.filter(g =>
    (g.name||'').toLowerCase().includes(q) ||
    (g.chairman_name||'').toLowerCase().includes(q) ||
    String(g.group_number||'').includes(q)
  );
  groups = groups.slice().sort((a,b)=>(dayWeight[a.meeting_day]||8)-(dayWeight[b.meeting_day]||8));

  const PAGE_SIZE = 10;
  const _gPage = state._groupsPage || 0;
  const total = groups.length;
  const paged = groups.slice(_gPage * PAGE_SIZE, (_gPage+1)*PAGE_SIZE);

  $('page').innerHTML = `
    <div class="page-head">
      <div>
        <h1>Groups</h1>
        <div class="desc">${isAdmin ? 'All chama groups.' : 'Groups assigned to you.'}</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="openGroupForm()">Register group</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-box grow">
        <span class="ic">${ic('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>')}</span>
        <input id="grp-search" placeholder="Search by name, chairperson or group number" value="${state._groupSearch||''}"/>
      </div>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>#</th><th>Name</th><th>Meeting day</th><th>Chairperson</th>
          <th>Treasurer</th><th>Officer</th><th class="num">Members</th><th class="num">Savings</th>
          <th>Status</th><th></th>
        </tr></thead>
        <tbody>
          ${paged.map(g => {
            const mc = state.data.members.filter(m=>m.group_id===g.id).length;
            const off = state.data.staff.find(s=>s.id===g.officer_id);
            return `<tr>
              <td>${g.group_number}</td>
              <td><b>${g.name}</b></td>
              <td>${g.meeting_day||'—'} ${g.meeting_time?'· '+g.meeting_time:''}</td>
              <td>${g.chairman_name||'—'}<div class="muted" style="font-size:11px">${g.chairman_phone||''}</div></td>
              <td>${g.treasurer_name||'—'}<div class="muted" style="font-size:11px">${g.treasurer_phone||''}</div></td>
              <td>${off?.full_name||'—'}</td>
              <td class="num">${mc}</td>
              <td class="num">${KES(groupSavingsTotal(g.id))}</td>
              <td><span class="badge ${g.status==='active'?'b-green':(g.status==='pending'?'b-yellow':'b-grey')}">${g.status}</span></td>
              <td><button class="act-btn" onclick="groupActions(event,'${g.id}')">···</button></td>
            </tr>`;
          }).join('') || `<tr><td colspan="9"><div class="empty"><h4>No groups found</h4><p>${q ? 'No groups match your search.' : 'Create your first chama group to start onboarding members.'}</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
    ${total > PAGE_SIZE ? `<div style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--text-muted)">
      <button class="btn btn-sm btn-outline" ${_gPage===0?'disabled':''} onclick="state._groupsPage=${_gPage-1};pageGroups()">← Prev</button>
      <span>Page ${_gPage+1} of ${Math.ceil(total/PAGE_SIZE)} &nbsp;(${total} groups)</span>
      <button class="btn btn-sm btn-outline" ${(_gPage+1)*PAGE_SIZE>=total?'disabled':''} onclick="state._groupsPage=${_gPage+1};pageGroups()">Next →</button>
    </div>` : ''}
  `;
  $('grp-search').addEventListener('input', e => {
    state._groupSearch = e.target.value;
    state._groupsPage = 0;
    pageGroups();
    setTimeout(()=>{ const el=$('grp-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },0);
  });
}
function groupActions(ev, id){
  const g = state.data.groups.find(x=>x.id===id);
  const isAdmin = state.staff.role === 'admin';
  const items = [
    { label:'View members', onClick: ()=>{ state.viewCtx = { groupId: id }; go('members'); } },
    { label:'Edit group', onClick: ()=>openGroupForm(g) },
  ];
  if(isAdmin && g.status==='pending'){
    items.push('sep');
    items.push({ label:'✓ Approve group', onClick: ()=>approveGroup(id) });
    items.push({ label:'✗ Reject group', danger:true, onClick: ()=>rejectGroup(id) });
  }
  items.push('sep');
  items.push({ label:'Delete group', danger:true, onClick: ()=>confirmDialog(`Delete group "${g.name}"? Members and history will be retained but the group record will be removed.`, async()=>{
    const { error } = await sb.from('pb_groups').delete().eq('id', id);
    if(error) toast(error.message,'error'); else { state.data.groups = state.data.groups.filter(x=>x.id!==id); audit('delete','pb_groups',id,g); render(); toast('Group deleted','success'); }
  }, { title:'Delete group', danger:true }) });
  showActMenu(ev, items);
}
async function approveGroup(id, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Approving…'; }
  const g = state.data.groups.find(x=>x.id===id);
  if(g && g.status === 'active'){
    if(btn){ btn.disabled = false; btn.textContent = 'Approve'; }
    return toast('This group is already active.','warn');
  }
  if(!(await ensureFreshToken())) return;
  const { error } = await sb.from('pb_groups').update({status:'active'}).eq('id',id);
  if(error){
    if(btn){ btn.disabled = false; btn.textContent = 'Approve'; }
    return toast(error.message,'error');
  }
  if(g) g.status = 'active';
  audit('approve','pb_groups',id);
  render(); toast('Group approved & activated','success');
}
async function rejectGroup(id){
  confirmDialog('Reject this pending group? It will be marked inactive.', async()=>{
    if(!(await ensureFreshToken())) return;
    const { error } = await sb.from('pb_groups').update({status:'inactive'}).eq('id',id);
    if(error) return toast(error.message,'error');
    const g = state.data.groups.find(x=>x.id===id); if(g) g.status='inactive';
    audit('reject','pb_groups',id);
    render(); toast('Group rejected','warn');
  },{ title:'Reject group', danger:true });
}

    }, { title:'Deactivate member', danger:true }) }] : [])
  ]);
