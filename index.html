function toggleMemberDuplicatesOnly(){
  state._memberDuplicatesOnly = !state._memberDuplicatesOnly;
  state._membersPage = 0;
  pageMembers();
}
async function deleteDuplicateMemberRecords(ids){
  if(!ids.length) return { ok:true, count:0 };
  if(!(await ensureFreshToken())) return { ok:false, message:'Session expired. Please sign in again.' };

  const safeIds = ids.filter(id => {
    const member = state.data.members.find(m=>m.id===id);
    return member && isSafeEmptyDuplicateMember(member);
  });
  if(safeIds.length !== ids.length){
    return { ok:false, message:'Some selected records are no longer safe to remove. Refresh and try again.' };
  }

  const oldMembers = state.data.members.filter(m=>safeIds.includes(m.id));
  const linkedGuarantors = state.data.guarantors.filter(g=>safeIds.includes(g.member_id));
  if(linkedGuarantors.length){
    const { error: guarantorError } = await sb.from('pb_guarantors').delete().in('member_id', safeIds);
    if(guarantorError) return { ok:false, message:guarantorError.message };
  }

  const { error } = await sb.from('pb_members').delete().in('id', safeIds);
  if(error) return { ok:false, message:error.message };

  state.data.guarantors = state.data.guarantors.filter(g=>!safeIds.includes(g.member_id));
  state.data.members = state.data.members.filter(m=>!safeIds.includes(m.id));
  oldMembers.forEach(m => audit('delete_empty_duplicate_member','pb_members',m.id,m,null));
  return { ok:true, count:safeIds.length };
}
async function deleteEmptyDuplicateMember(id){
  const member = state.data.members.find(m=>m.id===id);
  if(!member) return;
  if(!canManageMemberDuplicates()) return toast('You do not have permission to remove duplicate clients.','error');
  if(!isSafeEmptyDuplicateMember(member)){
    return toast('This client cannot be removed automatically because it has savings, a loan, repayments, or is not an inactive duplicate.','error');
  }
  confirmDialog(`Delete the empty duplicate record for "${member.full_name}"? This only removes the inactive duplicate and its next-of-kin records. The real client account with savings or loans is kept.`, async()=>{
    const result = await deleteDuplicateMemberRecords([id]);
    if(!result.ok) return toast(result.message || 'Could not remove duplicate client.','error');
    render();
    toast('Empty duplicate client removed.','success');
  }, { title:'Delete empty duplicate', danger:true });
}
async function removeEmptyDuplicateMembers(){
  if(!canManageMemberDuplicates()) return toast('You do not have permission to remove duplicate clients.','error');
  const ids = state.data.members.filter(isSafeEmptyDuplicateMember).map(m=>m.id);
  if(!ids.length) return toast('No empty inactive duplicates found.','warn');
  confirmDialog(`Remove ${ids.length} empty inactive duplicate client record${ids.length===1?'':'s'}? This will not remove any client with savings, repayments, loans, or order history.`, async()=>{
    const result = await deleteDuplicateMemberRecords(ids);
    if(!result.ok) return toast(result.message || 'Could not remove duplicate clients.','error');
    render();
    toast(`${result.count} empty duplicate client record${result.count===1?'':'s'} removed.`, 'success');
  }, { title:'Remove empty duplicates', danger:true });
}

  const d = state._wizardData;
  const s = state._wizardStep;
  if(s===1) return `

  if(s===2){
    const g = state.data.groups.find(x=>x.id===d.group_id);
    return `
      <div class="grid-2">
        <div class="field"><label>Select group *</label>
          <select id="w-group_id" required>
            <option value="">— Select —</option>
            ${state.data.groups.filter(x=>x.status==='active').map(x=>`<option value="${x.id}" ${d.group_id===x.id?'selected':''}>${x.name}</option>`).join('')}
          </select>

function saveWizardStep(){
  const d = state._wizardData;
  const s = state._wizardStep;
  if(s===1){
    ['full_name','national_id','date_of_birth','gender','phone','email','address','nearest_town','occupation','employer','income_estimate'].forEach(k => {
      const el = document.getElementById('w-'+k); if(el) d[k] = el.value;
    });
    d.phone = normalisePhone(d.phone);
    if(!d.full_name || !d.national_id || !d.phone){ toast('Full name, National ID and phone are required.','error'); return false; }

    // Only check against active/pending members — inactive members (from deleted or
    // inactive groups) should not block a fresh registration in a new group.
    const activeMembers = state.data.members.filter(m => m.status !== 'inactive');

    // ── Duplicate: same National ID (active/pending members only) ────────
    const dupById = activeMembers.find(m => m.national_id && m.national_id.trim() === d.national_id.trim());
    if(dupById){
      const dupGroup = state.data.groups.find(g => g.id === dupById.group_id);
      toast(`A client with National ID ${d.national_id} is already registered as "${dupById.full_name}"${dupGroup?' in group '+dupGroup.name:''}. Cannot register twice.`, 'error');
      return false;
    }
    // ── Duplicate: same phone number (active/pending members only) ────────
    const normPhone = normalisePhone(d.phone);
    const dupByPhone = activeMembers.find(m => normalisePhone(m.phone||'') === normPhone && normPhone.length >= 9);
    if(dupByPhone){
      const dupGroup = state.data.groups.find(g => g.id === dupByPhone.group_id);
      toast(`Phone number ${d.phone} is already registered to "${dupByPhone.full_name}"${dupGroup?' in group '+dupGroup.name:''}. Each active client must have a unique phone number.`, 'error');
      return false;
    }
    // ── Duplicate: same full name (warn only — names can be legitimately shared) ──
    const nameLower = d.full_name.trim().toLowerCase();
    const dupByName = activeMembers.find(m => m.full_name.trim().toLowerCase() === nameLower);
    if(dupByName){
      toast(`⚠ Warning: An active client named "${dupByName.full_name}" already exists (ID: ${dupByName.national_id||'—'}). Please verify this is a different person before continuing.`, 'warn');
    }
  }
  if(s===2){
    d.group_id = $('w-group_id').value;
    d.registration_fee = parseFloat($('w-registration_fee').value)||0;
    d.registered_on = $('w-registered_on').value;
    d.officer_id = $('w-officer_id').value;
    if(!d.group_id){ toast('Please select a group.','error'); return false; }
  }
  if(s===3){
    document.querySelectorAll('[data-g]').forEach(el => {
      d.guarantors[parseInt(el.dataset.g)][el.dataset.f] = el.value;
    });
    const g1 = d.guarantors[0];
    if(!g1.full_name || !g1.national_id || !g1.phone){ toast('At least one complete next of kin entry is required.','error'); return false; }
  }
  return true;
}
function addGuarantor(){ saveWizardStep(); state._wizardData.guarantors.push({ full_name:'', national_id:'', phone:'', location:'', relationship:'Friend' }); renderWizard(); }
function removeGuarantor(i){ saveWizardStep(); state._wizardData.guarantors.splice(i,1); renderWizard(); }

async function submitWizard(){
  if(!(await ensureFreshToken())) return;
  const d = state._wizardData;
  const g = state.data.groups.find(x=>x.id===d.group_id);
  const officer_id = d.officer_id || g?.officer_id || null;

  // Only CEO, admin, and branch_manager can auto-approve a new client.
  // Loan officers and all other roles submit as 'pending' — awaits BM/admin approval.
  const canAutoApprove = can('approve_group'); // reuses the same gate as group approval
  const memberStatus = canAutoApprove ? 'active' : 'pending';

  const memberRow = {
    business_id: state.staff.business_id || null,
    group_id: d.group_id, full_name: d.full_name, national_id: d.national_id,
    date_of_birth: d.date_of_birth || null, gender: d.gender, phone: d.phone, email: d.email || null,
    address: d.address || null, nearest_town: d.nearest_town || null, occupation: d.occupation || null,
    employer: d.employer || null, income_estimate: d.income_estimate ? Number(d.income_estimate) : null,
    registration_fee: Number(d.registration_fee)||0, registered_on: d.registered_on, officer_id,
    status: memberStatus
  };

  const { data: created, error } = await sb.from('pb_members').insert(memberRow).select().single();
  if(error) return toast(error.message, 'error');

  const guars = d.guarantors.filter(x=>x.full_name && x.national_id).map((x,i) => ({
    business_id: state.staff.business_id || null,
    member_id: created.id, full_name: x.full_name, national_id: x.national_id,
    phone: normalisePhone(x.phone), location: x.location || null,
    relationship: x.relationship || null, position: i+1
  }));
  if(guars.length){
    const { error: ge } = await sb.from('pb_guarantors').insert(guars);
    if(ge) toast('Member saved, but next of kin save failed: '+ge.message, 'warn');
    else state.data.guarantors.push(...guars);
  }
  state.data.members.unshift(created);
  audit('register_member','pb_members',created.id,null,memberRow);
  closeModal();
  if(memberStatus === 'pending'){
    toast('✅ Client registered and submitted for approval. They will be activated once a Branch Manager or Administrator approves their registration in the Approvals Queue.', 'success');
  } else {
    toast('Client registered and activated successfully.', 'success');
  }
  render();
}

function mpApproveSaving(id){
  const s = state.data.savings.find(x=>x.id===id);
  if(!s) return;
  if(s.status === 'approved'){ toast('Already approved.','warn'); return; }
  if(!can('approve_savings')){ toast('You do not have permission to approve savings.','error'); return; }
  ensureFreshToken().then(ok => {
    if(!ok) return;
    sb.from('pb_savings').update({status:'approved'}).eq('id',id).then(({error})=>{
      if(error) return toast(error.message,'error');
      s.status='approved'; render(); toast('Savings entry approved.','success');
    });
  });
}

  const isAdmin = state.staff.role === 'admin';
  const myGroups = isAdmin ? state.data.groups : state.data.groups.filter(g=>g.officer_id === state.staff.id);

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Weekly meeting recorder</h1><div class="desc">Capture savings and loan repayments per member for a single meeting session.</div></div>
    </div>

    <div class="card card-pad">
      <div class="grid-2">
        <div class="field"><label>Group</label>
          <select id="m-group">
            <option value="">— Select group —</option>
            ${myGroups.map(g=>`<option value="${g.id}" ${m.groupId===g.id?'selected':''}>${g.name} · ${g.meeting_day}</option>`).join('')}
          </select>

      </div>

function renderMeetList(){
  const m = state._meet;
  const host = $('meet-list');
  if(!m.groupId){ host.innerHTML = `<div class="card card-pad empty"><h4>Select a group</h4><p>Choose a group to load its members for the meeting session.</p></div>`; return; }
  const members = state.data.members.filter(x=>x.group_id===m.groupId && x.status==='active');
  if(!members.length){ host.innerHTML = `<div class="card card-pad empty"><h4>No active members</h4><p>Register members to this group before recording a meeting.</p></div>`; return; }

  host.innerHTML = `
    <div class="card-head" style="border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--surface);border:1px solid var(--border);border-bottom:none">
      <h3>${members.length} members</h3>
      <button class="btn btn-primary" onclick="submitMeeting()">Submit meeting</button>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-top:none;padding:14px;border-radius:0 0 var(--radius-lg) var(--radius-lg)">
      ${members.map(mem => {
        const sv = memberSavings(mem.id);
        const lns = state.data.loans.filter(l => l.member_id === mem.id && l.status === 'active');
        const ent = m.entries[mem.id] = m.entries[mem.id] || { savings:'', repayments:{}, absent:false, notes:'' };

        lns.forEach(ln => {
          if(ent.repayments[ln.id] === undefined) ent.repayments[ln.id] = Number(ln.weekly_installment);
        });

        return `<div class="mc">
          <div class="top">
            <div class="av">${initials(mem.full_name)}</div>
            <div style="flex:1">
              <div class="nm">${mem.full_name}</div>
              <div class="meta">ID ${mem.national_id} · Total Savings ${KES(sv)} · ${lns.length} Active Loan${lns.length!==1?'s':''}</div>
            </div>
          </div>

          <div class="row">
            <div>
              <label>💰 Savings this week (KES)</label>
              <input type="number" min="0" data-id="${mem.id}" data-f="savings"
                value="${ent.savings}" ${ent.absent?'disabled':''}
                placeholder="0" />
            </div>
            <div>
              ${lns.length===0 ? `<div class="ro" style="margin-top:22px;color:var(--text-muted);font-size:12px">No active loan</div>` : ''}
            </div>
          </div>

          ${lns.map(ln => {
            const paid       = loanPaid(ln.id);
            const out        = Math.max(0, Number(ln.total_payable) - paid);
            const weekly     = Number(ln.weekly_installment) || 0;
            const currentAmt = ent.repayments[ln.id] !== undefined ? ent.repayments[ln.id] : weekly;
            const isExcess   = Number(currentAmt) > weekly && weekly > 0;
            return `<div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;background:${isExcess?'var(--warning-50)':'transparent'};border-radius:var(--radius-sm);padding:10px 0 0 0">
              <div class="row">
                <div>
                  <label style="color:var(--primary);font-weight:600">📋 Loan Repayment: ${ln.asset_name}</label>
                  <input type="number" min="0" data-id="${mem.id}" data-loanid="${ln.id}"
                    value="${currentAmt}" ${ent.absent?'disabled':''}
                    placeholder="${weekly}"
                    style="border-color:${isExcess?'var(--warning)':'var(--border)'}" />
                  <div style="font-size:11px;margin-top:3px;color:${isExcess?'var(--warning)':'var(--text-muted)'}">
                    Weekly installment: <b>${KES(weekly)}</b>
                    ${isExcess ? ` · ⚡ Excess payment — ${KES(Number(currentAmt)-weekly)} above weekly amount. This will reduce future weeks owed.` : ''}
                  </div>
                </div>
                <div>
                  <div class="ro" style="margin-top:22px">Outstanding<b>${KES(out)}</b></div>
                  ${paid > 0 ? `<div class="ro" style="font-size:11px;color:var(--success)">Paid so far<b>${KES(paid)}</b></div>` : ''}
                </div>
              </div>
            </div>`;
          }).join('')}

          <div class="absent-row">
            <input type="checkbox" id="abs-${mem.id}" ${ent.absent?'checked':''} data-id="${mem.id}" data-f="absent" />
            <label for="abs-${mem.id}" style="margin:0">Mark as absent (no contributions this week)</label>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  host.querySelectorAll('input').forEach(el => {
    el.addEventListener('change', () => {
      const id = el.dataset.id, f = el.dataset.f, lid = el.dataset.loanid;
      if (el.type === 'checkbox') {
        m.entries[id][f] = el.checked;
        if (f === 'absent' && el.checked) {
          m.entries[id].savings = 0;
          Object.keys(m.entries[id].repayments).forEach(k => m.entries[id].repayments[k] = 0);
          renderMeetList();
        }
      } else if (lid) {
        m.entries[id].repayments[lid] = el.value;
        renderMeetList(); // re-render to show/clear excess payment highlight
      } else {
        m.entries[id][f] = el.value;
      }
    });
    el.addEventListener('input', () => {
      const id = el.dataset.id, f = el.dataset.f, lid = el.dataset.loanid;
      if (el.type !== 'checkbox') {
        if (lid) {
          m.entries[id].repayments[lid] = el.value;
          // Debounce re-render so typing remains smooth
          clearTimeout(el._excessTimer);
          el._excessTimer = setTimeout(() => renderMeetList(), 400);
        }
        else m.entries[id][f] = el.value;
      }
    });
  });
}
async function submitMeeting(){
  const m = state._meet;
  if(!m.groupId || !m.date) return toast('Group and date are required.', 'error');
  const members = state.data.members.filter(x=>x.group_id===m.groupId && x.status==='active');

  let meetingId = null;
  const existing = state.data.meetings.find(x=>x.group_id===m.groupId && x.meeting_date===m.date);
  if(existing){ meetingId = existing.id; }
  else {
    const { data, error } = await sb.from('pb_meetings').insert({
      business_id: state.staff.business_id || null,
      group_id: m.groupId, meeting_date: m.date, recorded_by: state.staff.id
    }).select().single();
    if(error) return toast(error.message, 'error');
    meetingId = data.id; state.data.meetings.unshift(data);
  }

  const savRows = []; const repRows = [];
  for(const mem of members){
    const e = m.entries[mem.id] || {};
    if(e.absent){ continue; }
    const sav = Number(e.savings)||0;

    if(sav>0){
      // Only CEO, Administrator, and Branch Manager can auto-approve on entry;
      // Loan officers submit as 'pending' for supervisor/admin to approve.
      const savStatus = can('approve_savings') ? 'approved' : 'pending';
      savRows.push({ business_id: state.staff.business_id || null, member_id: mem.id, group_id: m.groupId, meeting_id: meetingId, meeting_date: m.date, amount: sav, recorded_by: state.staff.id, notes: e.notes||null, status: savStatus });
    }

    if (e.repayments) {
      for (const [loanId, repAmount] of Object.entries(e.repayments)) {
        const rep = Number(repAmount)||0;
        const ln = state.data.loans.find(l => l.id === loanId);
        if(rep > 0 && ln){
          const ir = Number(ln.total_payable) ? (Number(ln.total_payable)-Number(ln.loan_value))/Number(ln.total_payable) : 0;
          const interest = +(rep*ir).toFixed(2);
          const principal = +(rep-interest).toFixed(2);
          const repStatus = can('approve_repayment') ? 'approved' : 'pending';
          repRows.push({ business_id: state.staff.business_id || null, loan_id: ln.id, member_id: mem.id, group_id: m.groupId, meeting_id: meetingId, meeting_date: m.date, amount: rep, principal, interest, recorded_by: state.staff.id, status: repStatus });
        }
      }
    }
  }

  let okSav=0, okRep=0, fail=0;
  for(const r of savRows){
    const res = await queuedInsert('pb_savings', r);
    if(res.ok){ okSav++; if(!res.queued) state.data.savings.unshift({ ...r, id:'tmp_'+Math.random() }); } else fail++;
  }
  for(const r of repRows){
    const res = await queuedInsert('pb_repayments', r);
    if(res.ok){ okRep++; if(!res.queued) state.data.repayments.unshift({ ...r, id:'tmp_'+Math.random() }); } else fail++;
  }
  audit('meeting_submit', 'pb_meetings', meetingId, null, { savings: okSav, repayments: okRep });

  for(const r of repRows){
    const ln = state.data.loans.find(l=>l.id===r.loan_id);
    if(ln && (Number(ln.total_payable) - loanPaid(ln.id)) <= 0){
      await sb.from('pb_loans').update({ status:'completed' }).eq('id', ln.id);
      ln.status='completed';
    }
  }

  toast(`Meeting saved. Savings entries: ${okSav}. Repayments: ${okRep}.${fail?' Failed: '+fail:''}`, fail?'warn':'success');
  state._meet = { groupId:'', date: todayISO(), entries:{} };
  render();
}

function pageArrears(){
  const isAdmin = state.staff.role === 'admin';
  const myGroupIds = isAdmin ? [] : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);
  const { start: drStart, end: drEnd } = arrearDateRange();

  // Active loans matching visibility rules AND start_date within selected range
  const activeLoans = state.data.loans.filter(l =>
    l.status === 'active'
    && l.start_date >= drStart && l.start_date <= drEnd
    && (isAdmin || myGroupIds.includes(l.group_id) || l.officer_id === state.staff.id)
  );

  const today = todayISO();
  const msPerWeek = 7 * 24 * 3600 * 1000;
  const nextWeekISO = new Date(new Date(today).getTime() + 7*24*3600*1000).toISOString().slice(0,10);

  const report = activeLoans.map(l => {
    const mem = state.data.members.find(x => x.id === l.member_id);
    const g   = state.data.groups.find(x => x.id === l.group_id);
    const off = state.data.staff.find(x => x.id === l.officer_id);
    const paid = loanPaid(l.id);

    const startDate = new Date(l.start_date);
    const weeksElapsed = Math.max(0, Math.floor((new Date(today) - startDate) / msPerWeek));
    const weekly = Number(l.weekly_installment) || 0;
    const expectedPaid = Math.min(weeksElapsed * weekly, Number(l.total_payable) || 0);
    const arrears = Math.max(0, expectedPaid - paid - 5);

    let nextDueDate = null;
    for (let w = 1; w <= 1040; w++) {
      const d = new Date(startDate); d.setDate(d.getDate() + 7 * w);
      const ds = d.toISOString().slice(0,10);
      // >= today so a payment due TODAY is captured, not skipped to next week
      if (ds >= today) { nextDueDate = ds; break; }
    }

    let category = 'ontrack';
    // Due Today takes priority so officers can collect BEFORE it becomes arrears
    if (nextDueDate === today) category = 'duetoday';
    else if (arrears > 0) category = 'arrears';
    else if (nextDueDate && nextDueDate <= nextWeekISO) category = 'duethisweek';

    return { loan: l, member: mem, group: g, officer: off, paid, arrears, nextDueDate, expectedInstallment: weekly, category };
  });

  const tab = state._arrearsTab || 'arrears';
  const offFilter = state._arrearsOfficerFilter || '';
  let filtered = report.filter(r => tab === 'all' ? true : r.category === tab);
  if (isAdmin && offFilter) filtered = filtered.filter(r => r.loan.officer_id === offFilter);

  const officersWithLoans = isAdmin
    ? state.data.staff.filter(s => ( s.role === 'officer' || s.role === 'loan_officer') && report.some(r => r.loan.officer_id === s.id))
    : [];

  const filterBtns = [
    ['all','All Time'],['week','Last 7 Days'],['month','Last Month'],['3months','Last 3 Months'],['6months','Last 6 Months'],['custom','Custom']
  ];

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Due & Arrears</h1><div class="desc">Track missed payments and upcoming collections.</div></div>
      ${report.filter(r=>r.category==='duetoday').length > 0 ? `
      <div class="actions">
        <button class="btn btn-primary" onclick="state._arrearsTab='duetoday';pageArrears()" style="background:var(--warning);border-color:var(--warning)">
          🔔 ${report.filter(r=>r.category==='duetoday').length} Due Today — Collect Now
        </button>
      </div>` : ''}
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:12px;color:var(--text-muted);margin-right:2px">Loan start date:</span>
      ${filterBtns.map(([k,l]) => `<button class="btn btn-sm ${_arrearsFilter===k?'btn-primary':'btn-outline'}" onclick="_arrearsFilter='${k}';pageArrears()">${l}</button>`).join('')}
      ${_arrearsFilter==='custom' ? `

function exportArrearsCollectionSheet(){
  const isAdmin = state.staff.role === 'admin';
  const myGroupIds = isAdmin ? [] : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);
  const { start: drStart, end: drEnd } = arrearDateRange();

  const activeLoans = state.data.loans.filter(l =>
    l.status === 'active'
    && l.start_date >= drStart && l.start_date <= drEnd
    && (isAdmin || myGroupIds.includes(l.group_id) || l.officer_id === state.staff.id)
  );

  const today = todayISO();
  const msPerWeek = 7 * 24 * 3600 * 1000;
  const nextWeekISO = new Date(new Date(today).getTime() + 7*24*3600*1000).toISOString().slice(0,10);

  const report = activeLoans.map(l => {
    const mem = state.data.members.find(x => x.id === l.member_id);
    const g   = state.data.groups.find(x => x.id === l.group_id);
    const off = state.data.staff.find(x => x.id === l.officer_id);
    const paid = loanPaid(l.id);
    const startDate = new Date(l.start_date);
    const weeksElapsed = Math.max(0, Math.floor((new Date(today) - startDate) / msPerWeek));
    const weekly = Number(l.weekly_installment) || 0;
    const expectedPaid = Math.min(weeksElapsed * weekly, Number(l.total_payable) || 0);
    const arrears = Math.max(0, expectedPaid - paid - 5);
    let nextDueDate = null;
    for (let w = 1; w <= 1040; w++) {
      const d = new Date(startDate); d.setDate(d.getDate() + 7 * w);
      const ds = d.toISOString().slice(0,10);
      // >= today so a payment due TODAY is captured, not skipped to next week
      if (ds >= today) { nextDueDate = ds; break; }
    }
    let category = 'ontrack';
    // Due Today takes priority so officers can collect BEFORE it becomes arrears
    if (nextDueDate === today) category = 'duetoday';
    else if (arrears > 0) category = 'arrears';
    else if (nextDueDate && nextDueDate <= nextWeekISO) category = 'duethisweek';
    return { loan: l, member: mem, group: g, officer: off, paid, arrears, nextDueDate, expectedInstallment: weekly, category };
  });

  const tab = state._arrearsTab || 'arrears';
  const offFilter = state._arrearsOfficerFilter || '';
  let filtered = report.filter(r => tab === 'all' ? true : r.category === tab);
  if (isAdmin && offFilter) filtered = filtered.filter(r => r.loan.officer_id === offFilter);

  if(!filtered.length){ toast('No records in current view to export.','warn'); return; }

  const rows = filtered.map(r => ({
    'Member Name': r.member?.full_name || '—',
    'Phone': r.member?.phone || '—',
    'Group': r.group?.name || '—',
    'Asset': r.loan.asset_name || '—',
    'Start Date': r.loan.start_date || '—',
    'Expected Installment (KES)': Number(r.expectedInstallment) || 0,
    'Total Arrears (KES)': Number(r.arrears) || 0,
    'Next Due Date': r.nextDueDate || '—',
    'Officer Name': r.officer?.full_name || '—'
  }));

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Arrears Collection');
  XLSX.writeFile(wb, `arrears_collection_sheet_${todayISO()}.xlsx`);
  toast(`Exported ${rows.length} record(s) to Arrears Collection Sheet.`, 'success');
}

function pageLoans(){
  const isAdmin = state.staff.role === 'admin';
  const r = state.staff?.app_role || state.staff?.role || 'officer';
  const canSeeAll = r === 'ceo' || r === 'admin' || r === 'branch_manager' || r === 'supervisor';
  const myGroupIds = canSeeAll ? [] : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);

  // Compute loan date range
  const loanDateRange = () => {
    const now = new Date();
    const iso = d => d.toISOString().slice(0,10);
    const today = iso(now);
    if(_loanDateFilter==='all') return { start: '2000-01-01', end: '2999-12-31' };
    if(_loanDateFilter==='today') return { start: today, end: today };
    if(_loanDateFilter==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); const yd=iso(y); return { start:yd, end:yd }; }
    if(_loanDateFilter==='week'){ const d=new Date(now); d.setDate(d.getDate()-6); return { start:iso(d), end:today }; }
    if(_loanDateFilter==='month'){ const d=new Date(now); d.setMonth(d.getMonth()-1); return { start:iso(d), end:today }; }
    if(_loanDateFilter==='3months'){ const d=new Date(now); d.setMonth(d.getMonth()-3); return { start:iso(d), end:today }; }
    if(_loanDateFilter==='custom'){ return { start:_loanCustomStart||today, end:_loanCustomEnd||today }; }
    return { start:'2000-01-01', end:'2999-12-31' };
  };
  const { start: ldrStart, end: ldrEnd } = loanDateRange();

  let loans = canSeeAll
    ? state.data.loans
    : state.data.loans.filter(l => myGroupIds.includes(l.group_id) || l.officer_id === state.staff.id);

  const tab = state._loanTab || 'active';
  loans = loans.filter(l => tab==='all' ? true : l.status===tab);

  // Apply date filter on start_date
  loans = loans.filter(l => {
    const sd = (l.start_date||'').slice(0,10);
    return sd >= ldrStart && sd <= ldrEnd;
  });

  if (canSeeAll && state._loanOfficerFilter) {
    loans = loans.filter(l => l.officer_id === state._loanOfficerFilter);
  }

  const isDuplicateLoan = l => !!(l.member_id && l.order_id && state.data.loans.some(x =>
    x.id !== l.id && x.member_id === l.member_id && x.order_id === l.order_id && x.status === 'active'
  ));
  const duplicateCount = loans.filter(isDuplicateLoan).length;
  const loanSearch = (state._loanSearch||'').trim().toLowerCase();
  if(state._loanDuplicatesOnly) loans = loans.filter(isDuplicateLoan);
  if(loanSearch){
    loans = loans.filter(l => {
      const m = state.data.members.find(x=>x.id===l.member_id);
      const grp = state.data.groups.find(x=>x.id===l.group_id);
      const off = state.data.staff.find(x=>x.id===l.officer_id);
      return [
        m?.full_name, m?.national_id, m?.phone, grp?.name, off?.full_name,
        l.asset_name, l.id, l.order_id, l.status, l.start_date
      ].some(v => String(v||'').toLowerCase().includes(loanSearch));
    });
  }

  const loanFilterBtns = [
    ['all','All Time'],['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','Last Month'],['3months','Last 3 Months'],['custom','Custom']
  ];

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Loan portfolio</h1><div class="desc">Asset-backed loans across all members.</div></div>
    </div>
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
      <div class="tabs" style="margin-bottom:0; border-bottom:none;">
        ${['active','completed','defaulted','all'].map(t => `<button class="${tab===t?'active':''}" onclick="state._loanTab='${t}';pageLoans()">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${tab==='active' ? `<button class="btn btn-outline btn-sm" onclick="openCollectionSheetModal()" title="Export collection sheet as Excel">📋 Collection Sheet</button>` : ''}
        ${isAdmin ? `
        <select style="max-width:200px" onchange="state._loanOfficerFilter=this.value; pageLoans()">
          <option value="">All Officers</option>
          ${state.data.staff.filter(s=>s.role==='officer'||s.role==='loan_officer').map(o=>`<option value="${o.id}" ${state._loanOfficerFilter===o.id?'selected':''}>${o.full_name}</option>`).join('')}
        </select>
        ` : ''}
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:12px;color:var(--text-muted);margin-right:2px">Start date:</span>

      ${_loanDateFilter==='custom'?`
        <input type="date" value="${_loanCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" onchange="_loanCustomStart=this.value;pageLoans()" />
        <span class="muted" style="font-size:12px">to</span>

          <th class="num">Weekly</th><th class="num">Paid</th><th class="num">Outstanding</th>
          <th>Status</th><th></th>
        </tr></thead>
        <tbody>
          ${loans.map(l => {
            const m = state.data.members.find(x=>x.id===l.member_id);
            const grp = state.data.groups.find(x=>x.id===l.group_id);
            const off = state.data.staff.find(x=>x.id===l.officer_id);
            const paid = loanPaid(l.id);
            const out = Number(l.total_payable)-paid;
            const bcls = l.status==='completed'?'b-grey':l.status==='defaulted'?'b-red':'b-blue';
            // Detect duplicate — same member, same order, more than one active loan
            const isDup = isDuplicateLoan(l);
            return `<tr style="${isDup?'background:var(--warning-50);':l.status==='completed'?'background:var(--surface-2);color:var(--text-muted)':l.status==='defaulted'?'background:var(--danger-50)':''}">
              <td><b>${m?.full_name||'—'}</b>${isDup?` <span class="badge b-yellow" title="Duplicate loan detected — use ··· to delete">⚠ Duplicate</span>`:''}</td>
              <td>${grp?.name||'—'}</td>
              <td>${l.asset_name}</td>
              ${isAdmin ? `<td style="font-size:12px;color:var(--text-muted)">${off?.full_name||'—'}</td>` : ''}
              <td>${fmtDate(l.start_date)}</td>
              <td class="num">${KES(l.loan_value)}</td>
              <td class="num">${KES(l.weekly_installment)}</td>
              <td class="num">${KES(paid)}</td>
              <td class="num">${KES(out)}</td>
              <td><span class="badge ${bcls}">${l.status}</span></td>
              <td><button class="act-btn" onclick="loanActions(event,'${l.id}')">···</button></td>
            </tr>`;
          }).join('') || `<tr><td colspan="${isAdmin?11:10}"><div class="empty"><h4>No loans found</h4><p>Loans are created automatically when admins fulfill approved orders.</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  const loanSearchEl = $('loan-search');
  if(loanSearchEl){
    loanSearchEl.addEventListener('input', e=>{
      state._loanSearch = e.target.value;
      pageLoans();
      setTimeout(()=>{ const el=$('loan-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },0);
    });
  }
}
function loanActions(ev, id){
  const l = state.data.loans.find(x=>x.id===id);
  const r = state.staff?.app_role || state.staff?.role || 'officer';
  const isAdmin = state.staff.role==='admin';
  const canApproveLoan = can('approve_loan');
  const canRepay = canApproveLoan || r==='officer' || r==='loan_officer';

  // Detect if this loan is a duplicate (same member + same order, more than one active)
  const duplicateLoans = state.data.loans.filter(x =>
    x.id !== id &&
    x.member_id === l.member_id &&
    x.order_id  === l.order_id  &&
    x.status    === 'active'
  );
  const isDuplicate = duplicateLoans.length > 0;

  showActMenu(ev, [
    { label:'View member profile', onClick: ()=>{ state._memberProfileTab='loans'; go('memberProfile', { memberId: l.member_id }); } },
    { label:'View schedule', onClick: ()=>showLoanSchedule(l) },
    ...(canRepay && l.status==='active' ? [{ label:'📥 Record Repayment', onClick: ()=>openStandaloneRepayment(l.id, l.member_id) }] : []),
    ...(isDuplicate ? [{
      label:'⚠ Delete duplicate loan', danger:true, onClick: ()=>confirmDialog(
        `This loan appears to be a duplicate of another active loan for the same member (${state.data.members.find(m=>m.id===l.member_id)?.full_name||'—'}) on the same order. Delete this duplicate?`,
        async()=>{
          if(!(await ensureFreshToken())) return;
          const { error } = await sb.from('pb_loans').delete().eq('id', id);
          if(error) return toast('Delete failed: '+error.message,'error');
          state.data.loans = state.data.loans.filter(x=>x.id!==id);
          audit('delete_duplicate_loan','pb_loans',id,{ asset_name:l.asset_name, loan_value:l.loan_value });
          render();
          toast('Duplicate loan deleted.','success');
        },
        { title:'Delete Duplicate Loan', danger:true }
      )
    }] : []),
    ...(canApproveLoan && l.status==='active' ? [
      { label:'Transfer Loan', onClick: ()=>openLoanTransfer(l) },
      { label:'Restructure Loan', onClick: ()=>openLoanRestructure(l) },
      { label:'Mark as defaulted', danger:true, onClick: ()=>confirmDialog(
          'Mark this loan as defaulted? This action will be logged.',
          async()=>{
            await sb.from('pb_loans').update({ status:'defaulted' }).eq('id', id);
            l.status='defaulted'; audit('loan_default','pb_loans',id); render();
            toast('Loan marked as defaulted','warn');
          },
          { title:'Mark as defaulted', danger:true }
        )
      },
      'sep',
      { label:'🗑 Delete Loan', danger:true, onClick: ()=>confirmDialog(
          'PERMANENTLY delete this loan? All repayment records will remain but the loan will be removed. This cannot be undone.',
          async()=>{
            if(!(await ensureFreshToken())) return;
            const { error } = await sb.from('pb_loans').delete().eq('id', id);
            if(error) return toast('Delete failed: '+error.message,'error');
            state.data.loans = state.data.loans.filter(x=>x.id!==id);
            audit('delete_loan','pb_loans',id,{ asset_name:l.asset_name, member_id:l.member_id, loan_value:l.loan_value });
            render();
            toast('Loan deleted and action logged.','warn');
          },
          { title:'Delete Active Loan', danger:true }
        )
      }
    ] : [])
  ]);
}
function openLoanTransfer(l){
  const officers = state.data.staff.filter(s => (s.role === 'officer' || s.role === 'loan_officer') && s.status === 'active');
  if(!officers.length){ toast('No active loan officers found to transfer to.','warn'); return; }
  const currentOfficer = state.data.staff.find(s => s.id === l.officer_id);
  const optionsHtml = officers.map(function(o){
    const dis = o.id === l.officer_id ? ' disabled' : '';
    const cur = o.id === l.officer_id ? ' (current)' : '';
    return '<option value="' + o.id + '"' + dis + '>' + o.full_name + cur + '</option>';
  }).join('');
  modal({
    title: 'Transfer Loan: ' + l.asset_name,
    body: '<div style="font-size:13px;color:var(--text-muted);margin-bottom:14px">Reassign this loan to a different officer. Current officer: <b>' + (currentOfficer ? currentOfficer.full_name : 'Unknown') + '</b></div>'
        + '<div class="field"><label>Transfer to officer *</label>'
        + '<select id="lt-officer"><option value="">-- Select officer --</option>' + optionsHtml + '</select></div>',
    actions: [
      {
        label: 'Transfer', cls: 'btn-primary',
        onClick: async function(){
          const selectedId = document.getElementById('lt-officer') ? document.getElementById('lt-officer').value : '';
          if(!selectedId){ toast('Please select an officer.','warn'); return; }
          if(selectedId === l.officer_id){ toast('That officer already owns this loan.','warn'); return; }
          const newOfficer = officers.find(function(o){ return o.id === selectedId; });
          const res = await sb.from('pb_loans').update({ officer_id: selectedId }).eq('id', l.id);
          if(res.error){ toast('Transfer failed: ' + res.error.message,'error'); return; }
          const oldOfficerId = l.officer_id;
          l.officer_id = selectedId;
          audit('loan_transfer','pb_loans',l.id,{ officer_id: oldOfficerId },{ officer_id: selectedId, officer_name: newOfficer ? newOfficer.full_name : '' });
          closeModal(); render();
          toast('Loan transferred to ' + (newOfficer ? newOfficer.full_name : 'new officer'),'success');
        }
      },
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal }
    ]
  });
}

      </div>

    `,
    actions: [

      { label: 'Apply restructure', cls: 'btn-primary', onClick: async () => {
        const method     = document.getElementById('lr-method').value;
        const newWeekly  = Number(document.getElementById('lr-weekly').value)||0;
        const newTerm    = parseInt(document.getElementById('lr-term').value)||0;
        const effectDate = document.getElementById('lr-date').value;
        const reason     = (document.getElementById('lr-reason').value||'').trim();

        if(!effectDate) return toast('Please set the first repayment start date.','error');

        let finalWeekly, finalWeeks;
        if(method === 'weekly'){
          if(!newWeekly) return toast('Enter a valid weekly amount.','error');
          finalWeekly = newWeekly;
          finalWeeks  = Math.ceil(outstanding / finalWeekly);
        } else if(method === 'term'){
          if(!newTerm) return toast('Enter a valid number of weeks.','error');
          finalWeeks  = newTerm;
          finalWeekly = Math.round((outstanding / finalWeeks) * 100) / 100;
        } else {
          if(!newWeekly || !newTerm) return toast('Enter both weekly amount and term.','error');
          finalWeekly = newWeekly;
          finalWeeks  = newTerm;
        }

        if(finalWeeks > 96) return toast('Maximum restructured term is 96 weeks.','error');

        const endDate = new Date(effectDate);
        endDate.setDate(endDate.getDate() + 7 * finalWeeks);

        if(!(await ensureFreshToken())) return;
        const before = { weekly: l.weekly_installment, start_date: l.start_date, end: l.expected_end_date };
        const upd = { start_date: effectDate, weekly_installment: finalWeekly, expected_end_date: endDate.toISOString().slice(0,10) };
        const { error } = await sb.from('pb_loans').update(upd).eq('id', l.id);
        if(error) return toast('Failed: '+error.message,'error');
        Object.assign(l, upd);
        audit('loan_restructure','pb_loans',l.id,
          before,
          { start_date: effectDate, weekly: finalWeekly, weeks: finalWeeks, end: upd.expected_end_date, reason }
        );
        closeModal(); render();
        toast(`Loan restructured — new weekly: ${KES(finalWeekly)} for ${finalWeeks} weeks, ending ${fmtDate(upd.expected_end_date)}.`,'success');
      }}
    ]
  });

  // Show preview on load
  setTimeout(lrUpdatePreview, 40);
}

function updateWeeklyRateDisplay(val){
  const monthlyPct = parseFloat(val) || 0;
  const weeklyPct = monthlyPct / 4;

  const el = document.getElementById('weekly_rate_val');

function computeSchedule(principal, weekly, method, startDate){
  const monthlyRate = Number(state.settings?.monthly_interest_rate || 2.5) / 100;
  const weeklyRate = monthlyRate / 4;
  const HARD_CAP = 156; // 3 years absolute max to prevent infinite loop / compounding bloat
  const rows = [];
  if(method === 'flat'){
    // Company formula: totalInterest = principal * weeklyRate * (principal / weeklyInstallment)
    // This derives the number of periods directly from principal/installment ratio.
    let totalInterest = weekly > 0 ? principal * weeklyRate * (principal / weekly) : principal * weeklyRate * HARD_CAP;
    let totalPayable = principal + totalInterest;
    // Derive weeks from total payable, capped at HARD_CAP to prevent infinite loops
    let weeks = weekly > 0 ? Math.min(HARD_CAP, Math.ceil(totalPayable / weekly)) : HARD_CAP;
    if(!isFinite(weeks) || weeks < 1) weeks = HARD_CAP;
    // Recompute with final week count
    totalInterest = principal * weeklyRate * (principal / weekly);
    totalPayable = principal + totalInterest;
    const inst = totalPayable / weeks;
    let bal = totalPayable;
    const principalPerWk = principal / weeks;
    const interestPerWk = totalInterest / weeks;
    for(let w=1; w<=weeks; w++){
      bal -= inst;
      const due = new Date(startDate); due.setDate(due.getDate() + 7*w);
      rows.push({ w, due, principal:principalPerWk, interest:interestPerWk, installment:inst, balance:Math.max(0,bal) });
    }
    return { weeks, totalInterest, totalPayable, suggestedWeekly: totalPayable/weeks, rows };
  } else {
    let bal = principal; let w = 0; let totalInterest = 0;
    while(bal > 0.01 && w < HARD_CAP){
      w++;
      const interest = bal * weeklyRate;
      const principalPart = Math.min(bal, Math.max(0, weekly - interest));
      if(principalPart <= 0){ w = HARD_CAP; break; } // weekly too low to cover interest
      const installment = principalPart + interest;
      bal -= principalPart;
      totalInterest += interest;
      const due = new Date(startDate); due.setDate(due.getDate() + 7*w);
      rows.push({ w, due, principal:principalPart, interest, installment, balance:Math.max(0,bal) });
    }
    const totalPayable = principal + totalInterest;
    return { weeks: w, totalInterest, totalPayable, suggestedWeekly: totalPayable/Math.max(1,w), rows };
  }
}
const LOAN_SERVICE_CHARGE_RATE = 0.06;
function loanServiceCharge(principal){
  return Math.round((Number(principal)||0) * LOAN_SERVICE_CHARGE_RATE * 100) / 100;
}
function loanTotalWithServiceCharge(schedule, principal){
  return Math.round(((Number(schedule?.totalPayable)||0) + loanServiceCharge(principal)) * 100) / 100;
}

async function importInventory(input){
  const file = input.files[0];
  if(!file){ input.value=''; return; }
  if(!(await ensureFreshToken())){ input.value=''; return; }

  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array' });
      // Accept any sheet name — use the first sheet
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval:'' });

      if(!rows.length){ toast('No data rows found in the file.','error'); input.value=''; return; }

      // Flexible column mapping — handle variations in header names
      const colMap = (row) => {
        const keys = Object.keys(row);
        const find = (...candidates) => {
          for(const c of candidates){
            const k = keys.find(k=>k.toLowerCase().replace(/[\s_]/g,'').includes(c.toLowerCase().replace(/[\s_]/g,'')));
            if(k !== undefined) return row[k];
          }
          return '';
        };
        return {
          name:        String(find('name','asset','item','product','description')||'').trim(),
          category:    String(find('category','cat','type','group')||'Other').trim()||'Other',
          stock:       Number(find('stock','qty','quantity','units')||0),
          buying_price:Number(find('buying','cost','purchase','buyprice','costperunit')||0),
          loan_price:  Number(find('loan','selling','sell','loanprice','sellingprice')||0),
          reorder_level:Number(find('reorder','minimum','min','minstock')||5),
        };
      };

      const mapped = rows.map(colMap).filter(r=>r.name);
      if(!mapped.length){ toast('Could not find any rows with an asset name. Check the file has a "name" or "asset" column.','error'); input.value=''; return; }

      // Preview before importing
      modal({
        title:`Import ${mapped.length} assets`,
        size:'lg',
        body:`
          <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">
            Found <b>${mapped.length} assets</b> in the file. Review below then confirm to add them all to inventory.
            Assets already in the system will be <b>skipped</b> (matched by name).
          </div>
          <div style="max-height:320px;overflow-y:auto">
            <table class="tbl" style="font-size:12px">
              <thead><tr><th>Name</th><th>Category</th><th class="num">Qty</th><th class="num">Cost/unit</th><th class="num">Loan price</th></tr></thead>
              <tbody>
                ${mapped.map(r=>`<tr>
                  <td>${r.name}</td><td>${r.category}</td>
                  <td class="num">${r.stock}</td>
                  <td class="num">${KES(r.buying_price)}</td>
                  <td class="num">${KES(r.loan_price)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        `,
        actions:[
          { label:'Cancel', onClick: ()=>{ closeModal(); input.value=''; } },
          { label:`Import all ${mapped.length}`, cls:'btn-primary', onClick: async ()=>{
            closeModal();
            let added=0, skipped=0, failed=0;
            for(const row of mapped){
              const exists = state.data.inventory.find(a=>a.name.toLowerCase()===row.name.toLowerCase());
              if(exists){ skipped++; continue; }
              const { data, error } = await sb.from('pb_inventory').insert({ ...row, business_id: state.staff.business_id || null }).select().single();
              if(error){ failed++; console.warn('Import failed for',row.name,error.message); }
              else { state.data.inventory.push(data); added++; }
            }
            input.value='';
            render();
            toast(`Import done: ${added} added, ${skipped} skipped (already exist), ${failed} failed.`, failed>0?'warn':'success');
          }}
        ]
      });
    } catch(err){
      toast('Could not read file: '+err.message,'error');
      input.value='';
    }
  };
  reader.readAsArrayBuffer(file);
}
